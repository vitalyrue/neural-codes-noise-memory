chapter_id: ch:FOUNDATIONS
part_id: part:MECHANISMS
title: Patterns of variable spikes can represent a value
purpose: Nerve cells communicate with brief electrical spikes. This chapter first follows those spikes
  to eye muscles and explains how repeated activation holds an angle. It then shows how firing rates across
  a group of cells can represent an eye angle or an animal’s location, and how variable spike timing affects
  that representation. These ideas supply the biological and probability background for the three papers.
