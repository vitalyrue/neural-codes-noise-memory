- visual_id: fig:PLACE-GP-TO-FIRING
  block_id: fig:PLACE-GP-TO-FIRING
  asset: candidate-content/visuals/candidates/20261024-all/A07/figure.png
  status: candidate
  embedded: false
  origin: Original analytic or simulated teaching construction; not experimental data.
  source_status: Mainali et al. (2025), Fig. 1A, p. 1112 / PDF page 4; STAR Methods Model
    details, Eqs. 2–3, p. e1 / PDF page 13; supplement Methods S1, printed p. 8 / PDF
    page 9.
  rights: Original guide figure
  generator: verification/all-illustrations-20261024/draw_eye_place.py
  vector_source: candidate-content/visuals/candidates/20261024-all/A07/figure.svg
  placement: sec:PLACE-GP
  caption: One fixed Gaussian input draw becomes a nonnegative firing map through $F(x)=a[z(x)-q]_+$.
    Values below $q$ become zero; values above $q$ keep their relative heights after subtraction
    and scaling. The shaded connected intervals are the model fields. This is a simulated
    teaching map with chosen parameters, not a recorded cell. Based on Mainali et al.
    (2025), Fig. 1A and STAR Methods Eqs. 2–3, p. e1.
  accessibility_description: The upper plot shows one fixed smooth input against spatial
    position, with a threshold at 0.8 and shaded intervals above it. The lower plot uses
    the same positions and plots six times the positive excess above the threshold in
    hertz. Its connected positive intervals align with the upper shading; all other positions
    have zero firing.
  teaching_introduction: A simulated Gaussian input map with covariance $C(\Delta x)=\exp[-(\Delta
    x/\sigma)^2/2]$ gives the firing map below when $q=0.8$ and $a=6$ Hz. Position is
    shown in units of $\sigma$.
  interpretation: Thresholding changes the distribution of values and can separate one
    smooth input curve into several fields. Both panels describe the same fixed map over
    space, so neither curve is a trajectory over time.
