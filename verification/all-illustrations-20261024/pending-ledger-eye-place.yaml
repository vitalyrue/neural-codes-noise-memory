  block_id: fig:EYE-SHARED-PRIVATE-VARIANCE
  asset: candidate-content/visuals/candidates/20261024-all/A05/figure.png
  status: candidate
  embedded: false
  origin: Original analytic or simulated teaching construction; not experimental data.
  source_status: Ben-Shushan et al. (2022), main p. 10 / PDF page 10, Eqs. 11–15; Chapter
