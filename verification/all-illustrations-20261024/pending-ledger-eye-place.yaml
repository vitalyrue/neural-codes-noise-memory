  rights: Original guide figure
  generator: verification/all-illustrations-20261024/draw_eye_place.py
  vector_source: candidate-content/visuals/candidates/20261024-all/A05/figure.svg
  placement: sec:EYE-CHI
  caption: The same common variance enters movement and the single cell predictor, but
    the predictor has much more private noise. Increasing only private predictor variance
    lowers correlation R while the common movement fraction χ stays at 0.82. The marked
    point uses the chapter’s constructed example. Calculations assume unit common gain
    and mutually uncorrelated contributions; they are not recorded cell data. Based on
    Ben-Shushan et al. (2022), main p. 10, Eqs. 11–15.
  accessibility_description: 'Horizontal stacked bars use one variance axis in degrees
    squared: movement has common variance 0.00820 and other variance 0.00180; the single
    cell prediction has the same common variance and private variance 0.22446. A curve
    shows R falling as private predictor variance increases, reaching 0.170 at the constructed
    point, while χ remains 0.820.'
  teaching_introduction: The constructed variance example above gives a small correlation
    even though the common command supplies most of the movement variance.
  interpretation: Private prediction noise enlarges the denominator of R without changing
    the covariance. The bars use the same physical scale, so the equal common pieces have
    equal lengths.
