required_items:
- Rates change by slope times the same small position displacement.
- At plus0.1m, changes are plus0.2Hz and minus0.1Hz.
- Covariance negative0.02Hz² and correlation minus1 apply only to the shared displacement
  contribution.
- No arrow or wiring claims an inhibitory connection.
language_contract:
  book_loci:
  - sec:SYNTHESIS-COVARIANCE-EXAMPLE
  caption: A common displacement of $+0.1$ m increases rate 1 by $0.2$ Hz and decreases
    rate 2 by $0.1$ Hz. The changes lie on one line. With displacement variance $0.01$
    m², their covariance is $-0.02$ Hz² and their correlation is $-1$. The 10 Hz baseline
    is chosen only to display positive rates. These are exact lines from the guide’s local
    example, not recorded data.
  alt_text: The upper plot shows two fixed linear tuning curves with slopes plus two and
    minus one hertz per meter, crossing at ten hertz. Moving from zero to plus 0.1 meter
    raises the first rate by 0.2 hertz and lowers the second by 0.1 hertz. The lower plot
    puts the paired rate changes on a downward sloping line through zero, with that example
    marked.
  teaching_introduction: For the same slopes, set both expected rates to 10 Hz at the
    starting position. The upper plot shows the fixed rate curves; the lower plot shows
    their changes under a common position displacement.
  conclusion: Both changes are set by the same position displacement, so they occupy one
    direction in the two-rate plane. Independent private fluctuations would spread them
    away from that line.
