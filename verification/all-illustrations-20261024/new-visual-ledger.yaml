- visual_id: fig:MEMORY-TUNING-INFORMATION
  block_id: fig:MEMORY-TUNING-INFORMATION
  asset: assets/approved/visuals/memory-tuning-information.png
  status: selected
  embedded: true
  sha256: 043d067e7ee2b76bd7db1fd752c6e15aae8fbbb5af672127cab75dd117425442
  vector_source: assets/approved/visuals/memory-tuning-information.svg
  caption_and_alt: content/chapters/03-memory-information.yaml
  caption: Analytic teaching curves $r_A(\theta)=5+35e^{-\theta^2/(2w^2)}$ and $r_B(\theta)=r_A(\theta)+20$,
    in spikes per second, with chosen width $w=0.6$ rad. The rates have the same derivative.
    Their individual Poisson information contributions $(r_i^{\prime})^2/r_i$ vanish at
    the rate peak, where the slope is zero, and are positive on the flanks. Adding baseline
    firing raises the count noise without changing the slope, reducing local information.
    These are illustrative tuning curves, not recorded neurons or a demonstrated attractor
    network.
  accessibility_description: The first plot shows two positive peaked rate curves separated
    by a constant twenty spikes per second. The second shows their shared derivative,
    positive to the left, zero at the central peak and negative to the right. The third
    shows squared slope divided by rate for each curve. Both contributions vanish at the
    center and rise on the flanks; the higher baseline curve contributes less at every
    point with nonzero slope.
  teaching_introduction: Two positive tuning curves with the same changing part isolate
    the effect of extra baseline firing.
  interpretation: The rate peak has zero local slope, so it contributes no local information
    at that point. Extra spikes from a constant baseline increase Poisson variability
    without making nearby values easier to distinguish.
  source_status: Guide sec:MEMORY-FI, J=sum_i (r_i prime)^2/r_i and positive-rate condition;
    Burak and Fiete (2012), main PDF p. 2, Eq. 3; SI PDF pp. 9–10, Eqs. S42–S44.
  placement: sec:MEMORY-FI
  origin: Original analytic or simulated teaching construction; not experimental data.
  rights: Original guide figure
  toc_correspondence: sec:MEMORY-FI
