  block_id: fig:FOUNDATIONS-POISSON-POPULATION
  asset: assets/approved/visuals/foundations-poisson-population.png
  status: selected
  embedded: true
  sha256: 08625d38a6133fe9b96e13238e1ef32775e32c6b55f405b046537779c80ca603
  vector_source: assets/approved/visuals/foundations-poisson-population.svg
  caption_and_alt: content/chapters/01-foundations.yaml
  caption: Analytic teaching construction for the chapter’s 20 Hz, 50 ms example. The
    count is Poisson with mean 1 for one cell and mean 20 for 20 conditionally independent
    cells. Both panels plot the rate per cell $K/(N\Delta t)$, so both estimates have
    mean 20 Hz; their standard deviations are 20 Hz and 4.47 Hz. Each stem is a probability
    at one possible estimate, rather than a continuous density. Only estimates through
    100 Hz are drawn. The independence condition concerns fixed modeled rates, not complete
    recurrent spike trains.
  accessibility_description: Two discrete Poisson distributions share a rate per cell
    axis. One cell has widely spaced possible estimates at zero, twenty, forty hertz and
    so on, with probability 0.368 at zero. The twenty cell estimate has possible values
    one hertz apart and clusters around twenty hertz. Their means match, but the rate
    standard deviation falls from twenty to 4.47 hertz.
  teaching_introduction: The two count distributions can be compared on the same rate
    per cell scale.
  interpretation: Dividing the pooled rate estimate by 20 keeps the expected rate per
    cell fixed, while independent averaging reduces its relative spread.
  source_status: Guide sec:FOUNDATIONS-POISSON, exact 20 Hz / 50 ms example; Burak and
    Fiete (2012), main PDF p. 1, Results, Poisson model; SI PDF p. 9, Eq. S43, conditional
    count likelihood.
