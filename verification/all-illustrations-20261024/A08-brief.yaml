teaching_goal: Writing dimensionless size as $w=\beta^{d/2}s$ removes the size scale.
  The dimensional size laws then differ in shape, while the transformed variable $U=\beta
  s^{2/d}=w^{2/d}$ has the same exponential law.
source_locator: Mainali et al. (2025), main p. 1111 / PDF page 3, Eq. 1; supplement
  Methods S3, printed p. 12 / PDF page 13, high-threshold distributions and moment
  relation before S18. Chapter 5 PLACE-SIZE-LAW corrects the printed S18 mean-scale
  algebra.
