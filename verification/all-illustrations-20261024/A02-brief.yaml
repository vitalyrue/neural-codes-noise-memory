required_items:
- Seven sampled Gaussian independent-increment paths start at zero.
- Exact ±sqrt(2Dt) envelope identified as RMS, not confidence or hard boundary.
- RMS and vt cross at t=4 s, displacement .40 deg.
- No periodic coordinate or saturation; do not duplicate line-versus-ring figure.
source_locator: Guide sec:FOUNDATIONS-DIFFUSION, exact D=.02 and v=.10 example; Burak
  and Fiete (2012), main PDF p. 2, Diffusive Drift due to Ongoing Neural Noise; SI PDF
  pp. 4–5, Systematic drift, and p. 7, Eq. S30.
language_contract:
  book_loci:
  - sec:FOUNDATIONS-DIFFUSION
  caption: Simulated Brownian teaching paths and analytic displacement scales for $D=0.02$
    degrees squared per second and $v=0.10$ degrees per second. The upper paths have zero
    drift and start at zero; the dashed envelope is the exact root mean squared displacement,
    not a boundary on individual paths. Below, $\sqrt{2Dt}$ and $vt$ are equal at 4 s,
    when each is 0.40 degrees. Their squares are the separate contributions to the biased
    model’s MSD. The coordinate is unbounded, and these chosen values are not estimates
    from animal recordings.
  alt_text: Seven Brownian sample paths move irregularly above and below zero. A dashed
    positive and negative root mean squared envelope grows with the square root of time;
    some paths cross it. A second plot compares the positive root mean squared displacement
    with a linearly growing bias displacement. Both equal 0.40 degrees at four seconds,
    after which the bias line is higher.
  teaching_introduction: Sample paths show the irregular motion; exact displacement scales
    show how its spread differs from a fixed bias.
  conclusion: A single path can turn back toward zero even while the root mean squared
    displacement grows. A constant bias grows linearly, so it eventually exceeds the square
    root growth of the random displacement scale.
