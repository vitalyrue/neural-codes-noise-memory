- id: A04
  visual_id: fig:MEMORY-BOUND-STRICTNESS
  asset: candidate-content/visuals/candidates/20261024-all/A04/figure.png
  caption: Analytic teaching calculation for the chapter’s mutual inhibition example,
    with $b=200$ activation units and $\tau=0.1$ s. The coordinate $\theta$ is an activation
    difference. For positive rates $r_{1,2}=(b\pm\theta)/(2\tau)$, $J=2000/(40000-\theta^2)$
    while $D=1000$ activation units squared per second. The lower bound $1/(2\tau^2J)$
    equals $D$ at $\theta=0$ and falls to 750 at $\theta=100$. Higher local information
    permits a lower diffusion bound but leaves the actual diffusion unchanged in this
    model. The plotted range stays inside the positive-rate domain $|\theta|<200$.
  alt: Across memory coordinates from minus one hundred sixty to one hundred sixty activation
    units, internal information has a minimum of 0.05 at zero and grows toward either
    side. Actual diffusion is a horizontal line at one thousand. The information lower
    bound meets it at zero and bends downward, reaching seven hundred fifty at coordinate
    one hundred. A marked gap separates actual diffusion from the bound there.
  author: /root/all_draw_foundations_information
  status: candidate
  review_contract:
    schema_version: 1
    figure_role: quantitative-figure
    route: vector
    unit_scope: chapter
    author: /root/all_draw_foundations_information
    role_reason: Show by an existing exact example that higher information can loosen
      a bound while actual diffusion stays fixed.
    source_files:
    - content/chapters/03-memory-information.md
    - content/chapters/03-memory-information.yaml
