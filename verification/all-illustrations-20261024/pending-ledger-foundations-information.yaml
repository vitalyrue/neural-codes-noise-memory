- id: A03
  visual_id: fig:MEMORY-TUNING-INFORMATION
  asset: candidate-content/visuals/candidates/20261024-all/A03/figure.png
  caption: Analytic teaching curves $r_A(\theta)=5+35e^{-\theta^2/(2w^2)}$ and $r_B(\theta)=r_A(\theta)+20$,
    in spikes per second, with chosen width $w=0.6$ rad. The rates have the same derivative.
    Their individual Poisson information contributions $(r_i^{\prime})^2/r_i$ vanish at
    the rate peak, where the slope is zero, and are positive on the flanks. Adding baseline
    firing raises the count noise without changing the slope, reducing local information.
    These are illustrative tuning curves, not recorded neurons or a demonstrated attractor
    network.
  alt: The first plot shows two positive peaked rate curves separated by a constant twenty
    spikes per second. The second shows their shared derivative, positive to the left,
    zero at the central peak and negative to the right. The third shows squared slope
    divided by rate for each curve. Both contributions vanish at the center and rise on
    the flanks; the higher baseline curve contributes less at every point with nonzero
    slope.
  author: /root/all_draw_foundations_information
  status: candidate
  review_contract:
