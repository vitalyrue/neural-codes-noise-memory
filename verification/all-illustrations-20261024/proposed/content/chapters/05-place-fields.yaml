- id: fig:PLACE-CROSSINGS
  kind: figure
  placement: sec:PLACE-KAC-RICE
  asset: assets/approved/visuals/place-crossings.png
  caption: Two upcrossings start two new fields, and one field is already active at the
    left edge. The local tangent panels show that a steeper crossing occupies a narrower
    threshold band, while slope weighting makes each crossing contribute one. This is
    a guide construction, not a sampled cell or a new fit; it illustrates Mainali et al.
    (2025), Figure 1A–B and Supplemental Methods S3, Equations S11–S15.
  alt: A constructed smooth curve crosses q upward twice and has three active intervals
    because the first begins before the left edge of the track. One full field and one
    gap are marked. Two local tangent plots use the same vertical band q plus or minus
    epsilon; the steeper slope has a narrower horizontal width 2 epsilon divided by v,
    and slope times width divided by 2 epsilon equals one in both cases.
  width_inches: 7.29167
  html_fold: never
- id: fig:PLACE-SIZE-GEOMETRY
  kind: figure
  placement: sec:PLACE-SIZE-LAW
  asset: assets/approved/visuals/place-size-geometry.png
  caption: In the high-threshold approximation, excess peak height fixes a radius, and
    converting that radius into length, area, or volume gives powers 2, 1, and 2/3 in
    $U=\beta s^{2/d}$. The round regions are a guide reconstruction of the limiting geometry,
    not observed field shapes; see Mainali et al. (2025), Equation 1 and Supplemental
    Methods S4, with the parabola constants checked in this chapter.
  alt: A local parabola stands epsilon above threshold q, and its full width is twice
    r star. U equals q times epsilon and r star is approximately square root of two times
    sigma divided by q times square root of U. The same radius gives an interval of length
    2 r star, a disk of area pi r star squared, or a ball of volume four pi r star cubed
    over three. Therefore U depends on size to powers 2, 1, and 2/3.
  width_inches: 7.29167
  html_fold: never
- id: fig:PLACE-TOPOLOGY
  kind: figure
  placement: sec:PLACE-TOPOLOGY
  asset: assets/approved/visuals/place-topology.png
  caption: As the threshold rises on one constructed smooth map, components and holes
    change separately, giving Euler characteristics -1, 0, 4, and 3. The above-threshold
    regions shrink as the threshold rises, even though this signed count does not change
    in one direction. This guide example is not an observed place-field map or a Gaussian-process
    sample; it illustrates Mainali et al. (2025), Figure 3F–H and STAR Methods Equations
    8–10.
  alt: Four thresholds of the same smooth two-dimensional map show one component with
    two holes and chi minus one; one component with one hole and chi zero; four components
    with no holes and chi four; and three components with no holes and chi three. Each
    active set is contained in the preceding one as q increases from 0.3 to 0.5, 0.8 and
    1.0.
  width_inches: 7.29167
  html_fold: never
- id: fig:PLACE-GP-TO-FIRING
  kind: figure
  placement: sec:PLACE-GP
  asset: assets/approved/visuals/place-gp-to-firing.png
  caption: One fixed Gaussian input draw becomes a nonnegative firing map through $F(x)=a[z(x)-q]_+$.
    Values below $q$ become zero; values above $q$ keep their relative heights after subtraction
    and scaling. The shaded connected intervals are the model fields. This is a simulated
    teaching map with chosen parameters, not a recorded cell. Based on Mainali et al.
    (2025), Fig. 1A and STAR Methods Eqs. 2–3, p. e1.
  alt: The upper plot shows one fixed smooth input against spatial position, with a threshold
    at 0.8 and shaded intervals above it. The lower plot uses the same positions and plots
    six times the positive excess above the threshold in hertz. Its connected positive
    intervals align with the upper shading; all other positions have zero firing.
  width_inches: 7.29167
  html_fold: never
- id: fig:PLACE-SIZE-DENSITY-COLLAPSE
  kind: figure
  placement: sec:PLACE-SIZE-LAW
  asset: assets/approved/visuals/place-size-density-collapse.png
  caption: 'The limiting size densities differ with spatial dimension: one dimensional
    length is Rayleigh, two dimensional area is exponential, and three dimensional volume
    has a density that rises without bound as size approaches zero, while its integral
    remains one. Their survival probabilities, the probabilities of exceeding a threshold,
    coincide after transformation to $U=\beta s^{2/d}$, where $\Pr(U>u)=e^{-u}$. These
    are exact calculations from the high-threshold limiting law, not finite-threshold
    simulations or measured histograms. Based on Mainali et al. (2025), main Eq. 1, p.
    1111, and Methods S3.'
  alt: Three density curves against dimensionless size w show the one dimensional curve
    starting at zero, the two dimensional curve starting at one, and the three dimensional
    curve rising without bound toward zero size. An arrow marks the unbounded end. In
    the second panel, three differently styled survival curves coincide on exp(-u) after
    U=w^(2/d).
  width_inches: 7.29167
  html_fold: never
