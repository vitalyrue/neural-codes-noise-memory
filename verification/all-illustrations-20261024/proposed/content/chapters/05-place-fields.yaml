chapter_id: ch:PLACE-FIELDS
part_id: part:OBSERVATIONS
title: Why place fields have different sizes and shapes
purpose: A cell recorded on a short track may have one smooth firing hill. On a long track,
  the same kind of cell may have several separated fields, each with a different width
  and height. In a room, its active regions can bend, split, and surround inactive holes.
  How could one model produce this variety and still make useful predictions?
role: chapter
page_break_before: true
