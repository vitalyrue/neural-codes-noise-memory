section_list:
- id: sec:MEMORY-FI
  title: Deriving information from the spike count likelihood
  summary: Suppose two nearby memory values produce almost identical rates. A short spike
    sample cannot reliably tell them apart. If a small change in memory instead produces
    a large rate change relative to spike variability, that sample is more useful. We
    need a quantity that measures this local distinction.
  level: 2
- id: sec:MEMORY-BOUND
  title: The information diffusion inequality, step by step
  summary: The network has no access to its exact firing rates as noiseless numbers. Its
    recurrent input is built from the same random spikes that an external observer sees.
    The lower bound on diffusion follows directly by comparing the state sensitivity of
    the network with the spike information.
  level: 2
- id: sec:MEMORY-COMPARISONS
  title: What changes actually improve persistence?
  summary: The inequality compares diffusion and information for the same network. To
    compare different networks, we must say what stays fixed. Otherwise an apparent benefit
    of a parameter change may come from changing another property at the same time.
  level: 2
- id: sec:MEMORY-READOUT-SETUP
  title: Readout trades count noise against motion during observation
  summary: At time $T$, a recall cue arrives. The observer now wants the original value
    $\Theta$, but only has access to future spikes. The network has already diffused during
    storage. Even perfect knowledge of the state $\theta(T)$ cannot recover its particular
    earlier random displacements.
  level: 2
- id: sec:MEMORY-NAIVE
  title: Why averaging for too long becomes harmful
  summary: A decoder designed for a stationary state averages its observations with equal
    weight. That reduces independent observation noise, but late observations reflect
    a state that has moved further from $x$.
  level: 2
- id: sec:MEMORY-IDEAL
  title: Deriving the ideal observer's readout curve
  summary: An observer that accounts for diffusion can use later observations without
    confusing them with direct measurements of $x$. Their value is limited by the motion
    separating them from $x$. We can derive its error by combining information backward
    from the end of the observation interval.
  level: 2
- id: sec:MEMORY-PARTIAL
  title: Limited access can make observation slower
  summary: A downstream area may receive only some of the memory network's spikes. That
    reduces its information without reducing the fluctuations that already move the full
    memory network.
  level: 2
- id: sec:MEMORY-EXTENSIONS
  title: Two cellular time scales and a different noise law
  summary: The time constant in the inequality comes from the dynamics that carry an activation
    fluctuation into a lasting memory change. If those dynamics contain both synaptic
    and rate relaxation, which time constant matters?
  level: 2
- id: sec:MEMORY-FIG3-AND-CAUTION
  title: Reading the readout curves and the printed error bound
  summary: Figure 3 isolates readout uncertainty, rescaling variance by $\sqrt{2D/J}$
    and duration by $L^*$. In these axes the ideal curve is $\coth z$ and the naive curve
    is $z/3+1/z$. Both diverge like $1/z$ at short durations because too few spikes are
    available. The ideal solid curve approaches one. The naive dashed curve reaches $2/\sqrt3$
    at $z=\sqrt3$, then rises because its equal weighting gives increasing importance
    to displaced states. The dotted vertical line marks that naive optimum. The storage
    delay contribution $2DT$ is not part of these rescaled curves. Figure S2 repeats the
    comparison for partial access, showing the rightward and upward shifts when $\alpha=0.1$.[^p1-fig3]
  level: 2
