chapter_id: ch:MEMORY-INFORMATION
part_id: part:MECHANISMS
title: Information, memory loss, and the time needed for recall
purpose: A downstream neuron reads a memory through spikes. Collecting more spikes helps
  distinguish nearby activity patterns, but during collection the pattern itself keeps
  moving. The same variability that limits readout also perturbs the recurrent network.
  Burak and Fiete connect these two effects by deriving a lower bound on memory diffusion
  from the information in the spikes.
