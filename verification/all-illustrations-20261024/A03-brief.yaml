parameters:
  baseline_A_Hz: 5
  baseline_B_Hz: 25
  peak_above_baseline_Hz: 35
  width_rad: 0.6
  theta_range_rad:
  - -2
  - 2
required_items:
- Strictly positive rate curves.
- Same derivative in both examples.
- Zero slope and zero information at theta=0.
- Individual information contributions use squared slope divided by own rate.
- Chosen curves are not claimed to form a full recurrent attractor.
source_locator: Guide sec:MEMORY-FI, J=sum_i (r_i prime)^2/r_i and positive-rate condition;
  Burak and Fiete (2012), main PDF p. 2, Eq. 3; SI PDF pp. 9–10, Eqs. S42–S44.
language_contract:
  book_loci:
  - sec:MEMORY-FI
  caption: Analytic teaching curves $r_A(\theta)=5+35e^{-\theta^2/(2w^2)}$ and $r_B(\theta)=r_A(\theta)+20$,
    in spikes per second, with chosen width $w=0.6$ rad. The rates have the same derivative.
    Their individual Poisson information contributions $(r_i^{\prime})^2/r_i$ vanish at
    the rate peak, where the slope is zero, and are positive on the flanks. Adding baseline
    firing raises the count noise without changing the slope, reducing local information.
    These are illustrative tuning curves, not recorded neurons or a demonstrated attractor
    network.
  alt_text: The first plot shows two positive peaked rate curves separated by a constant
    twenty spikes per second. The second shows their shared derivative, positive to the
    left, zero at the central peak and negative to the right. The third shows squared
    slope divided by rate for each curve. Both contributions vanish at the center and
    rise on the flanks; the higher baseline curve contributes less at every point with
    nonzero slope.
  teaching_introduction: Two positive tuning curves with the same changing part isolate
    the effect of extra baseline firing.
  conclusion: The rate peak has zero local slope, so it contributes no local information
    at that point. Extra spikes from a constant baseline increase Poisson variability
    without making nearby values easier to distinguish.
