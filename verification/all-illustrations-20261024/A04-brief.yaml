parameters:
  b_activation_units: 200
  tau_s: 0.1
  theta_range_activation_units:
  - -160
  - 160
  marked_theta:
  - 0
  - 100
required_items:
- J=.05 at theta0 and 1/15 at theta100.
- Actual D=1000 throughout displayed interior domain.
- Bound=1000 at theta0 and 750 at theta100.
- Activation coordinate is not an angular coordinate.
- No claim that arbitrary higher information reduces actual diffusion.
source_locator: Guide sec:MEMORY-BOUND, exact b=200, tau=.1 mutual inhibition example;
  Ch. 2 mutual inhibition derivation; Burak and Fiete (2012), main PDF p. 3, Eq. 4
  and Fig. 2E–G; SI PDF pp. 10–11, Eqs. S45–S49.
language_contract:
  book_loci:
  - sec:MEMORY-BOUND
  caption: Analytic teaching calculation for the chapter’s mutual inhibition example,
    with $b=200$ activation units and $\tau=0.1$ s. The coordinate $\theta$ is an
    activation difference. For positive rates $r_{1,2}=(b\pm\theta)/(2\tau)$, $J=2000/(40000-\theta^2)$
    while $D=1000$ activation units squared per second. The lower bound $1/(2\tau^2J)$
    equals $D$ at $\theta=0$ and falls to 750 at $\theta=100$. Higher local information
    permits a lower diffusion bound but leaves the actual diffusion unchanged in this
    model. The plotted range stays inside the positive-rate domain $|\theta|<200$.
  alt_text: Across memory coordinates from minus one hundred sixty to one hundred
    sixty activation units, internal information has a minimum of 0.05 at zero and
    grows toward either side. Actual diffusion is a horizontal line at one thousand.
    The information lower bound meets it at zero and bends downward, reaching seven
    hundred fifty at coordinate one hundred. A marked gap separates actual diffusion
    from the bound there.
  teaching_introduction: The chapter’s two cell example makes the difference between
    a lower bound and the actual diffusion visible.
  conclusion: The gap at $\theta=100$ shows why a lower minimum allowed by the inequality
    is not a reduction in the network’s actual diffusion.
