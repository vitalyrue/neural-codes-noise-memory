  teaching_introduction: The same local radius gives a length, an area, or a volume depending
    on the dimension of the region.
  caption: In the high-threshold approximation, excess peak height fixes a radius, and
    converting that radius into length, area, or volume gives powers 2, 1, and 2/3 in
    $U=\beta s^{2/d}$. The round regions are a guide reconstruction of the limiting geometry,
    not observed field shapes; see Mainali et al. (2025), Equation 1 and Supplemental
    Methods S4, with the parabola constants checked in this chapter.
  interpretation: The changing power comes from geometry. The round shape and exponential
    excess belong to the high-threshold limit, so they do not make every measured place
    field spherical.
  accessibility_description: A local parabola stands epsilon above threshold q, and its
    full width is twice r star. U equals q times epsilon and r star is approximately square
    root of two times sigma divided by q times square root of U. The same radius gives
    an interval of length 2 r star, a disk of area pi r star squared, or a ball of volume
    four pi r star cubed over three. Therefore U depends on size to powers 2, 1, and 2/3.
