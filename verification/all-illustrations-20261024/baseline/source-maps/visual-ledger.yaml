- visual_id: fig:MEMORY-READOUT-TIMELINE
  block_id: fig:MEMORY-READOUT-TIMELINE
  asset: assets/approved/visuals/memory-readout-timeline.png
  sha256: 5810a3ae334641b7a151b746628dd3d858e7ac541fcfad6e6bc5bcd11ca4d8e0
