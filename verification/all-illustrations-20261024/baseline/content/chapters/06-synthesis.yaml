- id: sec:SYNTHESIS-EVIDENCE
  title: What makes an experimental test restrictive
  summary: A model that matches one distribution may have enough adjustable parameters
    to do so for several different reasons. The place-field paper gains support by
    fitting arrangement parameters and then comparing additional features, including
    slices and shape statistics. The separate firing-rate multiplier used in some
    comparisons should remain visible when counting how many quantities were predicted
    without further fitting. A successful high-threshold formula is also a statement
    about its limiting assumptions; finite-threshold simulations and the original
    recordings provide different kinds of checks.
  level: 2
- id: sec:SYNTHESIS-RELATED
  title: Related work and what it changes
  summary: 'The foundational eye-position account is Seung''s line-attractor model.
    Aksay and colleagues then used recordings and perturbations in goldfish to constrain
    integrator circuitry. These establish the dynamical problem and experimental architecture
    behind the 2022 model. Neither supplies the macaque displacement-variance estimate.
    Burak and Fiete''s earlier grid-cell study puts a related integrator problem in
    navigation: recurrent population activity is driven by velocity and accumulates
    path-integration errors. Its accuracy ranges belong to the simulated networks
    and parameter choices, rather than all biological grid circuits.[^s-attractors]'
  level: 2
- id: sec:SYNTHESIS-NEXT
  title: A joint comparison that remains to be done
  summary: The combined calculation suggests a concrete research direction. For the
    same population, first estimate the tuning maps with their uncertainty. Then measure
    fluctuations during periods where external anchoring is weak and test whether
    their covariance is aligned with changes along those maps. Fit diffusion only
    over a range where the local approximation and measurement corrections are justified.
    A downstream behavioral comparison must additionally include the physical or neural
    filters between representation and measurement.
  level: 2
