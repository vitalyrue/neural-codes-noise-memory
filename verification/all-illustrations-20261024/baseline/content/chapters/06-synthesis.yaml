chapter_id: ch:SYNTHESIS
part_id: part:OBSERVATIONS
title: Relating spatial codes, memory, and behavior
purpose: A model can explain the shape of a neural code without explaining how that
  code is maintained. It can also explain fluctuations inside a circuit without uniquely
  locating the source of a measured behavior. The three papers become more useful
  together when these different claims are kept attached to their actual mathematical
  and experimental tests.
