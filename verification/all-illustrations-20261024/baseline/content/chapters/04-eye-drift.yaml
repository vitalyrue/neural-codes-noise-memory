chapter_id: ch:EYE-DRIFT
part_id: part:OBSERVATIONS
title: Why the eyes drift during fixation
purpose: 'Looking steadily at a small spot does not hold the eye perfectly still.
  Between brief, rapid movements called [**microsaccades**]{.definition-term custom-style="Definition
  Term"}, the eye makes a small, smooth, irregular movement called [**fixational drift**]{.definition-term
  custom-style="Definition Term"}. Does this movement begin as noise in the muscles,
  or does the brain send a changing command to them? Ben-Shushan and colleagues answer
  this in two stages. Their recordings support a large shared drive upstream of the
  motor neurons. Their model then proposes a particular source: random motion of the
  eye position stored in a memory circuit.'
role: chapter
page_break_before: true
