blocks:
- id: tbl:EXAM-MAP
  kind: table
  placement: sec:EXAM-MAP
  headers:
  - Question and system
  - Reasoning chain
  - What the result establishes
  rows:
  - - '**[Memory: Burak and Fiete (2012)](#sec-exam-memory).** A modeled recurrent neural circuit retains a
      continuous value after its cue ends.'
    - Spikes renew synaptic activity → fixed connections sustain a family of activity patterns → some noise
      survives relaxation as a value change → Fisher information constrains how small that change can be.
    - A lower bound links memory diffusion to spike precision and synaptic decay. Simulated networks test the
      theory; this paper does not fit animal memory errors.
  - - '**[Eye drift: Ben-Shushan et al. (2022)](#sec-exam-eye).** Motor-neuron spikes and horizontal fixation
      movements were recorded in macaque monkeys.'
    - Calibrate spikes into predicted displacement → compare predicted and measured movement → separate shared
      variance from private noise → test how muscles filter candidate noise sources.
    - The recordings support a large shared contribution; the model explains how a diffusing command can produce
      smooth motion. They do not uniquely locate the source in one circuit.
  - - '**[Place fields: Mainali et al. (2025)](#sec-exam-place).** Spatial firing patterns in rodents and bats
      are compared with a statistical model.'
    - Draw a correlated Gaussian spatial map → apply a threshold → count crossings and active regions → use
      high-peak geometry for sizes → compare dimension, slices and holes.
    - One model predicts several spatial statistics. Crossing formulas can be exact within the Gaussian model;
      the universal size laws require a high-threshold limit.
  caption: Choose the physical question before choosing an equation.
  first_column_role: row-labels
  html_fold: never
- id: tbl:EXAM-MEMORY-CORE
  kind: table
  placement: sec:EXAM-MEMORY
  headers:
  - formula and symbols
  - location and derivation
  - decoding
  rows:
  - - '<span id="result-m1"></span>**M1. Spike-driven feedback · model**<br>$ds_i=-s_i\,dt/\tau+dN_i$<br>$g_i=\sum_jW_{ij}s_j+b_i$<br>$r_i=\phi(g_i)$<br>[**Symbols
      and units:** $i,j$: neuron indices among $N$ cells; $N$: cell count. $t$: time (s). $s_i(t)$: outgoing
      synaptic activation of cell $i$, dimensionless because one spike adds one unit. $N_i(t)$: number of cell
      $i$''s spikes by time $t$; $dN_i$: new spikes in $dt$. $\tau$: synaptic decay time (s). $W_{ij}$: fixed
      connection from sender $j$ to receiver $i$, in input units per activation unit. $g_i,b_i$: total input
      and constant bias, in the same input units. $r_i$: firing rate (spikes/s). $\phi$: transfer function
      from input to rate.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity.pdf#page=5).
      Main, Materials and Methods, Neural Network, Eqs. 7-9, PDF p. 5 (Early Edition 5 of 6). The count-increment
      equation is the guide''s equivalent form of the impulse-train Eq. 7.<br>**Guide location:** [Chapter
      1, §1.2, Recurrent spikes renew decaying synaptic activity](../chapters/ch-foundations.html#sec-memory-spikes).<br>**Origin:**
      Paper model; first formula is an exact count-process rewrite of paper Eq. 7, rather than its printed
      notation.<br>**Derivation route:** Each spike increases outgoing activation $s_i$ by one; the count process
      $N_i$ records these events. Between spikes, activation decays over time $\tau$. The fixed weight $W_{ij}$
      sends cell $j$''s activation to receiver $i$; bias $b_i$ completes total input $g_i$.'
    - The circuit stores a value through activity that renews itself. The weights determine who affects whom;
      they do not change during storage. The response $\phi$ converts input into firing rate, rather than directly
      into eye angle.
  - - '<span id="result-m3"></span>**M3. Lasting displacement · central**<br>$K\mathbf u=0$<br>$\mathbf v^TK=0,\quad\mathbf
      v^T\mathbf u=1$<br>$2D(\theta)=\sum_i v_i^2\bar r_i$<br>[**Symbols and units:** $i$: cell index; $N$:
      number of cells. $\theta$: represented coordinate (for example radians). $\bar{\mathbf s}(\theta)$ and
      $\delta\mathbf s$: steady activation and a small activation disturbance, both $N$-vectors of unit-spike
      activation. $\bar r_i$: steady rate (spikes/s). $K$: $N\times N$ linear response matrix (s$^{-1}$), distinct
      from spike count $K_i$. $\mathbf u=\partial\bar{\mathbf s}/\partial\theta$: tangent $N$-vector, activation
      per coordinate unit. $\mathbf v$: left zero-mode $N$-vector, coordinate units per activation; $v_i$ is
      its cell-$i$ entry. $\mathbf v^T\delta\mathbf s$: retained coordinate shift. $D(\theta)$: scalar diffusion
      coefficient, coordinate units squared/s; $2D$ is displacement variance per second.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=3).
      SI, II. The Coefficient of Diffusion: Eqs. S8-S9 define $K$, S11 gives $\mathbf u$, S12-S13 give the
      left-vector condition and normalization, and S14-S15 give projected variance and $2D$. All are on PDF
      p. 3. $K\mathbf u=0$ follows by differentiating the fixed-point family and is explained in the guide.<br>**Guide
      location:** [Chapter 3, §3.2, The network''s return flow determines the lasting memory change](../chapters/ch-memory-dynamics.html#sec-memory-linearization);
      [§3.3, Projecting spike fluctuations gives the diffusion coefficient](../chapters/ch-memory-dynamics.html#sec-memory-diffusion).<br>**Origin:**
      Paper leading weak-noise result. The guide supplies the explicit tangent differentiation and explains
      why the left vector gives the lasting change.<br>**Derivation route:** $K$ is the matrix governing small
      activation disturbances, and $\mathbf u=\partial\bar{\mathbf s}/\partial\theta$ follows the steady-state
      family. The left vector $\mathbf v$ removes the decaying part: a disturbance $\delta\mathbf s$ leaves
      shift $\mathbf v^T\delta\mathbf s$. Add independent projected spike variances.'
    - $v_i$ measures the lasting change in the represented value caused by one activation change in cell $i$,
      after other disturbances relax. $D$ is half the local growth rate of displacement variance. This is a
      leading weak-noise result near a tuned continuous family with stable transverse directions.
  - - '<span id="result-m7"></span>**M7. Spike precision · central**<br>$J(\theta)=\sum_i\dfrac{(\bar r_i'')^2}{\bar
      r_i}$<br>$I_h=hJ$<br>$\operatorname{Var}(\hat\theta)\ge1/(hJ)$<br>[**Symbols and units:** $i$: neuron
      index. $\theta$: represented scalar value (for example radians). $\bar r_i(\theta)$: steady firing rate
      (spikes/s); $\bar r_i''=d\bar r_i/d\theta$: rate slope per coordinate unit. $h$: short observation duration
      (s), with the state effectively fixed. $J(\theta)$: scalar Fisher information per second, in inverse
      coordinate units squared/s. $I_h=hJ$: information in that observation, in inverse coordinate units squared.
      $\hat\theta$: estimate formed from the counts; its variance is in coordinate units squared.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity.pdf#page=2).
      Main Eq. 3, PDF p. 2, displays $J$. SI IV, S42-S43, PDF p. 9, defines information per short interval
      and gives the Poisson likelihood; its continuation on p. 10 refers to the standard population-code derivation.
      Main, Information-Diffusion Inequality, PDF p. 3, invokes the Cramer Rao error bound in prose. The explicit
      score proof and $\operatorname{Var}(\hat\theta)\ge1/(hJ)$ display are guide derivations of that standard
      bound, not separately numbered equations in this paper.<br>**Guide location:** [Chapter 5, §5.1, Rate
      slopes and spike variability determine local information](../chapters/ch-memory-information.html#sec-memory-fi).<br>**Origin:**
      Paper information-rate formula plus a guide derivation of its count-information relation and the regular
      locally unbiased estimation bound.<br>**Derivation route:** Differentiate the log probability of independent
      Poisson counts with respect to $\theta$. The mean squared derivative is Fisher information $I_h$; independent
      terms add. Cauchy Schwarz applied to estimation error gives the variance bound for regular locally unbiased
      estimates.'
    - Steep tuning relative to spike noise makes nearby current values easier to distinguish. $J$ is information
      per second about the present state, not stored bits or certainty about the original cue. The state is
      effectively fixed during this short count calculation, and finite-sample attainment is not guaranteed.
  - - '<span id="result-m8"></span>**M8. Information–diffusion bound · central**<br>$D\ge\dfrac{1}{2\tau^2J}$<br>$2DJ\tau^2\ge1$<br>[**Symbols
      and units:** $D$: scalar diffusion coefficient (coordinate units squared/s). $J$: scalar information
      rate about the same coordinate (inverse coordinate units squared/s). $\tau$: common synaptic decay time
      (s). $i$: neuron index. $\bar r_i$: steady rate (spikes/s); $\bar r_i''$: derivative of rate with respect
      to the represented coordinate. $v_i$: retained coordinate shift per unit activation change in cell $i$.
      Thus $2DJ\tau^2$ is dimensionless.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity.pdf#page=3).
      Main, Information-Diffusion Inequality, Eq. 4, PDF p. 3, displays $D\ge J^{-1}/(2\tau^2)$. SI V, S45-S49,
      PDF pp. 10-11, proves it; S49 on p. 11 displays $2DJ\ge\tau^{-2}$. The row''s Cauchy Schwarz proof is
      the guide''s shorter equivalent proof.<br>**Guide location:** [Chapter 5, §5.2, Spike information sets
      a lower bound on memory diffusion](../chapters/ch-memory-information.html#sec-memory-bound).<br>**Origin:**
      Paper inequality for the tuned weak-noise model; the dimensionless form is exact algebra. Symmetric connections
      are not required.<br>**Derivation route:** The normalization of the lasting-shift weights gives $\tau\sum_i
      v_i\bar r_i''=1$. Cauchy Schwarz bounds its square by $\tau^2(\sum_i v_i^2\bar r_i)(\sum_i(\bar r_i'')^2/\bar
      r_i)$.'
    - The same noisy spikes convey the value and renew the activity carrying it. At fixed $J$ and synaptic
      time $\tau$, tuning the network cannot reduce diffusion below this bound in the stated model. It assumes
      the tuned continuous family, weak independent conditional spike noise, a common decay time and no external
      anchoring signal.
  - - '<span id="result-m9"></span>**M9. Attaining the bound · central**<br>$v_i=\bar r_i''/(\tau J\bar r_i)$<br>$\phi(g)=A
      e^{kg}\quad\text{is sufficient for }W=W^T$<br>[**Symbols and units:** $i$: neuron index; $N$: neuron
      count. $\theta$: represented coordinate. $\bar r_i$: steady rate (spikes/s); $\bar r_i''$: its slope
      per coordinate unit. $v_i$: retained coordinate shift per activation unit. $J$: scalar information rate
      (inverse coordinate units squared/s). $\tau$: common decay time (s). $g$: total input, in model input
      units. $\phi(g)$: firing-rate response (spikes/s); $\phi''$ is its input derivative. $A>0$: rate scale
      (spikes/s). $k>0$: input sensitivity (inverse input units), so $kg$ is dimensionless. $W$: $N\times N$
      connection matrix (input units per activation unit); $W=W^T$ means symmetric weights.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=11).
      SI V, Saturation of the inequality, following S49 through S51, PDF p. 11, gives the equality condition
      and exponential transfer class. Main, Saturation of the information-diffusion inequality, PDF p. 3, states
      exponential sufficiency. The explicitly normalized $v_i=\bar r_i''/(\tau J\bar r_i)$ is the guide''s
      exact equality-condition reconstruction, not an equation printed in that form. The source''s stronger
      exponential-necessity claim is qualified by the guide''s linear counterexample.<br>**Guide location:**
      [Chapter 5, §5.2, Spike information sets a lower bound on memory diffusion, equality condition and linear
      counterexample](../chapters/ch-memory-information.html#sec-memory-bound).<br>**Origin:** Paper sufficient
      exponential class; guide-derived explicit normalized equality condition and guide qualification of the
      source''s necessity claim.<br>**Derivation route:** Equality in Cauchy Schwarz requires $v_i\sqrt{\bar
      r_i}$ to be proportional to $\bar r_i''/\sqrt{\bar r_i}$ for every contributing cell. In a symmetric
      network an exponential transfer rule supplies the required common ratio $\phi''/\phi$; $A>0$ and $k>0$
      are constants.'
    - The retained effect of each cell's spike noise must match the information its spikes provide. Suitable
      symmetric exponential networks reach the lower bound under the same tuned-model assumptions. Exponential
      transfer is a sufficient class, not a general necessity; the guide gives a linear counterexample to the
      stronger source claim.
  - - '<span id="result-m13"></span>**M13. Diffusion-aware readout · central**<br>$V_{\rm ideal}(L)=\sqrt{\dfrac{2D}{J}}\coth(\sqrt{2DJ}\,L)$<br>$V_{\rm
      ideal}(\infty)=\sqrt{2D/J}$<br>$L^*=1/\sqrt{2DJ}\le\tau$<br>[**Symbols and units:** $L$: observation
      duration after the recall cue (s), source $\Delta T$; $L^*$: characteristic approach time (s), not a
      finite optimum. $D$: constant local scalar diffusion coefficient (coordinate units squared/s). $J$: constant
      scalar information rate (inverse coordinate units squared/s). $V_{\rm ideal}(L)$: ideal cue-state readout-error
      variance (coordinate units squared); $V_{\rm ideal}(\infty)$: its long-observation limit. $P(L)=1/V_{\rm
      ideal}(L)$: Gaussian precision (inverse coordinate units squared). $\tau$: synaptic decay time (s). $\coth$:
      hyperbolic cotangent, $\coth z=(e^{2z}+1)/(e^{2z}-1)$; its argument here is dimensionless.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=15).
      SI VI, Ideal estimator, S58-S63, PDF p. 13, defines the Gaussian model; S64-S74 on p. 14 gives the covariance
      solution; S75 on p. 15 displays the finite-$L$ variance and the following paragraph states its limit
      and characteristic time. Main Eq. 5, PDF p. 4, displays $L^*\le\tau$. The backward precision equation
      $P''=J-2DP^2$ is the guide''s independent reconstruction, not a printed source equation; it confirms
      S75 despite the sign mismatch in S71.<br>**Guide location:** [Chapter 6, §6.3, Accounting for diffusion
      makes readout improve toward a limit](../chapters/ch-memory-readout.html#sec-memory-ideal).<br>**Origin:**
      Paper finite and limiting ideal-readout results, exact within its local Gaussian observation model; guide
      provides an equivalent precision derivation. The inequality gives a characteristic time, not an abrupt
      end of benefit.<br>**Derivation route:** Combine observation precision backward in time while adding
      diffusion variance between observations. Precision $P$ obeys $dP/dL=J-2DP^2$, $P(0)=0$; solve and use
      $V=1/P$.'
    - Accounting for motion makes more observation keep helping, toward a finite limit. $L^*$ is a characteristic
      saturation time, not a hard deadline. This is an ideal observer within the local Gaussian readout model;
      it does not show a biological decoder implementing the rule.
  caption: Feedback sustains activity while noisy spikes move the remembered value. Core argument.
  first_column_role: row-labels
  html_fold: never
- id: tbl:EXAM-MEMORY-SUPPORT
  kind: table
  placement: sec:EXAM-MEMORY
  headers:
  - formula and symbols
  - location and derivation
  - decoding
  rows:
  - - '<span id="result-m2"></span>**M2. Spike variability · model**<br>$K_i\mid\theta\sim\mathrm{Poisson}(\lambda_i)$<br>$\lambda_i=h\bar
      r_i(\theta)$<br>$\operatorname{Var}(K_i\mid\theta)=\lambda_i$<br>[**Symbols and units:** $i$: neuron
      index. $K_i$: cell $i$''s spike count in the observation interval, dimensionless; this is not the matrix
      $K$ in M3. $\theta$: fixed represented value, in coordinate units such as radians. $h$: observation duration
      (s). $\bar r_i(\theta)$: steady firing rate at that value (spikes/s); bar means a steady value. $\lambda_i=h\bar
      r_i$: expected spike count, dimensionless. Poisson names the count distribution.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=9).
      SI, IV. Internal Fisher Information, Eq. S43, PDF p. 9, displays the joint product-Poisson likelihood
      with observation duration $\delta t$ and counts $n_i$. Main Eq. 9, PDF p. 5, states the Poisson spike
      model. Equal mean and variance and the rare-event derivation are worked out in the guide, not separately
      displayed source results.<br>**Guide location:** [Chapter 1, §1.4, A variable spike count at a fixed
      rate](../chapters/ch-foundations.html#sec-foundations-poisson).<br>**Origin:** Paper count model with
      guide aliases $K_i,h,\lambda_i$; the count moments and elementary derivation are exact properties of
      that model when the state is held fixed.<br>**Derivation route:** Independent rare events in short subdivisions
      give the Poisson count law over a duration $h$. Its first two moments give equal count mean and variance.
      Here $\bar r_i$ is the steady tuning curve at value $\theta$.'
    - Higher firing supplies more events and more absolute count noise. The elementary spike noise is independent
      across cells conditional on the current state; recurrent interactions can still correlate complete neural
      trajectories.
  - - '<span id="result-m4"></span>**M4. Symmetric connections · supporting**<br>$2D=\dfrac{\sum_i\bar r_i(g_i'')^2}{\tau^2(\sum_i\bar
      r_i'' g_i'')^2}$<br>[**Symbols and units:** $i,j$: neuron indices among $N$ cells. $D$: scalar diffusion
      coefficient (coordinate units squared/s). $\theta$: represented coordinate. $\bar r_i$: steady rate (spikes/s);
      $\bar r_i''=d\bar r_i/d\theta$: tuning slope (rate per coordinate unit). $g_i$: steady total input in
      this formula; $g_i''=dg_i/d\theta$: input slope. $\tau$: synaptic decay time (s). $W$: $N\times N$ connection
      matrix (input units per activation unit); $W_{ij}=W_{ji}$ is pairwise symmetry. $\mathbf u=\partial\bar{\mathbf
      s}/\partial\theta$: tangent vector (activation per coordinate). $\mathbf v$: normalized left zero vector
      (coordinate per activation). Primes here mean first derivatives, not second derivatives.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=4).
      SI, II. The Coefficient of Diffusion, Eqs. S16-S18, PDF p. 4: S18 displays the squared input slope in
      the numerator and the full formula. Main Eq. 2, PDF p. 2, omits that square in the supplied Early Edition
      PDF. The guide links the 2017 author correction for main Eq. 2.<br>**Guide location:** [Chapter 3, §3.4,
      Symmetric weights express diffusion through tuning curves](../chapters/ch-memory-dynamics.html#sec-memory-symmetric).<br>**Origin:**
      Corrected source expression, directly supported by SI S18. It uses symmetric weights, the tuned continuous
      family and the same leading weak-noise assumptions.<br>**Derivation route:** If $W_{ij}=W_{ji}$, differentiate
      the fixed-state equations to find $v_i\propto g_i''$, then normalize by $\mathbf v^T\mathbf u=1$. Primes
      mean derivatives with respect to memory value $\theta$.'
    - For this special connectivity, tuning and input slopes determine diffusion without separately solving
      for $\mathbf v$. The numerator contains squared input slopes, as in the published correction. The general
      projection formula does not require symmetric weights.
  - - '<span id="result-m5"></span>**M5. More than one stored coordinate · supporting**<br>$2D_{\alpha\beta}=\sum_i
      v_i^\alpha\bar r_i v_i^\beta$<br>$J_{\alpha\beta}=\sum_i(\partial_\alpha\bar r_i)(\partial_\beta\bar
      r_i)/\bar r_i$<br>$2D\succeq\tau^{-2}J^{-1}$<br>[**Symbols and units:** $i=1,\ldots,N$: cell index; $N$:
      cell count. $\alpha,\beta=1,\ldots,m$: stored-coordinate indices, not thinning probabilities; $m$: number
      of coordinates. $\boldsymbol\theta$: $m$-vector of stored coordinates. $\bar r_i$: steady rate (spikes/s);
      $\partial_\alpha\bar r_i=\partial\bar r_i/\partial\theta_\alpha$: slope in coordinate $\alpha$. $\mathbf
      u^\beta$: $N$-vector tangent $\partial\bar{\mathbf s}/\partial\theta_\beta$ (activation per unit of coordinate
      $\beta$). $\mathbf v^\alpha$: matching left $N$-vector (units of coordinate $\alpha$ per activation).
      $\delta_{\alpha\beta}$: 1 for equal indices, otherwise 0. $D$: $m\times m$ diffusion matrix; $D_{\alpha\beta}$
      has units coordinate-$\alpha$ times coordinate-$\beta$/s. $J$: invertible $m\times m$ information-rate
      matrix; $J_{\alpha\beta}$ has inverse coordinate-$\alpha$ times inverse coordinate-$\beta$/s. $\tau$:
      common decay time (s). $\succeq$ means the difference has a nonnegative quadratic form in every direction.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=6).
      SI: S21 defines $D$ on PDF p. 5; S22-S24 give tangents, normalization and the displayed diffusion tensor
      on p. 6. S44 displays the information matrix on p. 10. S52 displays the matrix bound on p. 11; S53-S56
      prove it on p. 12. [Information matrix](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=10);
      [matrix bound](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=11); [proof](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=12).<br>**Guide
      location:** [Chapter 3, §3.3, Projecting spike fluctuations gives the diffusion coefficient](../chapters/ch-memory-dynamics.html#sec-memory-diffusion);
      [Chapter 5, §5.2, Spike information sets a lower bound on memory diffusion, matrix derivation](../chapters/ch-memory-information.html#sec-memory-bound).<br>**Origin:**
      Paper diffusion and information matrices and paper matrix inequality; guide proof uses an equivalent
      nonnegative residual matrix. The ordinary inverse needs nonsingular $J$.<br>**Derivation route:** Choose
      a tangent for each stored coordinate and left vectors satisfying $\sum_i v_i^\alpha u_i^\beta=\delta_{\alpha\beta}$.
      Project the same spike noise onto each pair of coordinates.  Applying the same normalization in matrix
      form gives the bound when the information matrix $J$ is invertible.'
    - The diagonal entries give spreading in each coordinate. Off-diagonal entries give coupled changes in
      two stored coordinates, even when the elementary spike noises are independent. The weak-noise and local-state
      assumptions remain. The matrix inequality means every linear combination of coordinate changes obeys
      its variance bound, including coupled directions.
  - - '<span id="result-m6"></span>**M6. Accumulated storage error · supporting**<br>$\partial_t p=\partial_\theta^2[D(\theta)p]$<br>$\operatorname{Var}[\theta(t)-\Theta]=2Dt$<br>$p(\theta,t)=\dfrac{e^{-(\theta-\Theta)^2/(4Dt)}}{\sqrt{4\pi
      Dt}}$<br>[**Symbols and units:** $t$: elapsed storage time (s). $\theta(t)$: current represented scalar
      value; $\Theta$: common initial value, in the same coordinate units. $p(\theta,t)$: probability density
      across trials, in inverse coordinate units. $D(\theta)$: local scalar diffusion coefficient (coordinate
      units squared/s); the later two formulas take it constant. $\mathbb E[D(\theta)]$: trial-averaged coefficient.
      MSD means mean squared displacement (coordinate units squared). For the circle example, $\theta$ is an
      angle in radians, reported error lies in $[-\pi,\pi)$ and $\pi^2/3$ is in rad$^2$.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=7).
      SI, III. Diffusive Dynamics Along the Attractor: S28-S30, PDF p. 7, give the density equation, point
      initial condition and Gaussian with variance $2Dt$. S31 (p. 7) and S32 (p. 8) give the wrapped density
      and angular-error moment. The limit $\pi^2/3$ and the moment-rate identity $d\operatorname{Var}/dt=2\mathbb
      E[D]$ are exact guide deductions under the displayed diffusion model and suitable boundary conditions,
      not separately displayed source formulas.<br>**Guide location:** [Chapter 4, §4.1, Long delay errors
      depend on boundaries and local diffusion](../chapters/ch-memory-long-delays.html#sec-memory-long-time).<br>**Origin:**
      Paper diffusion equation and constant-$D$ line solution; guide derives the circle''s uniform-error limit
      and the general variance-rate identity. These assume zero systematic drift and the appropriate boundary
      rules.<br>**Derivation route:** Combine small Itô diffusion increments, with no systematic drift, into
      a probability evolution equation. The Gaussian and $2Dt$ formulas additionally require constant $D$,
      a point initial value $\Theta$ and an unbounded coordinate.'
    - The remembered value spreads even while neural activity persists. With state-dependent $D$, variance
      instead grows at rate $2\mathbb E[D(\theta)]$. Boundaries, angular wrapping and systematic drift require
      their own treatment; a linear MSD need not continue forever. For constant angular diffusion on a circle,
      wrapped error eventually becomes uniform and its MSD tends to $\pi^2/3$ in radian-squared units; the
      plateau does not mean noise stopped.
  - - '<span id="result-m10"></span>**M10. Controlled changes of circuit parameters · supporting**<br>$J\propto
      N,\quad D\propto N^{-1}$<br>$J\mapsto cJ,\quad D\mapsto D/c$<br>$D\propto\tau^{-2}$<br>[**Symbols and
      units:** $N$: number of comparable neurons, a dimensionless count. $J$: scalar information rate (inverse
      coordinate units squared/s). $D$: scalar diffusion coefficient (coordinate units squared/s). $c>0$: dimensionless
      multiplier of every rate tuning curve and its slope; this scalar is unrelated to the preferred-value
      vector $\mathbf c$ in M11. $\tau$: synaptic decay time (s). Each proportionality describes a controlled
      change with the other properties specified in the derivation kept fixed.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity.pdf#page=2).
      Main, Diffusive Drift due to Ongoing Neural Noise, paragraph following Eq. 2, PDF p. 2, states the network-size,
      firing-rate and decay-time comparisons. SI I, PDF pp. 1-2, gives population replication and $1/N$ weight
      scaling, including S6 for a ring. The explicit proportionality powers and $J\mapsto cJ$, $D\mapsto D/c$
      are guide algebra from corrected Eq. 2 and Eq. 3 under the listed constraints, not a separately displayed
      source equation.<br>**Guide location:** [Chapter 5, §5.3, Improving persistence depends on what a comparison
      holds fixed](../chapters/ch-memory-information.html#sec-memory-comparisons).<br>**Origin:** Guide-derived
      scaling relationships supporting paper comparisons. The rate-to-diffusion scaling needs equality in the
      bound or preserved tuning/input geometry; changing $\tau$ here holds rate tuning fixed by adjusting the
      circuit.<br>**Derivation route:** Replicate a population of $N$ neurons with the same tuning distribution
      and weights scaled as $1/N$. Count the sums in the symmetric diffusion formula. A uniform rate multiplier
      $c>0$ also multiplies tuning slopes. For the time comparison, hold rate tuning and its input relation
      fixed.'
    - More comparable neurons can reduce independent noise, and longer synaptic effects can reduce the lasting
      shift per spike. The stated rate-to-diffusion scaling needs an equality-achieving network or preserved
      tuning/input geometry. Changing rate or decay time without the corresponding circuit adjustment need
      not preserve the stored-state family.
  - - '<span id="result-m11"></span>**M11. Tuning width depends on dimension · supporting**<br>$J_{\alpha\alpha}\propto\rho
      a w^{d-2}$<br>$D_{\alpha\alpha}\propto w^{2-d}\quad\text{at equality}$<br>[**Symbols and units:** $d$:
      number of stored spatial coordinates, a positive integer. $\alpha$: one coordinate index. $\boldsymbol\theta$
      and $\mathbf c$: $d$-vectors of represented position and a cell''s preferred position, in coordinate
      units; $\mathbf c$ is not the scalar rate multiplier in M10. $w>0$: common tuning width (coordinate units).
      $a$: fixed peak firing rate (spikes/s). $f$: fixed dimensionless radial tuning shape, with dimensionless
      argument $(\boldsymbol\theta-\mathbf c)/w$. $\rho$: number of preferred positions per coordinate-volume,
      units coordinate$^{-d}$. $J,D$: $d\times d$ information-rate and diffusion matrices; $J_{\alpha\alpha}$
      is inverse coordinate units squared/s, $D_{\alpha\alpha}$ is coordinate units squared/s.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity.pdf#page=4).
      Main, discussion of internal information and tuning width, PDF p. 4, states that narrower curves help
      in 1D and broader curves in 3D and cites sensory coding work (ref. 31). The displayed $w^{d-2}$ and $w^{2-d}$
      power laws and the integral derivation are guide reconstructions under fixed peak rate, uniform center
      density, radial shape and equality in the matrix bound. They are not formulas displayed in this paper.<br>**Guide
      location:** [Chapter 5, §5.3, Improving persistence depends on what a comparison holds fixed, tuning-width
      integral](../chapters/ch-memory-information.html#sec-memory-comparisons).<br>**Origin:** Guide-derived
      scaling laws explaining a paper argument under explicit resource and symmetry assumptions; the diffusion
      power additionally assumes a circuit that attains the information bound.<br>**Derivation route:** Use
      tuning $a f[(\boldsymbol\theta-\mathbf c)/w]$ with uniform preferred-value density $\rho$, fixed peak
      rate $a$, radial shape $f$ and width $w$. The information integral gains $w^d$ from recruited cells and
      $w^{-2}$ from squared slopes.'
    - Under these fixed resources, narrower tuning helps in one dimension and broader tuning helps in three;
      the leading width power vanishes in two. The diffusion statement additionally assumes an equality-achieving
      network. Holding total spike rate fixed would be a different comparison. This is the guide's reconstruction
      of the paper's width argument.
  - - '<span id="result-m12"></span>**M12. Equal-weight readout · supporting**<br>$V_{\rm naive}(L)=\dfrac1{JL}+\dfrac{2DL}{3}$<br>$L_{\rm
      naive}^*=\sqrt{\dfrac3{2DJ}}$<br>[**Symbols and units:** $L$: duration of observation after the recall
      cue (s), called $\Delta T$ in the source; it is not the earlier storage delay $T$. $V_{\rm naive}(L)$:
      variance of error in estimating the cue-time state with equal observation weights (coordinate units squared).
      $L_{\rm naive}^*$: duration minimizing this variance (s). $D$: constant local diffusion coefficient (coordinate
      units squared/s). $J$: constant local information rate (inverse coordinate units squared/s). In $2D\min(t,s)$,
      $t,s$ are two elapsed observation times (s), and $s$ here is not synaptic activation. State-motion and
      observation noises are separate in this Gaussian readout model.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=15).
      SI VI, Naive estimator, S76-S79, PDF p. 15, gives the equal-weight estimator, Brownian time covariance
      and displayed variance. S80 on p. 15 gives the optimal duration; S81 on p. 16 gives its minimum variance.
      The double covariance integral in the guide exposes the cross-time terms absent from the printed S77
      sum-of-squares line.<br>**Guide location:** [Chapter 6, §6.2, Equal weighting becomes harmful when observation
      lasts too long](../chapters/ch-memory-readout.html#sec-memory-naive).<br>**Origin:** Paper Gaussian-readout
      result; guide derives S79 explicitly through the covariance integral. This variance concerns reading
      the cue state, before adding storage error.<br>**Derivation route:** Average observations for duration
      $L$ after the readout cue. Count noise averages to $1/(JL)$; integrating Brownian covariance $2D\min(t,s)$
      over the observation square gives $2DL/3$. Differentiate to find the optimum.'
    - Collecting more spikes first helps, then hurts because later spikes represent a state that has moved
      further from the cue state. $V$ is readout error variance under the local Gaussian observation model,
      with constant $D,J$ and separate state-motion and observation noise.
  - - '<span id="result-m14"></span>**M14. Storage plus partial readout · supporting**<br>$V_{\rm recall}=2DT+V_{\rm
      readout}$<br>$J_{\rm obs}=\alpha J$<br>$L_{\rm obs}^*=L^*/\sqrt\alpha$<br>$V_{\rm ideal,obs}(\infty)=\sqrt{2D/(\alpha
      J)}$<br>$V_{\rm recall}(T,L)\ge2DT+\sqrt{2D/J}$<br>[**Symbols and units:** $T$: storage delay from initial
      encoding to recall cue (s). $L$: subsequent observation duration (s); source calls it $\Delta T$. $D$:
      full memory-network diffusion coefficient (coordinate units squared/s). $J$: full-access information
      rate; $J_{\rm obs}$: observed information rate (both inverse coordinate units squared/s). $0<\alpha\le1$:
      probability each spike is independently observed, or a verified information fraction; unrelated to coordinate
      index $\alpha$ in M5. $L^*=1/\sqrt{2DJ}$: full-access characteristic readout time; $L_{\rm obs}^*$: corresponding
      partial-access time (s). $V_{\rm recall}$: total recall-error variance about the original value. $V_{\rm
      readout}$: error variance in reading the cue-time state. $V_{\rm ideal,obs}(\infty)$: ideal partial-access
      limiting readout variance. All $V$ quantities have coordinate units squared. $\tau$: synaptic time (s).
      The last displayed lower bound uses full access, $\alpha=1$.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=16).
      SI VI, S57, PDF p. 12, gives storage-plus-readout error addition. The Incomplete readout paragraph, S82
      and Fig. S2, PDF p. 16, replace $J$ by $\alpha J$ and give the time/variance factors. The source''s S83
      on p. 16 and main Eq. 6 on p. 4 print a stronger lower bound whose direction does not follow. The row''s
      full-access $2DT+\sqrt{2D/J}$ lower limit is guide algebra from S57 and S75, not a displayed corrected
      source equation. [Error addition](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=12); [finite
      ideal variance](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=15).<br>**Guide location:**
      [Chapter 6, §6.1, Storage loss and readout error add under specific assumptions](../chapters/ch-memory-readout.html#sec-memory-readout-setup);
      [§6.4, Limited access can make observation slower](../chapters/ch-memory-readout.html#sec-memory-partial);
      [§6.6, Readout saturates, and one printed error bound needs qualification](../chapters/ch-memory-readout.html#sec-memory-fig3-and-caution).<br>**Origin:**
      Paper error decomposition and partial-access relationships, plus guide derivation of the full-access
      total-error bound. Error addition needs local unbiasedness and independent future noise. $2D(T+\tau)$
      is this asymptotic expression only when the information-diffusion bound is attained, not a general lower
      bound.<br>**Derivation route:** Storage for delay $T$ adds independent error when readout is locally
      unbiased and future noise is independent of storage history. Independently retain each spike with probability
      $\alpha$; substitute the thinned rates into the FI formula.'
    - Missing spikes reduces readout information while the full circuit keeps diffusing at the same $D$. Reading
      becomes slower and less precise. A selected fraction of neurons need not carry the same fraction of information;
      $\alpha J$ follows from random spike thinning or a verified information fraction. With full spike access,
      the ideal total-error limit is $2DT+\sqrt{2D/J}$; it equals $2D(T+\tau)$ only at equality in the information
      bound. [Why printed Eq. 6 needs this qualification](../chapters/ch-memory-readout.html#sec-memory-fig3-and-caution).
  - - '<span id="result-m15"></span>**M15. A rate response time changes the bound · extension**<br>$\tau_m\dot
      r_i=-r_i+\phi(g_i)$<br>$D\ge\dfrac{1}{2(\tau+\tau_m)^2J}$<br>[**Symbols and units:** $i$: neuron index.
      $r_i(t)$: time-dependent firing rate (spikes/s); $\dot r_i$: its time derivative (spikes/s$^2$). $g_i$:
      total synaptic input in model input units. $\phi(g_i)$: target firing rate at that input (spikes/s).
      $\tau$: synaptic activation decay time (s). $\tau_m$: firing-rate response time (s), distinct from $\tau$.
      $D$: scalar diffusion coefficient (coordinate units squared/s). $J$: scalar information rate for that
      coordinate (inverse coordinate units squared/s).]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=18).
      SI VII, More than one time constant, S84, PDF p. 17, displays the rate equation; S85-S90 on pp. 17-18
      develops the linear modes; S91-S92 on p. 18 display diffusion and its bound. Source S85 prints a positive
      rate-decay block, although differentiating S84 gives the negative block used in the guide. [Rate model](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=17).<br>**Guide
      location:** [Chapter 6, §6.5, Time scales and noise laws change the bound and its equality condition,
      two-time-constant derivation](../chapters/ch-memory-readout.html#sec-memory-extensions).<br>**Origin:**
      Paper two-stage extension for symmetric weights; the displayed bound is S92 divided by two. The guide
      repairs the sign of the intermediate linear rate-decay block from the source''s own rate equation.<br>**Derivation
      route:** Keep synaptic activation decay $\tau$ and add a firing-rate response time $\tau_m$. Linearize
      both sets of variables and normalize the left mode against their combined tangent. In the symmetric model
      the diffusion denominator gains $(\tau+\tau_m)^2$ in place of $\tau^2$.'
    - Slower intrinsic rate response can also carry memory between spikes. The two times add for this specified
      two-stage model, with the same Poisson drive and stable transverse directions. Replacing $\tau$ by a
      sum of arbitrary biological response times is not justified.
  - - '<span id="result-m16"></span>**M16. Noise law changes the equality condition · extension**<br>$J=\sum_i(\bar
      r_i'')^2/q_n$<br>$2D=q_n\sum_i v_i^2$<br>$2DJ\ge\tau^{-2}$<br>[**Symbols and units:** $i$: neuron index.
      $\theta$: represented scalar coordinate. $\bar r_i$: steady rate (spikes/s); $\bar r_i''=d\bar r_i/d\theta$:
      rate slope per coordinate unit. $q_n>0$: common additive Gaussian noise intensity, activation units squared/s;
      because one spike adds dimensionless activation, its units here are s$^{-1}$. In an activation equation,
      a noise increment has variance $q_n\,dt$; a rate observation averaged over duration $h$ has noise variance
      $q_n/h$ (s$^{-2}$). $h$: observation duration (s). $v_i$: retained coordinate shift per activation unit.
      $D$: scalar diffusion coefficient (coordinate units squared/s). $J$: scalar Gaussian-observation information
      rate (inverse coordinate units squared/s). $\tau$: synaptic decay time (s). The symbol $q$ mentioned
      for comparison is the dimensionless place-field threshold, not this noise intensity.]{.definition-explanation}'
    - '**Paper location:** [Open cited PDF page](../papers/burak-fiete-2012-persistent-activity-si.pdf#page=19).
      SI VII, White Gaussian noise, S93-S95, PDF p. 19, changes the noise law and states that a linear transfer
      rule attains equality. The row''s explicit $q_n$ normalization and the matched formulas for $J$ and $D$
      are guide reconstructions, not equations printed in that exact form: the supplied S94-S95 omit noise/time
      factors. The guide chapter writes this noise strength as $q$; the table renames it $q_n$ to avoid the
      spatial-threshold alias.<br>**Guide location:** [Chapter 6, §6.5, Time scales and noise laws change the
      bound and its equality condition, Gaussian-noise reconstruction](../chapters/ch-memory-readout.html#sec-memory-extensions).<br>**Origin:**
      Guide-derived matched Gaussian-noise formulas explaining the paper extension while keeping units explicit.
      The information-diffusion inequality follows by the same normalized projection proof; symmetric linear
      transfer is a sufficient equality class.<br>**Derivation route:** Replace Poisson fluctuations by independent
      additive Gaussian noise with constant intensity $q_n>0$; a rate observation averaged for $h$ has noise
      variance $q_n/h$. Repeat the likelihood and projection calculations with this same noise law.'
    - The information–diffusion relation survives this matched noise model, but equality now needs $v_i\propto\bar
      r_i'$. In the symmetric model a linear transfer rule is sufficient. An optimal transfer rule therefore
      depends on how neurons fluctuate. The noise intensity $q_n$ is unrelated to the place-field threshold
      $q$.
  caption: Feedback sustains activity while noisy spikes move the remembered value. Further results, tests
    and model extensions.
