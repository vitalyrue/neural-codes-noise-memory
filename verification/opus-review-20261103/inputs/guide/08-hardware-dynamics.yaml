chapter_id: ch:HARDWARE-DYNAMICS
part_id: part:HARDWARE
title: Discrete restoration and continuous drift produce different memory errors
purpose: 'A circuit can remain active for seconds even when its individual voltages decay in milliseconds.
  The explanation is feedback: activity supplies new input before old input disappears. But long-lived activity
  does not by itself identify what is being preserved. This chapter first explains how feedback extends a time
  scale, then distinguishes a restoring discrete memory from a freely changing continuous one. Measured silicon
  circuits show why this distinction matters beyond a mathematical model.'
