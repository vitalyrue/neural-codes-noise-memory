section_list:
- id: sec:SIMULATING-MEMORY-STATE
  title: A simulation renews the same synaptic state that the theory approximates
  summary: The physical idea is continuing neural activity after a cue has ended. A spike briefly increases synaptic
    activation. That activation decays, but it also changes the rates at which other neurons fire. Recurrent connections
    can therefore renew the activity. Random event times disturb the pattern that represents the remembered value.
  level: 2
- id: sec:SIMULATING-MEMORY-RING
  title: Ring trajectories test both the diffusion rate and the effect of angular boundaries
  summary: 'In the ring model, neurons are ordered by their preferred angles. Their connections support a localized
    activity pattern whose position represents an angle. Figure 2A–D compares the wandering position with predictions
    calculated from the network''s steady tuning curves. Two transfer functions test different relationships between
    diffusion and spike information: the exponential case attains the bound under the model assumptions, while
    the illustrated sigmoid case lies above it.[^simmem-ring]'
  level: 2
- id: sec:SIMULATING-MEMORY-CONTROLS
  title: Other network designs test which conclusions depend on the ring
  summary: A second network contains two mutually inhibiting units, interpreted also as two neural populations.
    Increasing one population's activity while decreasing the other's changes the stored value. Figure 2E–G tests
    diffusion in this family without relying on rotational symmetry. The diffusion calculation applies to both
    models because each has a continuous family of states and restoring dynamics toward that family.[^simmem-two]
  level: 2
- id: sec:SIMULATING-MEMORY-OUTPUTS
  title: A plotted analytical curve is different from a network simulation
  summary: Figures 3 and S2 plot formulas for readout error. They compare an ideal estimator with an estimator
    that weights all observations equally as the observation interval grows. The sources do not describe an additional
    spiking-network experiment or a biological circuit implementing ideal estimation in these figures.
  level: 2
