chapter_id: ch:SIMULATING-MEMORY
part_id: part:SIMULATIONS
title: Network simulations test how random spikes move a stored value
purpose: Burak and Fiete (2012) derive memory diffusion from assumptions about recurrent connections and random
  spike timing. To test that prediction, they simulate individual spikes and measure how the stored value moves.
  The central result remains an analytical bound. The simulations check its predicted motion in different network
  designs, including the limits imposed by an angular coordinate.
