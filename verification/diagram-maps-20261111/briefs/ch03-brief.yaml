  teaching_points:
  - id: P01
    source_locus: content/chapters/02-memory-dynamics.md:43 (sec:MEMORY-WEAK-NOISE)
    point: At each state Poisson spikes change synaptic activations in jumps and conditional spike variance depends
      on firing rate.
  - id: P02
    source_locus: content/chapters/02-memory-dynamics.md:43 (sec:MEMORY-WEAK-NOISE)
    point: Many weak spike effects allow a local Gaussian approximation under the weak-noise conditions.
  - id: P03
    source_locus: content/chapters/02-memory-dynamics.md:127 (sec:MEMORY-LINEARIZATION)
    point: The linearized matrix K describes how nearby activity perturbations evolve around a steady pattern.
  - id: P04
    source_locus: content/chapters/02-memory-dynamics.md:127 (sec:MEMORY-LINEARIZATION)
    point: A tangent vector describes how the steady activation changes with represented value.
  - id: P05
    source_locus: content/chapters/02-memory-dynamics.md:127 (sec:MEMORY-LINEARIZATION)
    point: Stable components relax while a neutral component preserves a shift in the represented value.
  - id: P06
    source_locus: content/chapters/02-memory-dynamics.md:127 (sec:MEMORY-LINEARIZATION)
    point: The left vector v is normalized against the tangent and measures the final coordinate change caused by
      an activation disturbance.
  - id: P07
    source_locus: content/chapters/02-memory-dynamics.md:127 (sec:MEMORY-LINEARIZATION)
    point: In a tilted return flow the lasting displacement is not the Euclidean perpendicular projection.
  - id: P08
    source_locus: content/chapters/02-memory-dynamics.md:264 (sec:MEMORY-DIFFUSION)
    point: Independent spike noise contributions projected by v give 2D as the sum of v_i squared times steady rate.
  - id: P09
    source_locus: content/chapters/02-memory-dynamics.md:264 (sec:MEMORY-DIFFUSION)
    point: A multidimensional diffusion tensor includes covariances across represented coordinates.
  - id: P10
    source_locus: content/chapters/02-memory-dynamics.md:264 (sec:MEMORY-DIFFUSION)
    point: The result is local and leading order in weak noise, and does not by itself determine systematic drift.
  - id: P11
    source_locus: content/chapters/02-memory-dynamics.md:331 (sec:MEMORY-SYMMETRIC)
    point: Reciprocal symmetric weights permit expressing the projection and diffusion through tuning and input
      slopes.
  - id: P12
    source_locus: content/chapters/02-memory-dynamics.md:331 (sec:MEMORY-SYMMETRIC)
    point: The symmetric formula uses the authors’ correction; changing rates can also change tuning or projection.
