  - id: P01
    point: At each step, activations set weighted input and rate, conditional random spikes are generated, and activation
      decays and renews.
    source_locus: content/chapters/11-simulating-memory.md:5-27 (#sec:SIMULATING-MEMORY-STATE)
  - id: P02
    point: The time step must resolve decay and have a small event probability for the one-spike update.
    source_locus: content/chapters/11-simulating-memory.md:5-27 (#sec:SIMULATING-MEMORY-STATE)
  - id: P03
    point: A ring orders neurons by preferred angle and encodes the value in an activity bump.
    source_locus: content/chapters/11-simulating-memory.md:28-51 (#sec:SIMULATING-MEMORY-RING)
  - id: P04
    point: The noise-free tuning curves predict diffusion; simulated trajectories independently supply angle displacement
      measurements.
    source_locus: content/chapters/11-simulating-memory.md:28-51 (#sec:SIMULATING-MEMORY-RING)
  - id: P05
    point: The highest-rate neuron is a quantized numerical proxy, not the same as projection to the noise-free
      attractor.
    source_locus: content/chapters/11-simulating-memory.md:28-51 (#sec:SIMULATING-MEMORY-RING)
  - id: P06
    point: Wrapped angle displacement reaches a finite range; flattening does not prove restored original memory.
    source_locus: content/chapters/11-simulating-memory.md:28-51 (#sec:SIMULATING-MEMORY-RING)
  - id: P07
    point: A two-unit mutually inhibitory system tests conclusions without ring symmetry, with a change of coordinates
      affecting diffusion units.
    source_locus: content/chapters/11-simulating-memory.md:52-72 (#sec:SIMULATING-MEMORY-CONTROLS)
  - id: P08
    point: Readout-error formula plots are analytical comparisons, not additional neural-network simulations; original
      simulator software was not identified.
    source_locus: content/chapters/11-simulating-memory.md:73-87 (#sec:SIMULATING-MEMORY-OUTPUTS)
  - id: P09
    point: 'A mutually excitatory pair supplies a separate control: across trials variance can grow linearly even
      when local diffusion varies with state.'
    source_locus: content/chapters/11-simulating-memory.md:69-71
