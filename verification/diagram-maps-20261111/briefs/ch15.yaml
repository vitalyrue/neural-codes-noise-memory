  teaching_points:
  - id: P01
    point: Feedback means output affects later input; different architectures store different variables.
    source_locus: content/chapters/11-electronic-architectures.md:9-24 (#sec:ELECTRONIC-OVERVIEW)
  - id: P02
    point: Two cross-coupled inverters hold one of two powered stable states, and small perturbations return within
      a basin.
    source_locus: content/chapters/11-electronic-architectures.md:25-32 (#sec:ELECTRONIC-FLIPFLOP)
  - id: P03
    point: A recurrent spiking circuit can maintain low or high population activity, without holding an arbitrary
      angle.
    source_locus: content/chapters/11-electronic-architectures.md:25-32 (#sec:ELECTRONIC-FLIPFLOP)
  - id: P04
    point: A multistable CMOS circuit can restore one of several preferred voltages; many levels are not automatically
      a continuum.
    source_locus: content/chapters/11-electronic-architectures.md:33-46 (#sec:ELECTRONIC-MULTILEVEL)
  - id: P05
    point: A recurrent ring represents a direction in the position of an activity bump; actual circuit implementations
      can be finite and hybrid.
    source_locus: content/chapters/11-electronic-architectures.md:47-54 (#sec:ELECTRONIC-RING)
  - id: P06
    point: A sustained oscillator normally advances in phase; a disturbance can leave a persistent phase offset
      relative to its expected cycle.
    source_locus: content/chapters/11-electronic-architectures.md:55-62 (#sec:ELECTRONIC-OSCILLATOR)
  - id: P07
    point: Pulses are events, rate summarizes expected event frequency, and decaying synaptic activation accumulates
      pulse effects.
    source_locus: content/chapters/11-electronic-architectures.md:63-72 (#sec:ELECTRONIC-SPIKES)
  - id: P08
    point: Programmable conductance can store a weight rather than the current neuron state or remembered angle.
    source_locus: content/chapters/11-electronic-architectures.md:63-72 (#sec:ELECTRONIC-SPIKES)
  - id: P09
    point: Drift describes evolution of a represented state; Fisher information concerns distinguishability in observed
      signals and a neural bound does not automatically transfer to hardware.
    source_locus: content/chapters/11-electronic-architectures.md:73-103 (#sec:ELECTRONIC-READOUT)
  - id: P10
    point: 'Hassabis and colleagues describe a two-way exchange: neuroscience can suggest AI methods and AI can
      help formulate and test ideas about brains.'
    source_locus: content/chapters/11-electronic-architectures.md:3-7
