  teaching_points:
  - id: P01
    source_locus: content/chapters/00-mathematical-tools.md:13 (sec:MATH-TOOLS-WEIGHTS)
    point: Each spike raises outgoing synaptic activation, which decays; weighted connections translate sender activations
      into receiver inputs.
  - id: P02
    source_locus: content/chapters/00-mathematical-tools.md:13 (sec:MATH-TOOLS-WEIGHTS)
    point: Transfer functions convert input to firing rate and recurrent feedback can sustain an activity pattern.
  - id: P03
    source_locus: content/chapters/00-mathematical-tools.md:13 (sec:MATH-TOOLS-WEIGHTS)
    point: A tuned two-unit inhibition example restores total activation while preserving the difference; arbitrary
      inhibition need not.
  - id: P04
    source_locus: content/chapters/00-mathematical-tools.md:13 (sec:MATH-TOOLS-WEIGHTS)
    point: Fixed points form a continuous family with stable and neutral directions; linearized eigenvalues describe
      local dynamics.
  - id: P05
    source_locus: content/chapters/00-mathematical-tools.md:13 (sec:MATH-TOOLS-WEIGHTS)
    point: A left zero vector normalized against the tangent reads the final shift after possibly tilted return
      flow.
  - id: P06
    source_locus: content/chapters/00-mathematical-tools.md:13 (sec:MATH-TOOLS-WEIGHTS)
    point: Many suitably weak independent contributions can justify Gaussian noise; matching two moments alone is
      insufficient.
  - id: P07
    source_locus: content/chapters/00-mathematical-tools.md:94 (sec:MATH-TOOLS-FISHER)
    point: Fisher information measures local sensitivity of observation probabilities to the represented value,
      not stored bits.
  - id: P08
    source_locus: content/chapters/00-mathematical-tools.md:94 (sec:MATH-TOOLS-FISHER)
    point: For independent Poisson counts, information scales as the sum of squared tuning slopes divided by firing
      rates.
  - id: P09
    source_locus: content/chapters/00-mathematical-tools.md:94 (sec:MATH-TOOLS-FISHER)
    point: Local distinguishability does not remove ambiguity between distant matching response patterns.
  - id: P10
    source_locus: content/chapters/00-mathematical-tools.md:138 (sec:MATH-TOOLS-BOUND)
    point: Projecting conditionally independent spike fluctuations gives local memory diffusion.
  - id: P11
    source_locus: content/chapters/00-mathematical-tools.md:138 (sec:MATH-TOOLS-BOUND)
    point: Cauchy Schwarz links the projection and tuning sensitivity to a model-specific information diffusion
      inequality.
  - id: P12
    source_locus: content/chapters/00-mathematical-tools.md:138 (sec:MATH-TOOLS-BOUND)
    point: The bound is not generally an equality; equality requires appropriate alignment.
  - id: P13
    source_locus: content/chapters/00-mathematical-tools.md:181 (sec:MATH-TOOLS-SHARED)
    point: Covariance records shared fluctuations after accounting for gains; private noise also affects variances
      and correlation.
  - id: P14
    source_locus: content/chapters/00-mathematical-tools.md:181 (sec:MATH-TOOLS-SHARED)
    point: Correlation is not automatically a fraction of output variance; the shared-source interpretation requires
      a measurement model.
  - id: P15
    source_locus: content/chapters/00-mathematical-tools.md:181 (sec:MATH-TOOLS-SHARED)
    point: Zero covariance, independence and shared causation are not interchangeable.
  - id: P16
    source_locus: content/chapters/00-mathematical-tools.md:235 (sec:MATH-TOOLS-FILTERS)
    point: Convolution describes a time-dependent neural input acting through a causal impulse response.
  - id: P17
    source_locus: content/chapters/00-mathematical-tools.md:235 (sec:MATH-TOOLS-FILTERS)
    point: Filtering smooths signals and changes their temporal covariance and mean squared displacement.
  - id: P18
    source_locus: content/chapters/00-mathematical-tools.md:235 (sec:MATH-TOOLS-FILTERS)
    point: Filtered white noise and filtered diffusion have distinct long-lag behavior under the model assumptions.
  - id: P19
    source_locus: content/chapters/00-mathematical-tools.md:277 (sec:MATH-TOOLS-RANDOM-FIELDS)
    point: A random field specifies correlated spatial values; once realized it represents a fixed spatial map.
  - id: P20
    source_locus: content/chapters/00-mathematical-tools.md:277 (sec:MATH-TOOLS-RANDOM-FIELDS)
    point: Spatial covariance sets local correlation length and smoothness; normalized threshold specifies active
      regions.
  - id: P21
    source_locus: content/chapters/00-mathematical-tools.md:321 (sec:MATH-TOOLS-CROSSINGS-PEAKS)
    point: The Kac Rice crossing count combines the density at threshold with velocity through the threshold.
  - id: P22
    source_locus: content/chapters/00-mathematical-tools.md:321 (sec:MATH-TOOLS-CROSSINGS-PEAKS)
    point: A high peak is locally parabolic; intersecting it with a threshold maps peak excess into spatial size.
  - id: P23
    source_locus: content/chapters/00-mathematical-tools.md:321 (sec:MATH-TOOLS-CROSSINGS-PEAKS)
    point: Changing variables requires the derivative or Jacobian, and geometric size laws depend on dimension.
  - id: P24
    source_locus: content/chapters/00-mathematical-tools.md:321 (sec:MATH-TOOLS-CROSSINGS-PEAKS)
    point: Finite thresholds, boundaries and topological holes require qualifications to high-peak or count arguments.
  - id: P25
    source_locus: content/chapters/00-mathematical-tools.md:414 (sec:MATH-TOOLS-RESULTS)
    point: The summary connects each formula to its mechanism, assumptions, meaning and source location.
