  teaching_points:
  - id: P01
    source_locus: content/chapters/05c-place-tests.md:4-25
    point: Connected fields and holes can differ at equal field count; Euler characteristic combines components,
      holes, tunnels and cavities by dimension.
  - id: P02
    source_locus: content/chapters/05c-place-tests.md:27-42
    point: Exact expected Euler characteristic for smooth stationary isotropic Gaussian fields includes boundary
      terms, and signed topology differs from field count.
  - id: P03
    source_locus: content/chapters/05c-place-tests.md:42-98
    point: Morse signs identify maxima, saddles and minima and Kac–Rice integrates signed Hessian determinants over
      critical points.
  - id: P04
    source_locus: content/chapters/05c-place-tests.md:102-127
    point: For closed boxes, face and corner contributions change expected Euler characteristic; periodic geometry
      requires different terms.
  - id: P05
    source_locus: content/chapters/05c-place-tests.md:127-153
    point: High threshold and large domain make Euler characteristic approximately field count and support a pooled
      field-weighted size estimate, subject to boundary conditions.
  - id: P06
    source_locus: content/chapters/05c-place-tests.md:157-185
    point: Data analyses estimate firing maps, fit selected summaries, and compare further distributions; model
      comparisons are not held-out forecasts.
  - id: P07
    source_locus: content/chapters/05c-place-tests.md:189-199
    point: Denoising, binning, filtering and exclusions can alter detected field size, peaks and topology.
  - id: P08
    source_locus: content/chapters/05c-place-tests.md:222-246
    point: Fitted spatial parameters vary across environments and a cell-specific threshold extension can explain
      shared cross-map count properties; these are not universal established laws.
  - id: P09
    source_locus: content/chapters/05c-place-tests.md:258-300
    point: A weighted sum of many input profiles can approach a Gaussian field under independence and no-dominant-input
      conditions, with covariance reflecting overlapping profiles.
  - id: P10
    source_locus: content/chapters/05c-place-tests.md:302-320
    point: Broader input profiles broaden covariance in a simple example; spatial-map agreement does not uniquely
      identify biological synaptic connectivity.
  - id: P11
    source_locus: content/chapters/05c-place-tests.md:201-219
    point: Boundary curvature and threshold sensitivity are additional field-shape comparisons affected by surface
      representation and finite differences.
  - id: P12
    source_locus: content/chapters/05c-place-tests.md:233-247
    point: A per-cell threshold shared between flight directions can produce correlated field counts even when maps
      are otherwise independent; the correlations are fitted features.
  - id: P13
    source_locus: content/chapters/05c-place-tests.yaml:33-61 (tbl:PLACE-DATA-COMPARISONS)
    point: Different experiments fit different summaries, including field length and gap in the 200 m bat tunnel
      and field volume and occupancy in the 3D bat room; extra comparisons differ too.
  - id: P14
    source_locus: content/chapters/05c-place-tests.yaml:33-61 (tbl:PLACE-DATA-COMPARISONS)
    point: One virtual-track histogram was directly fit to the size parameter, so it should not be presented as
      an independent out-of-sample validation.
