  alt_text: 'Part overview: Fixed weighted links beside two different population activity patterns; Two cues create
    differently positioned bumps; one later moves; Separate persistent pattern and buffer alternatives; Cross-coupled
    inverters hold a bit and a short binary word; Current charges a leaking capacitor; digital weight store is separate;
    PCM conductance cell remains set while adjacent activity trace decays; Two offset device responses and separate
    trial fluctuations; Side-by-side digital update and analog capacitor evolution; Input pulse through conductance
    into a current summing node; Compare actual feedback loops and indicate state for each; Two linked inverter
    symbols with high-low complementary states and return arrows; Two population activity levels connected to separate
    basins; Several voltage wells and a state descending to the nearby level; Ring of units with highlighted bump
    shifted by motion signal; Reference and shifted cycles with phase difference; Pulse train and distinct decaying
    activation trace; Separate conductance, capacitor state and decoded bump label; Separate moving-position distribution
    and nearby-signal likelihood comparison; Leaky capacitor with a returning current path; Three decay curves with
    increasing gain and separately marked unstable branch; Two wells with small return and separate cross-boundary
    disturbance; Perturbed bump relaxes in shape but retains its shifted position; Side-by-side bounded and expanding
    trial distributions; Preferred positions and biased endpoints versus initial cues; Model assumptions adjoining
    bound, with no arrow to universal hardware claim; Finite labeled bump positions around a ring; Two stable firing
    states and an indicated transition; Digital update blocks, analog capacitor dynamics and mixed data flow; Aligned
    wall-clock and accelerated model-clock traces; Weight update inside chip versus external weight loading; Input
    timeline creates a reservoir state feeding a trained readout; Host event processing to chip sheet with cue-off
    interval and output center; Separate PCM weight array and host computation; Programmed resistance trajectories
    for material samples; Fading input-history register beside a stationary bump; Shared comparison envelope showing
    chip, communication and host; Repeated cue-off-delay-readout timelines and fixed decoder; Starting offsets and
    subsequent mean and spread plots; A trace crossing zero degrees beside circular endpoints; Noisy readout and
    low-pass filter separated from state dynamics; Leak, weight bias and projected-noise arrows on network state;
    Aligned common noise versus independent fluctuations across cells; Matched signal-and-time windows feeding two
    decoders; Separate internal trajectory, filtered output and static spatial map.'
