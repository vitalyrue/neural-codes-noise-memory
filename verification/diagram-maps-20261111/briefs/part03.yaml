  teaching_points:
  - id: P01
    point: Connection weights set influence; changing neuron and synapse states collectively encode a remembered
      angle.
    source_locus: content/chapters/07-hardware-memory.md:5-26 (#sec:HARDWARE-MEMORY-ROLES)
  - id: P02
    point: The same weights can support different cued angles and a shifting activity bump can lose the cue without
      changing weights.
    source_locus: content/chapters/07-hardware-memory.md:5-26 (#sec:HARDWARE-MEMORY-ROLES)
  - id: P03
    point: Working memory and persistent activity are not synonymous; a buffer or slowly decaying state can also
      retain information.
    source_locus: content/chapters/07-hardware-memory.md:5-26 (#sec:HARDWARE-MEMORY-ROLES)
  - id: P04
    point: SRAM stores discrete bits through powered transistor feedback; finite words have finite precision.
    source_locus: content/chapters/07-hardware-memory.md:27-50 (#sec:HARDWARE-MEMORY-STORAGE)
  - id: P05
    point: Capacitor charge and voltage evolve under current and leakage; analog signals may be mixed with digital
      storage.
    source_locus: content/chapters/07-hardware-memory.md:27-50 (#sec:HARDWARE-MEMORY-STORAGE)
  - id: P06
    point: Phase-change material retains a programmed conductance as a weight even after a changing activity state
      vanishes.
    source_locus: content/chapters/07-hardware-memory.md:27-50 (#sec:HARDWARE-MEMORY-STORAGE)
  - id: P07
    point: Device mismatch is repeatable variation between components; moment-to-moment noise can differ between
      trials.
    source_locus: content/chapters/07-hardware-memory.md:27-50 (#sec:HARDWARE-MEMORY-STORAGE)
  - id: P08
    point: Digital chips update stored neural variables from incoming events, while analog circuits physically evolve
      voltage.
    source_locus: content/chapters/07-hardware-memory.md:51-79 (#sec:HARDWARE-MEMORY-UPDATES)
  - id: P09
    point: A PCM conductance with an applied voltage and pulse duration yields a weighted electrical contribution;
      several currents add.
    source_locus: content/chapters/07-hardware-memory.md:51-79 (#sec:HARDWARE-MEMORY-UPDATES)
  - id: P10
    point: Feedback means output affects later input; different architectures store different variables.
    source_locus: content/chapters/11-electronic-architectures.md:9-24 (#sec:ELECTRONIC-OVERVIEW)
  - id: P11
    point: Two cross-coupled inverters hold one of two powered stable states, and small perturbations return within
      a basin.
    source_locus: content/chapters/11-electronic-architectures.md:25-32 (#sec:ELECTRONIC-FLIPFLOP)
  - id: P12
    point: A recurrent spiking circuit can maintain low or high population activity, without holding an arbitrary
      angle.
    source_locus: content/chapters/11-electronic-architectures.md:25-32 (#sec:ELECTRONIC-FLIPFLOP)
  - id: P13
    point: A multistable CMOS circuit can restore one of several preferred voltages; many levels are not automatically
      a continuum.
    source_locus: content/chapters/11-electronic-architectures.md:33-46 (#sec:ELECTRONIC-MULTILEVEL)
  - id: P14
    point: A recurrent ring represents a direction in the position of an activity bump; actual circuit implementations
      can be finite and hybrid.
    source_locus: content/chapters/11-electronic-architectures.md:47-54 (#sec:ELECTRONIC-RING)
  - id: P15
    point: A sustained oscillator normally advances in phase; a disturbance can leave a persistent phase offset
      relative to its expected cycle.
    source_locus: content/chapters/11-electronic-architectures.md:55-62 (#sec:ELECTRONIC-OSCILLATOR)
  - id: P16
    point: Pulses are events, rate summarizes expected event frequency, and decaying synaptic activation accumulates
      pulse effects.
    source_locus: content/chapters/11-electronic-architectures.md:63-72 (#sec:ELECTRONIC-SPIKES)
  - id: P17
    point: Programmable conductance can store a weight rather than the current neuron state or remembered angle.
    source_locus: content/chapters/11-electronic-architectures.md:63-72 (#sec:ELECTRONIC-SPIKES)
  - id: P18
    point: Drift describes evolution of a represented state; Fisher information concerns distinguishability in observed
      signals and a neural bound does not automatically transfer to hardware.
    source_locus: content/chapters/11-electronic-architectures.md:73-103 (#sec:ELECTRONIC-READOUT)
  - id: P19
    point: Recurrent feedback can replace a fraction of a leaking state, extending its collective persistence time.
    source_locus: content/chapters/08-hardware-dynamics.md:7-44 (#sec:HARDWARE-DYNAMICS-FEEDBACK)
  - id: P20
    point: As gain approaches one from below the effective decay time increases; gain above one invalidates the
      simple linear stable model.
    source_locus: content/chapters/08-hardware-dynamics.md:7-44 (#sec:HARDWARE-DYNAMICS-FEEDBACK)
  - id: P21
    point: A small displacement inside a bit state’s basin returns, while a large enough disturbance can switch
      states.
    source_locus: content/chapters/08-hardware-dynamics.md:45-83 (#sec:HARDWARE-DYNAMICS-ERRORS)
  - id: P22
    point: In an ideal continuous attractor shape disturbances decay while displacements along the state family
      persist.
    source_locus: content/chapters/08-hardware-dynamics.md:45-83 (#sec:HARDWARE-DYNAMICS-ERRORS)
  - id: P23
    point: Repeated noise produces bounded local spread with restoration but growing variance along a neutral direction.
    source_locus: content/chapters/08-hardware-dynamics.md:45-83 (#sec:HARDWARE-DYNAMICS-ERRORS)
  - id: P24
    point: Pinning can reduce spread by drawing values to preferred states, at the cost of bias.
    source_locus: content/chapters/08-hardware-dynamics.md:45-83 (#sec:HARDWARE-DYNAMICS-ERRORS)
  - id: P25
    point: The 2012 information bound is conditional on its neural model and cannot be assumed for every electronic
      memory.
    source_locus: content/chapters/08-hardware-dynamics.md:45-83 (#sec:HARDWARE-DYNAMICS-ERRORS)
  - id: P26
    point: The 32-position head-direction demonstration has finite spatial resolution, not a proven continuous family
      or Brownian law.
    source_locus: content/chapters/08-hardware-dynamics.md:84-108 (#sec:HARDWARE-DYNAMICS-EVIDENCE)
  - id: P27
    point: A separate recurrent spiking device exhibited bistable persistent activity and noise-related switching.
    source_locus: content/chapters/08-hardware-dynamics.md:84-108 (#sec:HARDWARE-DYNAMICS-EVIDENCE)
  - id: P28
    point: Digital systems calculate states; analog circuits evolve physical variables, and hybrid systems combine
      these.
    source_locus: content/chapters/09-neuromorphic-systems.md:9-22 (#sec:NEUROMORPHIC-SYSTEMS-ARCHITECTURES)
  - id: P29
    point: Accelerated analog model time changes the relation between physical communication delays and simulated
      time.
    source_locus: content/chapters/09-neuromorphic-systems.md:9-22 (#sec:NEUROMORPHIC-SYSTEMS-ARCHITECTURES)
  - id: P30
    point: On-chip learning updates weights on chip and differs from loading previously trained weights.
    source_locus: content/chapters/09-neuromorphic-systems.md:9-22 (#sec:NEUROMORPHIC-SYSTEMS-ARCHITECTURES)
  - id: P31
    point: Loihi 2 input-history computation provides temporal features to a trained readout, not indefinite cue
      retention.
    source_locus: content/chapters/09-neuromorphic-systems.md:23-38 (#sec:NEUROMORPHIC-SYSTEMS-ADVANCES)
  - id: P32
    point: A SpiNNaker2 recurrent sheet maintained an activity center over a reported delay; host processing, jitter
      and lag limit its interpretation.
    source_locus: content/chapters/09-neuromorphic-systems.md:23-38 (#sec:NEUROMORPHIC-SYSTEMS-ADVANCES)
  - id: P33
    point: PCM weighted multiplication can support adaptation while other operations run on a host.
    source_locus: content/chapters/09-neuromorphic-systems.md:23-38 (#sec:NEUROMORPHIC-SYSTEMS-ADVANCES)
  - id: P34
    point: Reduced drift in a material concerns stability of programmed conductance, not an already complete processor.
    source_locus: content/chapters/09-neuromorphic-systems.md:23-38 (#sec:NEUROMORPHIC-SYSTEMS-ADVANCES)
  - id: P35
    point: A slow input-history pathway holds decaying recent information and differs from a cue stored on a continuous
      attractor.
    source_locus: content/chapters/09-neuromorphic-systems.md:39-91 (#sec:NEUROMORPHIC-SYSTEMS-LIMITS)
  - id: P36
    point: Comparison of systems must include task, error, delay, communication, conversion, and host computation.
    source_locus: content/chapters/09-neuromorphic-systems.md:39-91 (#sec:NEUROMORPHIC-SYSTEMS-LIMITS)
  - id: P37
    point: Calibrate a decoder separately; present a cue, remove it, retain fixed weights and decode after multiple
      delays over repeated trials.
    source_locus: content/chapters/10-hardware-tests.md:7-42 (#sec:HARDWARE-TESTS-PROTOCOL)
  - id: P38
    point: Separate initial writing error, mean displacement and trial-to-trial spread; test multiple cue angles.
    source_locus: content/chapters/10-hardware-tests.md:7-42 (#sec:HARDWARE-TESTS-PROTOCOL)
  - id: P39
    point: A circular angle requires suitable unwrapping, and local variance cannot be extended indefinitely around
      the circle.
    source_locus: content/chapters/10-hardware-tests.md:7-42 (#sec:HARDWARE-TESTS-PROTOCOL)
  - id: P40
    point: Readout noise adds displacement variance and observation filtering changes temporal shape, so calibrate
      both.
    source_locus: content/chapters/10-hardware-tests.md:7-42 (#sec:HARDWARE-TESTS-PROTOCOL)
  - id: P41
    point: Leak and recurrent-weight changes alter decay or pinning; only projected neural disturbances shift a
      remembered value.
    source_locus: content/chapters/10-hardware-tests.md:43-78 (#sec:HARDWARE-TESTS-PARAMETERS)
  - id: P42
    point: 'Noise correlation matters: shared fluctuations need not average away like independent fluctuations.'
    source_locus: content/chapters/10-hardware-tests.md:43-78 (#sec:HARDWARE-TESTS-PARAMETERS)
  - id: P43
    point: A valid information comparison matches observed signals, noise, dynamics, observation time and decoder.
    source_locus: content/chapters/10-hardware-tests.md:79-97 (#sec:HARDWARE-TESTS-COMPARISON)
  - id: P44
    point: Output filtering and spatial field statistics do not by themselves prove internal memory stability.
    source_locus: content/chapters/10-hardware-tests.md:79-97 (#sec:HARDWARE-TESTS-COMPARISON)
  - id: P45
    point: 'Hassabis and colleagues describe a two-way exchange: neuroscience can suggest AI methods and AI can
      help formulate and test ideas about brains.'
    source_locus: content/chapters/11-electronic-architectures.md:3-7
  - id: P46
    point: A slowly decaying input-history state has an effective retention time determined by the update interval
      and retained fraction; it is not the same as stable continuous-attractor memory.
    source_locus: content/chapters/09-neuromorphic-systems.md:41-55
  - id: P47
    point: Compare physical and model time explicitly in accelerated hardware, and include writing, waiting, reading,
      communication and host work in an energy comparison.
    source_locus: content/chapters/10-hardware-tests.md:91-95
  - id: P48
    point: Finite precision or bit errors affect digital words, leakage and physical noise affect capacitor states,
      PCM programming/read error and drift affect conductance, and network drift or pattern loss affects a represented
      angle.
    source_locus: content/chapters/07-hardware-memory.yaml:45-75 (tbl:HARDWARE-STORAGE)
  - id: P49
    point: Loihi 2 and SpiNNaker2 store and update state digitally; BrainScaleS-2 uses digital SRAM weights and
      physical analog membrane states; PCM systems use conductances for weighted reads while other components implement
      remaining computation.
    source_locus: content/chapters/09-neuromorphic-systems.yaml:43-70 (tbl:NEUROMORPHIC-ARCHITECTURES)
  - id: P50
    point: 'Controlled hardware tests relate feedback, noise, calibration, numerical precision and PCM aging to
      different outcomes: persistence, variance, drift, quantization or changes in connection strengths.'
    source_locus: content/chapters/10-hardware-tests.yaml:41-66 (tbl:HARDWARE-TEST-PARAMETERS)
