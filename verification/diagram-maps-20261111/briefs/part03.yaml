- id: S2
  exact_label: Feedback architectures
  teaching_point: Show separate architectures with two states, several preferred states, and a position encoded
    by a bump; do not equate discrete levels with a continuum.
  visual_role: mechanism and comparison
- id: S3
  exact_label: Stability and noise
  teaching_point: Show how restoration suppresses small deviations while a neutral direction wanders, and how pinning
    adds a preferred value.
  visual_role: mechanism and comparison
- id: S4
  exact_label: Retention and readout
  teaching_point: Distinguish write error, average drift and trial spread; identify readout as a separate measurement.
  visual_role: mechanism and comparison
