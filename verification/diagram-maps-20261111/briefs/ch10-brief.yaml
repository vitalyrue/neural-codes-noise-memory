  teaching_points:
  - id: P01
    source_locus: content/chapters/05-place-fields.md:4-11
    point: Large environments reveal multiple irregular hippocampal fields in bats and rodents; model proposes a
      smooth random spatial input.
  - id: P02
    source_locus: content/chapters/05-place-fields.md:15-35
    point: Normalizing input and applying a threshold and positive gain yields a firing map; spatial randomness
      describes an ensemble of maps, not motion of a drawn map.
  - id: P03
    source_locus: content/chapters/05-place-fields.md:37-77
    point: A Gaussian process is defined by joint Gaussian values, mean and covariance; smooth sample paths need
      extra covariance regularity.
  - id: P04
    source_locus: content/chapters/05-place-fields.md:80-128
    point: Normalized threshold q and local spatial scale sigma have separate meanings; active connected regions
      become 1D, 2D or 3D place fields.
  - id: P05
    source_locus: content/chapters/05-place-fields.md:131-140
    point: An illustrative fixed Gaussian map crosses threshold several times and produces multiple fields.
  - id: P06
    source_locus: content/chapters/05-place-fields.md:143-194
    point: Kac–Rice weights zero crossings by positive slope; height and slope independence gives exact upcrossing
      intensity for a smooth stationary Gaussian process.
  - id: P07
    source_locus: content/chapters/05-place-fields.md:207-215
    point: A finite track may begin inside a field, so expected field count includes an endpoint term.
  - id: P08
    source_locus: content/chapters/05-place-fields.md:217-255
    point: Mean active fraction, field length and gap length constrain threshold and scale differently; a long-track
      example demonstrates inference.
  - id: P09
    source_locus: content/chapters/05-place-fields.md:262-276
    point: Mean lengths do not determine full gap or count distributions, and excluding silent cells changes count
      means by conditioning.
  - id: P10
    source_locus: content/chapters/05-place-fields.md:257-270
    point: A rare-field Poisson count and exponential gap approximation require sufficiently decaying long-distance
      dependence, beyond smooth stationarity.
  - id: P11
    source_locus: content/chapters/05-place-fields.yaml:34-43 (fig:PLACE-CROSSINGS)
    point: A steeper crossing occupies a narrower band around threshold; weighting by slope compensates so each
      crossing contributes one.
