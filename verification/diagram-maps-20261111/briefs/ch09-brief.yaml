  teaching_points:
  - id: P01
    source_locus: content/chapters/04c-eye-circuit.md:4-22
    point: A noisy integrator is one candidate upstream source; thresholded neuron rates and saturated synapses
      participate in recurrent interactions.
  - id: P02
    source_locus: content/chapters/04c-eye-circuit.md:31-58
    point: Synaptic outputs decay and feedback can support persistent represented positions; a continuum requires
      balanced feedback over the range.
  - id: P03
    source_locus: content/chapters/04c-eye-circuit.md:60-95
    point: Integrator output drives motor units whose spike trains are filtered through muscle and plant dynamics
      to eye position.
  - id: P04
    source_locus: content/chapters/04c-eye-circuit.md:95-107
    point: Delayed visual feedback changes the internal command; its delay alone does not determine the short-lag
      MSD.
  - id: P05
    source_locus: content/chapters/04c-eye-circuit.md:128-145
    point: The paper gives diffusion scaling with neuron number, spike regularity, firing, sensitivity and synaptic
      time; normalization of printed sensitivity is unspecified.
  - id: P06
    source_locus: content/chapters/04c-eye-circuit.md:147-163
    point: Sub-Poisson interval construction retains every Mth event; long-window count variance scales with squared
      interval CV.
  - id: P07
    source_locus: content/chapters/04c-eye-circuit.md:165-197
    point: A simple information-based scaling distinguishes fixed absolute tuning slope from fixed fractional slope;
      it is not an exact derivation of the full nonlinear network.
  - id: P08
    source_locus: content/chapters/04c-eye-circuit.md:199-216
    point: The supplement estimates a small contribution of slow drift to within-fixation rate variability under
      its assumptions.
  - id: P09
    source_locus: content/chapters/04c-eye-circuit.md:219-286
    point: Recorded shared drive, MSD, and full-model simulation compare complementary aspects and do not independently
      identify one microscopic circuit.
  - id: P10
    source_locus: content/chapters/04c-eye-circuit.md:287-307
    point: Upstream noisy input or already-diffusive signals remain possible; results concern horizontal fixation
      in two animals.
  - id: P11
    source_locus: content/chapters/04c-eye-circuit.md:165-197
    point: Increasing firing rate affects the diffusion scale differently when absolute slope rather than fractional
      slope is held fixed; slope normalization in the paper is not explicit.
  - id: P12
    source_locus: content/chapters/04c-eye-circuit.yaml:35-71 (tbl:EYE-FIGURE-GUIDE)
    point: The paper figure’s attractor valley is a conceptual picture of stable and neutral directions, not a measured
      energy landscape.
  - id: P13
    source_locus: content/chapters/04c-eye-circuit.yaml:35-71 (tbl:EYE-FIGURE-GUIDE)
    point: Rerunning the shared-variance analysis on simulated recordings checks that method under known modeled
      sources, not a unique biological mechanism.
  - id: P14
    source_locus: content/chapters/04c-eye-circuit.yaml:112-122 (fig:PAPER-EYE-ED4)
    point: In the paper’s no-central-drive simulation the estimated shared variance is compatible with zero.
