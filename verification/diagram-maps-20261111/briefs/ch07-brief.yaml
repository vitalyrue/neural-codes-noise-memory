  chapter_source_sha256: b8d4087648007df912b6d123509ef65ff7dc112a7f683b3f2eb9cf47d252e2a4
  teaching_points:
  - id: P01
    source_locus: content/chapters/04-eye-drift.md:4-28
    point: Fixation drift remains after microsaccades and its measured common variance requires assumptions about
      calibration and residual covariance.
  - id: P02
    source_locus: content/chapters/04-eye-drift.md:30-62
    point: An upstream position command reaches ocular motor neurons and opposing eye muscles; private fluctuations
      average differently from a shared signal.
  - id: P03
    source_locus: content/chapters/04-eye-drift.md:63-94
    point: Two macaques yielded paired eye and single motor neuron recordings, not simultaneous pairs of motor neurons;
      segments and calibrating movements serve different roles.
  - id: P04
    source_locus: content/chapters/04-eye-drift.md:96-128
    point: Fitted firing rate depends on position, velocity and acceleration with a neural lead and active-rate
      range.
  - id: P05
    source_locus: content/chapters/04-eye-drift.md:133-145
    point: Weak individual fixation correlations can yield a positive population relationship; cells are not independent
      animals.
  - id: P06
    source_locus: content/chapters/04-eye-drift.md:155-232
    point: The inverse causal filter transforms one spike train to predicted eye position; its two decaying terms
      and calibrated area set timing and gain.
  - id: P07
    source_locus: content/chapters/04-eye-drift.md:264-275
    point: Single-cell reconstructed drift is noisy compared with the measured movement and correlation alone is
      not the shared variance fraction.
  - id: P08
    source_locus: content/chapters/04-eye-drift.md:278-318
    point: If private motor inputs were independent across many units, their average squared correlations obey a
      bound; the observed correlation challenges that model.
  - id: P09
    source_locus: content/chapters/04-eye-drift.md:320-405
    point: With equal calibrated common gain and negligible residual covariance, prediction–movement covariance
      divided by eye variance estimates common movement variance, not a cell’s explained fraction.
  - id: P10
    source_locus: content/chapters/04-eye-drift.md:405-432
    point: Weighted estimates and uncertainty apply to noisy cell estimates; the reported common fraction depends
      on transfer of calibration from large movement to drift.
  - id: P11
    source_locus: content/chapters/04-eye-drift.md:405-432
    point: The weighted estimate of the common variance fraction is about 0.82 with reported uncertainty; it depends
      on calibration and the common-signal model.
  - id: P12
    source_locus: content/chapters/04-eye-drift.yaml:103-113 (fig:PAPER-EYE-ED6)
    point: Response parameters help distinguish motor neurons from internuclear neurons in the cited supplementary
      figure.
