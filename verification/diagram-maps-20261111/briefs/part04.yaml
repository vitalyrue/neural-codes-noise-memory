  caption: Three distinct simulations compare neural memory, eye motion, and static spatial firing maps; careful
    implementation and measurement make each comparison testable.
  alt_text: 'Part overview: State to weighted input to rate to random events to next state loop; Short step and
    low-probability event indicator; Ring and position-coded bump; Separate tuning-curve prediction and stochastic
    trials converge at comparison; Largest-rate index beside continuous projection marked distinct; Circle wrapping
    and bounded angular-error curve; Two units with reciprocal inhibitory links and rate/activation coordinate key;
    Formula curve separated from event-driven simulation; Sequential single-cell records with held-out trial; Measured
    and predicted displacement traces sharing a latent drive; Opposing populations to common internal command; Command
    to motor spikes to mechanical filter to eye angle; Eye-output delay branch and current-command branch entering
    subtraction; Three separated control pipelines with common observation statistic; Simulated motor spikes and
    eye output entering the same analysis; Separate model code, raw recordings and processed summary inputs; Random
    grid smoothed into continuous field then thresholded into active regions; Five sequential grid-state representations
    with normalized scale; Position axis clearly separate from time trajectory; Data summaries entering parameter
    fitting loop; Fitted features separated from additional histogram and topology comparisons; Two model likelihood
    comparisons marked in-sample; Same grid under two connectivity or cutoff rules; Filter kernel and broader covariance
    curve with different boundary treatments; Tools linked to operations; missing dataset depicted separately; Three
    separately labeled implementation paths to different claims; Program output compared against source and target
    measurement; Run record connected to random draws; Separate deterministic solver, event generator and stochastic
    increments; A grid with two connectivity choices and separate neuron model; Coarse/fine time and space scales
    feeding matched comparison; Four short increments versus one long increment with matched total variance; Fine
    internal trace sampled by a coarse output grid; A compact record grouping parameters, measurement and independent
    repeats.'
