  teaching_points:
  - id: P01
    point: At each step, activations set weighted input and rate, conditional random spikes are generated, and activation
      decays and renews.
    source_locus: content/chapters/11-simulating-memory.md:5-27 (#sec:SIMULATING-MEMORY-STATE)
  - id: P02
    point: The time step must resolve decay and have a small event probability for the one-spike update.
    source_locus: content/chapters/11-simulating-memory.md:5-27 (#sec:SIMULATING-MEMORY-STATE)
  - id: P03
    point: A ring orders neurons by preferred angle and encodes the value in an activity bump.
    source_locus: content/chapters/11-simulating-memory.md:28-51 (#sec:SIMULATING-MEMORY-RING)
  - id: P04
    point: The noise-free tuning curves predict diffusion; simulated trajectories independently supply angle displacement
      measurements.
    source_locus: content/chapters/11-simulating-memory.md:28-51 (#sec:SIMULATING-MEMORY-RING)
  - id: P05
    point: The highest-rate neuron is a quantized numerical proxy, not the same as projection to the noise-free
      attractor.
    source_locus: content/chapters/11-simulating-memory.md:28-51 (#sec:SIMULATING-MEMORY-RING)
  - id: P06
    point: Wrapped angle displacement reaches a finite range; flattening does not prove restored original memory.
    source_locus: content/chapters/11-simulating-memory.md:28-51 (#sec:SIMULATING-MEMORY-RING)
  - id: P07
    point: A two-unit mutually inhibitory system tests conclusions without ring symmetry, with a change of coordinates
      affecting diffusion units.
    source_locus: content/chapters/11-simulating-memory.md:52-72 (#sec:SIMULATING-MEMORY-CONTROLS)
  - id: P08
    point: Readout-error formula plots are analytical comparisons, not additional neural-network simulations; original
      simulator software was not identified.
    source_locus: content/chapters/11-simulating-memory.md:73-87 (#sec:SIMULATING-MEMORY-OUTPUTS)
  - id: P09
    point: Recordings come from 57 motor neurons in two macaques in separate single-cell recordings; held-out trials
      test rate predictions.
    source_locus: content/chapters/12-simulating-eye-drift.md:5-12 (#sec:SIMULATING-EYE-DATA)
  - id: P10
    point: Eye motion and a prediction from one neuron covary; the shared fraction estimate depends on calibration
      and noise assumptions.
    source_locus: content/chapters/12-simulating-eye-drift.md:5-12 (#sec:SIMULATING-EYE-DATA)
  - id: P11
    point: Two integrator populations produce an internal position command through their activity difference.
    source_locus: content/chapters/12-simulating-eye-drift.md:13-39 (#sec:SIMULATING-EYE-PATH)
  - id: P12
    point: Motor neurons translate command into noisy spike trains and muscles filter their contributions into eye
      position.
    source_locus: content/chapters/12-simulating-eye-drift.md:13-39 (#sec:SIMULATING-EYE-PATH)
  - id: P13
    point: Delayed eye position and current internal command contribute differently to feedback input.
    source_locus: content/chapters/12-simulating-eye-drift.md:13-39 (#sec:SIMULATING-EYE-PATH)
  - id: P14
    point: Compare fixed-command private motor noise, noisy internal command, and full pathway rather than relying
      on one irregular trajectory.
    source_locus: content/chapters/12-simulating-eye-drift.md:40-50 (#sec:SIMULATING-EYE-CONTROLS)
  - id: P15
    point: Apply the measured-data reconstruction to simulations and check measurement-noise and feedback controls.
    source_locus: content/chapters/12-simulating-eye-drift.md:40-50 (#sec:SIMULATING-EYE-CONTROLS)
  - id: P16
    point: Released MATLAB model code and raw recordings support different reproductions; a processed MSD alone
      is not raw data reanalysis.
    source_locus: content/chapters/12-simulating-eye-drift.md:51-69 (#sec:SIMULATING-EYE-TOOLS)
  - id: P17
    point: A smooth Gaussian input field with specified spatial covariance is thresholded and scaled into firing-rate
      maps.
    source_locus: content/chapters/13-simulating-place-fields.md:5-26 (#sec:SIMULATING-PLACE-GENERATE)
  - id: P18
    point: The released spatial generator uses random grid draws, smoothing, RMS normalization, thresholding and
      connected field detection.
    source_locus: content/chapters/13-simulating-place-fields.md:5-26 (#sec:SIMULATING-PLACE-GENERATE)
  - id: P19
    point: These are static spatial maps, not direct simulations of recurrent hippocampal spikes or synapses.
    source_locus: content/chapters/13-simulating-place-fields.md:5-26 (#sec:SIMULATING-PLACE-GENERATE)
  - id: P20
    point: Threshold and spatial scale are selected using condition-specific summaries; matching those summaries
      is a fit.
    source_locus: content/chapters/13-simulating-place-fields.md:27-36 (#sec:SIMULATING-PLACE-FIT)
  - id: P21
    point: Full distributions, slices, peaks and holes supply further comparisons, though some also fit a gain.
    source_locus: content/chapters/13-simulating-place-fields.md:27-36 (#sec:SIMULATING-PLACE-FIT)
  - id: P22
    point: The lognormal model comparison uses the available data, not a reported held-out forecast; simulation
      realizations sample model variation.
    source_locus: content/chapters/13-simulating-place-fields.md:27-36 (#sec:SIMULATING-PLACE-FIT)
  - id: P23
    point: Connectivity, thresholds and smoothing can merge or split fields, changing counts, lengths and topology.
    source_locus: content/chapters/13-simulating-place-fields.md:37-61 (#sec:SIMULATING-PLACE-MEASURE)
  - id: P24
    point: The Gaussian filter width differs from the resulting correlation scale; boundary handling varies by implementation.
    source_locus: content/chapters/13-simulating-place-fields.md:37-61 (#sec:SIMULATING-PLACE-MEASURE)
  - id: P25
    point: NumPy and SciPy generate and measure maps and Gudhi evaluates topology; code availability differs from
      data and run-setting availability.
    source_locus: content/chapters/13-simulating-place-fields.md:62-80 (#sec:SIMULATING-PLACE-TOOLS)
  - id: P26
    point: Authors’ code, independent implementation and simplified teaching model answer different reproduction
      questions.
    source_locus: content/chapters/14-simulation-tools.md:5-14 (#sec:SIMULATION-TOOLS-ROUTES)
  - id: P27
    point: A successful run alone does not establish agreement with published model, data and measurements.
    source_locus: content/chapters/14-simulation-tools.md:5-14 (#sec:SIMULATION-TOOLS-ROUTES)
  - id: P28
    point: Random generator, seed, software versions and call ordering determine reproducibility; the seed alone
      is insufficient.
    source_locus: content/chapters/14-simulation-tools.md:15-32 (#sec:SIMULATION-TOOLS-SOFTWARE)
  - id: P29
    point: A deterministic ODE solver does not by itself implement Poisson spikes or Brownian increments.
    source_locus: content/chapters/14-simulation-tools.md:15-32 (#sec:SIMULATION-TOOLS-SOFTWARE)
  - id: P30
    point: Field connectivity rules and the choice of spiking simulator affect what model and measurement are implemented.
    source_locus: content/chapters/14-simulation-tools.md:15-32 (#sec:SIMULATION-TOOLS-SOFTWARE)
  - id: P31
    point: Refining simulation time step or spatial grid while preserving physical parameters tests convergence
      in reported results.
    source_locus: content/chapters/14-simulation-tools.md:33-54 (#sec:SIMULATION-TOOLS-RESOLUTION)
  - id: P32
    point: For Brownian increments variance scales with step duration, so the standard deviation scales with its
      square root.
    source_locus: content/chapters/14-simulation-tools.md:33-54 (#sec:SIMULATION-TOOLS-RESOLUTION)
  - id: P33
    point: Saving output too sparsely can discard temporal information despite a small internal time step.
    source_locus: content/chapters/14-simulation-tools.md:33-54 (#sec:SIMULATION-TOOLS-RESOLUTION)
  - id: P34
    point: Preserve source, target, model, inputs, numerical settings, measurement and uncertainty, with the true
      independent repeat as unit.
    source_locus: content/chapters/14-simulation-tools.md:55-77 (#sec:SIMULATION-TOOLS-RECORD)
  - id: P35
    point: 'A mutually excitatory pair supplies a separate control: across trials variance can grow linearly even
      when local diffusion varies with state.'
    source_locus: content/chapters/11-simulating-memory.md:69-71
  - id: P36
    point: The model reports neuron counts and timing, but the meaning of N differs between paper wording and code
      population vectors and must be resolved before claiming exact reproduction.
    source_locus: content/chapters/12-simulating-eye-drift.md:32-36
  - id: P37
    point: The sampled spatial map is normalized by its root mean square before thresholding; finite-grid smoothing
      and edge handling affect the realized map.
    source_locus: content/chapters/13-simulating-place-fields.md:15-25
  - id: P38
    point: When refining a spatial grid, increase the correlation scale in grid samples to keep the same physical
      correlation length; a spiking network also requires its own discrete-event rule.
    source_locus: content/chapters/14-simulation-tools.md:49-55
  - id: P39
    point: The eye model has released MATLAB code, the spatial study uses Python tools and Gudhi, while SciPy solve_ivp
      and Brian 2 are optional reconstruction tools whose model and event rules must be matched.
    source_locus: content/chapters/14-simulation-tools.yaml:44-68 (tbl:SIMULATION-TOOLS)
