chapter_map_coverage:
  applicable: false
  reason: This is a Part map; chapter-specific coverage threshold does not apply.
  source_scope_inventory:
  - id: P01
    source_locus: content/chapters/01-foundations.md:63-137 (sec:MEMORY-SPIKES)
    point: Spikes maintain decaying synaptic activations; weighted recurrent inputs and a transfer function determine
      subsequent rates.
  - id: P02
    source_locus: content/chapters/01-foundations.md:138-186 (sec:FOUNDATIONS-SPIKES and sec:FOUNDATIONS-POISSON)
    point: A population firing pattern can represent an angle and its spike counts vary across observations.
  - id: P03
    source_locus: content/chapters/01b-persistence.md:7-90 (sec:FOUNDATIONS-ATTRACTOR)
    point: Continuous attractor states return from some disturbances but retain displacement along their neutral
      direction.
  - id: P04
    source_locus: content/chapters/02-memory-dynamics.md:127-330 (sec:MEMORY-LINEARIZATION and sec:MEMORY-DIFFUSION)
    point: Projecting independent spike fluctuations through the network return flow gives local diffusion of the
      stored coordinate.
  - id: P05
    source_locus: content/chapters/02-memory-dynamics.md:331 (sec:MEMORY-SYMMETRIC)
    point: The connection-symmetric special case expresses diffusion via tuning slopes and the corrected formula.
  - id: P06
    source_locus: content/chapters/02b-memory-long-delays.md:13-70 (sec:MEMORY-FIGURES)
    point: The paper compares theory with ring and two-unit simulated networks rather than animal memory trajectories.
  - id: P07
    source_locus: content/chapters/02b-memory-long-delays.md:71-200 (sec:MEMORY-LONG-TIME)
    point: Long delays, boundaries or state-dependent diffusion alter the short-time error description.
  - id: P08
    source_locus: content/chapters/02b-memory-long-delays.md:201 (sec:MEMORY-DRIFT-SCOPE)
    point: Systematic drift of the mean and random spreading are separate effects.
  - id: P09
    source_locus: content/chapters/03-memory-information.md:27-179 (sec:MEMORY-FI)
    point: Spike tuning and variability set local internal Fisher information under the model’s spike assumptions.
  - id: P10
    source_locus: content/chapters/03-memory-information.md:180-228,344-428 (sec:MEMORY-BOUND and sec:MEMORY-SATURATION)
    point: The information diffusion inequality sets a lower limit on diffusion under the specified assumptions;
      equality requires special alignment.
  - id: P11
    source_locus: content/chapters/03-memory-information.md:229-343,429 (sec:MEMORY-EXTENSIONS and sec:MEMORY-COMPARISONS)
    point: Generalizations and parameter comparisons require the relevant time scales, noise model and fixed quantities.
  - id: P12
    source_locus: content/chapters/03b-memory-readout.md:26-86 (sec:MEMORY-READOUT-SETUP)
    point: Storage error accumulates before recall; readout error concerns estimating the state at the recall cue
      from spikes observed afterward, while the state keeps moving.
  - id: P13
    source_locus: content/chapters/03b-memory-readout.md:87-276 (sec:MEMORY-IDEAL and sec:MEMORY-NAIVE)
    point: An ideal observer’s readout error decreases toward a limit; equal weighting has a finite optimum.
  - id: P14
    source_locus: content/chapters/03b-memory-readout.md:277-311 (sec:MEMORY-PARTIAL)
    point: Partial access reduces information available for readout without reducing the full network’s diffusion.
  - id: P15
    source_locus: content/chapters/03b-memory-readout.md:350 (sec:MEMORY-MINIMUM-VARIANCE)
    point: The guide identifies an apparent issue with a printed error bound as its own check, not an official correction.
