communication_plan:
  layout: Landscape with linked scenes, with enough space to distinguish source results from interpretation.
  keep_in_text:
  - Full derivations
  - Numerical model values
  - Correction details
  required_visible_conditions:
  - Bound is model-specific
  - Simulation points are not biological observations
  - Readout concerns a moving state
normal_flow:
- spikes -> synaptic activation -> weighted input -> firing rate
- noise -> retained state shift -> diffusion
- spike information and model assumptions -> diffusion bound
- storage delay -> cue -> observation of a moving state
secondary_relationships:
- type: feedback
  source: firing rate and subsequent spikes
  destination: synaptic activation
  meaning: Recurrent activity renews synaptic effects.
exact_text:
  required:
  - Recurrent activity
  - Diffusion
  - Information bound
  - Readout
  prohibited:
  - perfect memory
  - animal experiment proves the model
  - title banner
constraints:
- Do not imply that the 2012 paper invented the attractor model.
- Do not imply an external readout creates the internal diffusion bound.
- Report final-image Part-level scope coverage with visible evidence; no acceptance has been granted.
dispositions:
- P15 concerns a discrepancy in a printed error bound. It is retained in the full source inventory but cannot be
  established by the proposed timeline or error curves; leave it uncredited unless an explicit source comparison
  is legible.
