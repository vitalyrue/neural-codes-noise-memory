  chapter_source_sha256: 1a49b4b23a1586496f2a474c16f306ea64c54a9068d8d9546e112968a56e0c0d
  teaching_points:
  - id: P01
    source_locus: content/chapters/03-memory-information.md:27 (sec:MEMORY-FI)
    point: The internal Fisher information rate quantifies local distinguishability of nearby current attractor
      states from network spikes.
  - id: P02
    source_locus: content/chapters/03-memory-information.md:27 (sec:MEMORY-FI)
    point: Under positive conditionally independent Poisson rates, contributions combine squared tuning slopes divided
      by rates.
  - id: P03
    source_locus: content/chapters/03-memory-information.md:27 (sec:MEMORY-FI)
    point: Steeper response changes at fixed noise increase local information; higher baseline at fixed slope can
      reduce it.
  - id: P04
    source_locus: content/chapters/03-memory-information.md:27 (sec:MEMORY-FI)
    point: Local information alone cannot resolve ambiguity between distant identical response patterns.
  - id: P05
    source_locus: content/chapters/03-memory-information.md:180 (sec:MEMORY-BOUND)
    point: The information diffusion inequality bounds D from below using information rate and common synaptic time
      constant.
  - id: P06
    source_locus: content/chapters/03-memory-information.md:180 (sec:MEMORY-BOUND)
    point: Projection normalization and Cauchy Schwarz establish the bound; symmetric connections are not required
      for this scalar proof.
  - id: P07
    source_locus: content/chapters/03-memory-information.md:180 (sec:MEMORY-BOUND)
    point: A lower bound is not a prediction that every network reaches it.
  - id: P08
    source_locus: content/chapters/03-memory-information.md:229 (sec:MEMORY-EXTENSIONS)
    point: For multiple coordinates the diffusion and information become matrices with directional and coupled relationships.
  - id: P09
    source_locus: content/chapters/03-memory-information.md:229 (sec:MEMORY-EXTENSIONS)
    point: Different synaptic time scales require corresponding assumptions and modify the simple bound.
  - id: P10
    source_locus: content/chapters/03-memory-information.md:229 (sec:MEMORY-EXTENSIONS)
    point: Other noise laws need their matching information and fluctuation models, not automatic Poisson reuse.
  - id: P11
    source_locus: content/chapters/03-memory-information.md:344 (sec:MEMORY-SATURATION)
    point: Equality requires alignment between the projected noise direction and information-bearing tuning direction.
  - id: P12
    source_locus: content/chapters/03-memory-information.md:344 (sec:MEMORY-SATURATION)
    point: Network connectivity and transfer function affect whether equality is reached.
  - id: P13
    source_locus: content/chapters/03-memory-information.md:429 (sec:MEMORY-COMPARISONS)
    point: Changing network size, firing rate, slope, or time constant has a defined effect only after specifying
      what is fixed.
  - id: P14
    source_locus: content/chapters/03-memory-information.md:429 (sec:MEMORY-COMPARISONS)
    point: Information refers to the current network state and must be distinguished from downstream estimate of
      the original cue.
