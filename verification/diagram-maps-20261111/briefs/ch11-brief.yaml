  teaching_points:
  - id: P01
    source_locus: content/chapters/05b-place-sizes.md:5-31
    point: A high isolated peak has approximately parabolic geometry and a nearly exponential scaled excess; converting
      to dimension-dependent size gives an asymptotic density.
  - id: P02
    source_locus: content/chapters/05b-place-sizes.md:33-83
    point: The Hessian supplies principal curvatures; isotropic high peaks have a leading mean curvature with residual
      fluctuations.
  - id: P03
    source_locus: content/chapters/05b-place-sizes.md:85-115
    point: The high-peak expansion relates radius to peak excess, whose exponential limit follows from rare-peak
      counts.
  - id: P04
    source_locus: content/chapters/05b-place-sizes.md:115-149
    point: High-threshold isolation, smoothness and near-isotropy are assumptions; finite thresholds can have important
      shape deviations.
  - id: P05
    source_locus: content/chapters/05b-place-sizes.md:151-192
    point: The volume of a d-dimensional ball converts radius to length, area or volume, with a Jacobian for the
      size density.
  - id: P06
    source_locus: content/chapters/05b-place-sizes.md:201-230
    point: Normalization and moments follow from the exponential transformation; normalized distributions differ
      by spatial dimension even when a transformed variable collapses.
  - id: P07
    source_locus: content/chapters/05b-place-sizes.md:233-249
    point: A finite-threshold numerical comparison exposes error in applying the limiting law and guide checks distinguish
      source algebra.
  - id: P08
    source_locus: content/chapters/05b-place-sizes.md:253-288
    point: A line or plane slice has the lower-dimensional excursion law, but uniform spatial sampling size-biases
      which original fields are intersected.
  - id: P09
    source_locus: content/chapters/05b-place-sizes.md:300-329
    point: Crossing locations weight positive slopes, yielding a Rayleigh boundary-slope law under the Gaussian
      assumptions without a high-threshold approximation.
  - id: P10
    source_locus: content/chapters/05b-place-sizes.md:117-142
    point: For high thresholds the model predicts peak firing rate proportional to the square of linear field size;
      finite-threshold observations have smaller exponents and are not measurements of the limiting law.
  - id: P11
    source_locus: content/chapters/05b-place-sizes.md:253-288
    point: Slicing and thresholding commute for the same field, but one three-dimensional component can be missed
      or cut into multiple pieces.
  - id: P12
    source_locus: content/chapters/05b-place-sizes.yaml:37-60 (tbl:PLACE-SIZE-LAWS)
    point: The high-threshold length law in one dimension is Rayleigh, the area law in two dimensions exponential,
      and the volume law in three dimensions Weibull with shape 2/3.
  - id: P13
    source_locus: content/chapters/05b-place-sizes.yaml:37-60 (tbl:PLACE-SIZE-LAWS)
    point: The limiting three-dimensional volume density diverges at zero but is integrable; a divergent density
      is not infinite probability.
