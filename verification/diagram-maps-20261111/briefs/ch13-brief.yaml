  teaching_points:
  - id: P01
    source_locus: content/chapters/06-synthesis.md:3-29
    point: The three papers ask distinct questions about spatial tuning, noisy memory dynamics and downstream eye
      motion; the 2012–2022 link is direct while the 2025 connection is conceptual.
  - id: P02
    source_locus: content/chapters/06-synthesis.md:31-58
    point: A fixed tuning curve evaluated at a wandering represented position produces time-varying expected firing;
      to leading order shared covariance follows the product of local tuning slopes.
  - id: P03
    source_locus: content/chapters/06-synthesis.md:61-97
    point: Opposite tuning slopes turn a common displacement into opposite rate changes; private fluctuations broaden
      the population pattern.
  - id: P04
    source_locus: content/chapters/06-synthesis.md:101-117
    point: 'Each paper’s tests differ: spatial distributions, calibrated eye movement covariance, and a model information–diffusion
      inequality with conditions.'
  - id: P05
    source_locus: content/chapters/06-synthesis.md:119-133
    point: Related studies address perturbations, capacity, large environments, connections, learning, and perceptual
      use; none collapse the three questions into one.
  - id: P06
    source_locus: content/chapters/06-synthesis.md:135-145
    point: A joint study needs matched tuning maps, population fluctuations and appropriate diffusion and behavior
      filters; a static map alone does not determine diffusion.
  - id: P07
    source_locus: content/chapters/06-synthesis.md:31-58
    point: The common-position covariance formula assumes a small zero-mean displacement and fixed tuning slopes;
      other shared and private fluctuations are excluded.
  - id: P08
    source_locus: content/chapters/06-synthesis.yaml:44-67 (tbl:SYNTHESIS-MODELS)
    point: The 2012 random object is an increment of the represented coordinate, the 2022 model includes command,
      motor and measurement fluctuations, and the 2025 random object is a function of physical position.
