  teaching_points:
  - id: P01
    source_locus: content/chapters/04b-eye-timing.md:4-20
    point: Mean squared displacement measures average squared eye displacement as a function of lag; correction
      removes measurement-noise offset only for positive lags.
  - id: P02
    source_locus: content/chapters/04b-eye-timing.md:21-58
    point: Independent position error contributes twice its variance to positive-lag displacement variance but exactly
      cancels at zero lag.
  - id: P03
    source_locus: content/chapters/04b-eye-timing.md:58-85
    point: Noise subtraction corrects an average MSD, not each trace; uncertainty matters at short lags.
  - id: P04
    source_locus: content/chapters/04b-eye-timing.md:88-105
    point: Logarithmic MSD slope distinguishes linear diffusion from quadratic short-time displacement, with interpretation
      limited to measured lag range.
  - id: P05
    source_locus: content/chapters/04b-eye-timing.md:105-151
    point: A decaying linear filter driven by stationary white noise yields a bounded stationary output with an
      MSD approaching a plateau.
  - id: P06
    source_locus: content/chapters/04b-eye-timing.md:151-163
    point: Filter shape controls short-lag behavior; a simple one-pole filter is a guide model, not the complete
      eye plant.
  - id: P07
    source_locus: content/chapters/04b-eye-timing.md:163-227
    point: A diffusing position command followed by a low-pass eye plant produces correlated velocity and growing
      position MSD after filtering.
  - id: P08
    source_locus: content/chapters/04b-eye-timing.md:227-249
    point: The filtered-diffusion MSD changes from locally quadratic to long-lag linear; increasing the response
      time moves the crossover.
  - id: P09
    source_locus: content/chapters/04b-eye-timing.md:249-260
    point: Actual muscle response, motor filtering and visual feedback change details; continued growth supports
      a candidate mechanism, not a unique circuit.
  - id: P10
    source_locus: content/chapters/04b-eye-timing.md:134-163
    point: A one-exponential filter gives a short-lag MSD proportional to lag, while a smoother double-exponential
      response behaves differently at short lags; both stationary white-noise outputs plateau.
  - id: P11
    source_locus: content/chapters/04b-eye-timing.md:151-162
    point: The paper estimates that filtered private motor-neuron noise contributes roughly 1% of observed variance
      near 900 ms in its modeled population.
  - id: P12
    source_locus: content/chapters/04b-eye-timing.yaml:66-76 (fig:PAPER-EYE-ED2)
    point: The noise-subtraction procedure is checked in simulation; that check is not a new independent biological
      recording.
