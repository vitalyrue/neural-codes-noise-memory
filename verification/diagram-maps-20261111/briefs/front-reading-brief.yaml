  teaching_points:
  - id: P01
    source_locus: content/chapters/00-reading-guide.md:11 (sec:READING-FIELD)
    point: Neural signals are brief and variable yet populations support memory, gaze and navigation.
  - id: P02
    source_locus: content/chapters/00-reading-guide.md:17 (sec:READING-MEMORY)
    point: The 2012 paper begins with a continuous attractor and studies how spike variability makes memory wander.
  - id: P03
    source_locus: content/chapters/00-reading-guide.md:17 (sec:READING-MEMORY)
    point: Information in population spikes constrains diffusion in the specific model; maintaining activity is
      distinct from maintaining accuracy.
  - id: P04
    source_locus: content/chapters/00-reading-guide.md:29 (sec:READING-EYE)
    point: The 2022 study compares eye motion and motor neuron recordings during fixation in monkeys.
  - id: P05
    source_locus: content/chapters/00-reading-guide.md:29 (sec:READING-EYE)
    point: Shared signal analysis and timing support an upstream neural contribution but do not uniquely identify
      a circuit.
  - id: P06
    source_locus: content/chapters/00-reading-guide.md:45 (sec:READING-PLACE)
    point: The 2025 study uses thresholded smooth random spatial input to explain field counts and size statistics.
  - id: P07
    source_locus: content/chapters/00-reading-guide.md:45 (sec:READING-PLACE)
    point: Bats and rodents supply recordings across environments and dimensions; fitted features and further tests
      differ.
  - id: P08
    source_locus: content/chapters/00-reading-guide.md:71 (sec:READING-HARDWARE)
    point: Electronic circuits provide comparisons of persistent states and physical implementations, not proof
      of the neural mechanism.
  - id: P09
    source_locus: content/chapters/00-reading-guide.md:77 (sec:READING-SIMULATIONS)
    point: Simulations generate measurable predictions from assumptions, distinct from biological recordings.
  - id: P10
    source_locus: content/chapters/00-reading-guide.md:83 (sec:READING-START)
    point: Different reading paths have different prerequisites and goals; calculus, basic probability and linear
      algebra are assumed.
  - id: P11
    source_locus: content/chapters/00-reading-guide.md:121 (sec:READING-MECHANISM-MATH)
    point: A neural mechanism identifies physical interactions; a mathematical derivation calculates their consequences.
  - id: P12
    source_locus: content/chapters/00-reading-guide.md:121 (sec:READING-MECHANISM-MATH)
    point: Interpretation connects a result to what the assumptions allow and what is unresolved.
  - id: P13
    source_locus: content/chapters/00-reading-guide.md:121 (sec:READING-MECHANISM-MATH)
    point: The 2012 supplement develops the mathematical results in seven sections mapped to the guide.
  - id: P14
    source_locus: content/chapters/00-reading-guide.md:155 (sec:READING-SCOPE)
    point: Examples and reconstructions expand the reasoning but do not independently reproduce the original experiments.
  - id: P15
    source_locus: content/chapters/00-reading-guide.md:155 (sec:READING-SCOPE)
    point: Some printed intermediate equations have guide-identified discrepancies rather than author-confirmed
      corrections.
  - id: P16
    source_locus: content/chapters/00-reading-guide.md:182 (sec:READING-PAPERS)
    point: The guide links local article and supporting-information copies and published source records.
  - id: P17
    point: The evidence comparison distinguishes each physical system, interactions, derived predictions, simulation
      comparison, empirical comparison and unresolved questions.
