  chapter_source_sha256: c71b034938934e905aee6dd006729aed3e319c408cb67dd7e1ba565fc037bcb1
  teaching_points:
  - id: P01
    source_locus: content/chapters/02b-memory-long-delays.md:13 (sec:MEMORY-FIGURES)
    point: Noise moves the represented value while the activity pattern persists; storage error and current-state
      readout error differ.
  - id: P02
    source_locus: content/chapters/02b-memory-long-delays.md:13 (sec:MEMORY-FIGURES)
    point: Ring and two mutually inhibiting unit simulations agree with predictions without fitting a free diffusion
      coefficient.
  - id: P03
    source_locus: content/chapters/02b-memory-long-delays.md:13 (sec:MEMORY-FIGURES)
    point: The ring angle difference is wrapped, while the two-unit coordinate has a finite active range.
  - id: P04
    source_locus: content/chapters/02b-memory-long-delays.md:71 (sec:MEMORY-LONG-TIME)
    point: A Fokker Planck equation evolves the distribution across repeated trials from local state-dependent diffusion.
  - id: P05
    source_locus: content/chapters/02b-memory-long-delays.md:71 (sec:MEMORY-LONG-TIME)
    point: For constant D, an unbounded density broadens with variance 2Dt.
  - id: P06
    source_locus: content/chapters/02b-memory-long-delays.md:71 (sec:MEMORY-LONG-TIME)
    point: On a circle the wrapped distribution approaches uniform and bounded angular mean squared error saturates.
  - id: P07
    source_locus: content/chapters/02b-memory-long-delays.md:71 (sec:MEMORY-LONG-TIME)
    point: A spatially varying D can change later spreading, and its curvature appears in a short-time correction.
  - id: P08
    source_locus: content/chapters/02b-memory-long-delays.md:71 (sec:MEMORY-LONG-TIME)
    point: A mutually excitatory example has a guide-identified factor discrepancy between two printed supplementary
      expressions.
  - id: P09
    source_locus: content/chapters/02b-memory-long-delays.md:71 (sec:MEMORY-LONG-TIME)
    point: A state-dependent D can still give linear variance growth in the particular linear example.
  - id: P10
    source_locus: content/chapters/02b-memory-long-delays.md:201 (sec:MEMORY-DRIFT-SCOPE)
    point: Systematic mean drift and random spreading are different, and diffusion alone does not calculate drift.
  - id: P11
    source_locus: content/chapters/02b-memory-long-delays.md:201 (sec:MEMORY-DRIFT-SCOPE)
    point: Ito and Stratonovich conventions with state-dependent noise are different processes unless drift is transformed.
  - id: P12
    source_locus: content/chapters/02b-memory-long-delays.md:201 (sec:MEMORY-DRIFT-SCOPE)
    point: Conditionally independent new spikes can become correlated across time through recurrent dynamics; extra
      correlated noise requires a changed calculation.
