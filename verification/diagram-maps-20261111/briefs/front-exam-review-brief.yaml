communication_plan:
  keep_in_text:
  - Full derivations, detailed numerical examples and source qualifications.
  layout: Seven source-grounded scene groups are proposed. At 6.35 inches, 27 distinct points with necessary labels
    and qualifications may not be legible in a single map. Do not generate for acceptance until a readable one-image
    composition is established; ask the author before expanding size or changing scope.
  required_visible_conditions:
  - Differentiate observations, model predictions and guide constructions.
  segments:
  - id: A
    source_item_ids: &id001
    - P01
    - P02
    - P15
    - P16
    purpose: Three physically different setups each carry their own measured quantity. A shared notation key distinguishes
      remembered, decoded, temporal and spatial variables.
  - id: B
    source_item_ids: &id002
    - P03
    - P04
    - P17
    - P18
    - P19
    purpose: Noisy spikes shift the neural activity pattern along the memory family; reciprocal weights are a special
      case. A two-coordinate sketch represents correlated movement, while parameter comparisons explicitly state
      what is held fixed.
  - id: C
    source_item_ids: &id003
    - P05
    - P06
    - P07
    - P20
    purpose: Tuning and count noise set local information. Within the specified model, information and synaptic
      decay constrain diffusion; a timeline then separates storage from readout. A distinct branch marks that changed
      rate dynamics or noise laws modify the comparison.
  - id: D
    source_item_ids: &id004
    - P08
    - P09
    - P10
    - P11
    - P21
    - P22
    purpose: The 2022 observation combines shared and private changes. Separate traces distinguish a filtered accumulating
      command from filtered private white noise; measurement error and assumptions affect the comparison.
  - id: E
    source_item_ids: &id005
    - P12
    - P14
    - P23
    - P24
    purpose: Random weighted inputs can generate a smooth spatial map. Thresholding yields active fields and gaps;
      parameter-fitting summaries are separated from additional comparisons. Sparse high-threshold fields admit
      an approximate count or gap law.
  - id: F
    source_item_ids: &id006
    - P13
    - P25
    purpose: The same high-peak approximation relates height above threshold to firing and to different dimension-dependent
      size laws and moments.
  - id: G
    source_item_ids: &id007
    - P26
    - P27
    purpose: Slices, boundary slopes and topology test distinct aspects of the spatial map. For a large domain and
      high threshold, field count can approach an Euler-characteristic prediction, while the exact signed topology
      has wider applicability.
