  teaching_points:
  - id: P01
    source_locus: content/chapters/00-exam-review.md:13 (sec:EXAM-MAP)
    point: The three papers study noisy memory dynamics, eye drift, and spatial field statistics in different settings.
  - id: P02
    source_locus: content/chapters/00-exam-review.md:13 (sec:EXAM-MAP)
    point: The guide maps each paper to its physical quantity, evidence and central theoretical question.
  - id: P03
    source_locus: content/chapters/00-exam-review.md:43 (sec:EXAM-MEMORY)
    point: Recurrent weighted spikes sustain synaptic activity while projected random fluctuations displace a continuous
      stored value.
  - id: P04
    source_locus: content/chapters/00-exam-review.md:43 (sec:EXAM-MEMORY)
    point: The diffusion coefficient specifies local variance growth in the relevant regime, not necessarily systematic
      drift.
  - id: P05
    source_locus: content/chapters/00-exam-review.md:43 (sec:EXAM-MEMORY)
    point: Tuning slopes and spike variability determine internal Fisher information under the Poisson model.
  - id: P06
    source_locus: content/chapters/00-exam-review.md:43 (sec:EXAM-MEMORY)
    point: Information bounds diffusion under model assumptions; ideal and equal-weight readouts behave differently
      when the state moves.
  - id: P07
    source_locus: content/chapters/00-exam-review.md:43 (sec:EXAM-MEMORY)
    point: A memory result, its derivation and the supporting paper locations answer distinct exam questions.
  - id: P08
    source_locus: content/chapters/00-exam-review.md:92 (sec:EXAM-EYE)
    point: A shared neural command contributes to measured eye movement and a prediction from recorded motor spikes.
  - id: P09
    source_locus: content/chapters/00-exam-review.md:92 (sec:EXAM-EYE)
    point: Covariance, gains and private noise govern how the shared variance is estimated.
  - id: P10
    source_locus: content/chapters/00-exam-review.md:92 (sec:EXAM-EYE)
    point: Time-lag displacement curves distinguish filtered private noise from a diffusive neural contribution
      under model assumptions.
  - id: P11
    source_locus: content/chapters/00-exam-review.md:92 (sec:EXAM-EYE)
    point: Agreement with a simulated eye circuit does not uniquely identify its anatomical source.
  - id: P12
    source_locus: content/chapters/00-exam-review.md:138 (sec:EXAM-PLACE)
    point: A smooth correlated spatial input threshold generates fields and gaps, whose crossings constrain threshold
      and scale.
  - id: P13
    source_locus: content/chapters/00-exam-review.md:138 (sec:EXAM-PLACE)
    point: High peaks produce dimension-dependent size laws; topology and slice comparisons test other properties.
  - id: P14
    source_locus: content/chapters/00-exam-review.md:138 (sec:EXAM-PLACE)
    point: Fitted summaries and further model comparisons play different roles; the reported comparisons use available
      data, and observed rate maps do not directly identify wiring.
  - id: P15
    source_locus: content/chapters/00-exam-review.md:188 (sec:EXAM-DISTINCTIONS)
    point: Stored versus decoded values, temporal versus spatial variation and variance versus mean displacement
      must be kept separate.
  - id: P16
    source_locus: content/chapters/00-exam-review.md:188 (sec:EXAM-DISTINCTIONS)
    point: Common symbols and paper-specific notation must be read with their local definitions and assumptions.
  - id: P17
    point: Symmetric connections permit a diffusion expression in tuning and input slopes under the same model assumptions.
    source_locus: content/chapters/00-exam-review.yaml:218 (formula table)
  - id: P18
    point: For multiple stored coordinates, both diffusion and Fisher information are matrices with directional
      relationships.
    source_locus: content/chapters/00-exam-review.yaml:235 (formula table)
  - id: P19
    point: Changes in neuron count, firing rates or tuning width affect diffusion and information only with stated
      fixed quantities and dimensional assumptions.
    source_locus: content/chapters/00-exam-review.yaml:289 (formula table)
  - id: P20
    point: A separate rate response time or a different noise law modifies the information–diffusion comparison
      and equality condition.
    source_locus: content/chapters/00-exam-review.yaml:394 (formula table)
  - id: P21
    point: The independent motor-noise model limits the aggregate correlation with eye motion, and measurement error
      adds a short-lag offset.
    source_locus: content/chapters/00-exam-review.yaml:546 (formula table)
  - id: P22
    point: The eye-model spike variability and position sensitivity set a model-dependent noise scale; absolute
      and fractional slopes require care.
    source_locus: content/chapters/00-exam-review.yaml:581 (formula table)
  - id: P23
    point: A weighted sum of spatial input profiles gives covariance through overlap; a Gaussian description needs
      its stated assumptions.
    source_locus: content/chapters/00-exam-review.yaml:705 (formula table)
  - id: P24
    point: The rare-field regime supplies approximate count and gap laws, rather than exact finite-threshold predictions.
    source_locus: content/chapters/00-exam-review.yaml:726 (formula table)
  - id: P25
    point: High-peak geometry links field size to peak firing, size moments and spatial dimension only in the stated
      approximation.
    source_locus: content/chapters/00-exam-review.yaml:748 (formula table)
  - id: P26
    point: Slices test the same spatial covariance in lower-dimensional cuts, while boundary slopes and topology
      measure separate geometric properties.
    source_locus: content/chapters/00-exam-review.yaml:782 (formula table)
  - id: P27
    point: At high threshold, a large-domain estimate of field count is distinct from the exact Euler-characteristic
      expression.
    source_locus: content/chapters/00-exam-review.yaml:844 (formula table)
