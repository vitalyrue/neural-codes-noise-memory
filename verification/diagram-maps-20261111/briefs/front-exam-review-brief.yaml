    physical settings.; A recurrent population bump wanders; tuning and spike noise set information and a conditional
    diffusion bound, followed by two readout curves.; Shared and private signals connect neural prediction to eye
    output; lag curves and a model comparison distinguish evidence from circuit identity.; Thresholded spatial input
    creates fields and gaps; peak geometry and holes supply tests, with fitted data separated from additional comparisons
    and temporal motion.
