  role_reason: Distinct physical states and changes reveal mechanisms beyond labels.
  scenes:
  - source_item_ids: *id001
    visible_objects:
    - recurrent neural population and represented angle
    - monkey eye with recording electrode
    - rodent or bat spatial trajectory and rate map
    - separate time and position axes
    depicted_relationship_or_change: Three physically different setups each carry their own measured quantity. A
      shared notation key distinguishes remembered, decoded, temporal and spatial variables.
    teaching_contribution_beyond_labels: The separate axes show why memory wandering, measured eye motion and spatial
      field variation answer different questions.
  - source_item_ids: *id002
    visible_objects:
    - recurrent weighted neurons
    - activity bumps at two times
    - one local perturbation with restoring flow
    - paired reciprocal connections
    - one- and two-coordinate spreading sketches
    depicted_relationship_or_change: Noisy spikes shift the neural activity pattern along the memory family; reciprocal
      weights are a special case. A two-coordinate sketch represents correlated movement, while parameter comparisons
      explicitly state what is held fixed.
    teaching_contribution_beyond_labels: Different arrows distinguish a transient shape change from the lasting
      movement. A two-dimensional spread is not a second independent network.
  - source_item_ids: *id003
    visible_objects:
    - nearby firing-rate curves and noisy spike counts
    - information and diffusion relation marked model-specific
    - storage and recall timeline
    - ideal versus equal-weight error curves
    - different time-scale and noise icons
    depicted_relationship_or_change: Tuning and count noise set local information. Within the specified model, information
      and synaptic decay constrain diffusion; a timeline then separates storage from readout. A distinct branch
      marks that changed rate dynamics or noise laws modify the comparison.
    teaching_contribution_beyond_labels: Overlapping count distributions make distinguishability visible and the
      two error curves show different outcomes during readout.
  - source_item_ids: *id004
    visible_objects:
    - shared command branching into recorded neuronal prediction and eye motion
    - separate private noise inputs
    - eye plant filter
    - positive-lag displacement plots with measurement offset
    - independent-versus-common fluctuation sketch
    depicted_relationship_or_change: The 2022 observation combines shared and private changes. Separate traces distinguish
      a filtered accumulating command from filtered private white noise; measurement error and assumptions affect
      the comparison.
    teaching_contribution_beyond_labels: Common versus private sources and the filter explain what covariance and
      lag curves can support without claiming the anatomical source is uniquely identified.
  - source_item_ids: *id005
    visible_objects:
    - several spatial input tuning profiles with weights
    - summed smooth input and threshold
    - fields and gaps on a track
    - fitted statistics and further-data comparison
    depicted_relationship_or_change: Random weighted inputs can generate a smooth spatial map. Thresholding yields
      active fields and gaps; parameter-fitting summaries are separated from additional comparisons. Sparse high-threshold
      fields admit an approximate count or gap law.
    teaching_contribution_beyond_labels: The sum, threshold crossings and track segments show how a spatial statistic
      arises without pretending the fitted comparison is held out.
  - source_item_ids: *id006
    visible_objects:
    - high peak cut by a horizontal threshold
    - 1D length, 2D area and 3D volume shapes
    - peak excess and firing-rate height
    depicted_relationship_or_change: The same high-peak approximation relates height above threshold to firing and
      to different dimension-dependent size laws and moments.
    teaching_contribution_beyond_labels: Cross-sections depict why the dimension changes the size mapping; the approximation
      label protects finite-threshold cases.
  - source_item_ids: *id007
    visible_objects:
    - slice through a spatial map
    - boundary crossing with slope
    - active components with and without holes
    - large-domain high-threshold field count and exact Euler characteristic marked separately
    depicted_relationship_or_change: Slices, boundary slopes and topology test distinct aspects of the spatial map.
      For a large domain and high threshold, field count can approach an Euler-characteristic prediction, while
      the exact signed topology has wider applicability.
    teaching_contribution_beyond_labels: A ring and disjoint regions make holes and components visible; the separate
      slice and crossing illustrate information not contained in size alone.
