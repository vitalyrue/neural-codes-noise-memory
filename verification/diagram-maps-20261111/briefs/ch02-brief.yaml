  chapter_source_sha256: 70ce935bf041ed9b6267dc3be850f94ee2448d9aa806b04bfb1c5aae09f94404
  teaching_points:
  - id: P01
    source_locus: content/chapters/01b-persistence.md:7 (sec:FOUNDATIONS-ATTRACTOR)
    point: A continuous family of steady patterns represents different values; stable return to the family does
      not preserve the original value.
  - id: P02
    source_locus: content/chapters/01b-persistence.md:7 (sec:FOUNDATIONS-ATTRACTOR)
    point: The steady activation equals the product of synaptic time constant and steady firing rate, maintained
      by feedback.
  - id: P03
    source_locus: content/chapters/01b-persistence.md:7 (sec:FOUNDATIONS-ATTRACTOR)
    point: A perpendicular disturbance relaxes whereas a neutral-direction displacement changes the remembered value.
  - id: P04
    source_locus: content/chapters/01b-persistence.md:7 (sec:FOUNDATIONS-ATTRACTOR)
    point: A two-neuron activity example distinguishes common and differential disturbances and reads an angle from
      activity.
  - id: P05
    source_locus: content/chapters/01b-persistence.md:91 (sec:PERSISTENCE-EYE-MECHANICS)
    point: Opposing eye muscle torques and tonic neuronal firing can balance elastic restoring forces.
  - id: P06
    source_locus: content/chapters/01b-persistence.md:91 (sec:PERSISTENCE-EYE-MECHANICS)
    point: Viscous damping resists movement, while inertia does not hold a stationary eye against an unbalanced
      restoring force.
  - id: P07
    source_locus: content/chapters/01b-persistence.md:131 (sec:FOUNDATIONS-DIFFUSION)
    point: Independent random increments have variances that add, yielding variance proportional to elapsed time.
  - id: P08
    source_locus: content/chapters/01b-persistence.md:131 (sec:FOUNDATIONS-DIFFUSION)
    point: Diffusion coefficient sets displacement variance growth, with Var displacement equal to 2Dt under constant
      diffusion.
  - id: P09
    source_locus: content/chapters/01b-persistence.md:131 (sec:FOUNDATIONS-DIFFUSION)
    point: Systematic mean movement contributes separately to mean squared displacement.
  - id: P10
    source_locus: content/chapters/01b-persistence.md:131 (sec:FOUNDATIONS-DIFFUSION)
    point: Correlated steps and finite boundaries can invalidate simple linear variance growth.
  - id: P11
    source_locus: content/chapters/01b-persistence.md:238 (sec:FOUNDATIONS-RANDOMNESS)
    point: Temporal variation of stored position and eye motion differs from a spatial random function fixed for
      a cell and environment.
  - id: P12
    source_locus: content/chapters/01b-persistence.md:238 (sec:FOUNDATIONS-RANDOMNESS)
    point: Repeated visits sample the same fixed expected spatial map while actual spikes can vary.
