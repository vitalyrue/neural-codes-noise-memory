  chapter_source_sha256: 722b56a7778e0fb42e795282726113e6ec5690eca29eb71d52addc8730b5ded6
  teaching_points:
  - id: P01
    source_locus: content/chapters/03b-memory-readout.md:26 (sec:MEMORY-READOUT-SETUP)
    point: The represented memory diffuses during storage and continues moving while spikes are observed after the
      recall cue.
  - id: P02
    source_locus: content/chapters/03b-memory-readout.md:26 (sec:MEMORY-READOUT-SETUP)
    point: In the local Gaussian model total original-cue variance separates storage variance 2DT from readout variance
      under explicit independence conditions.
  - id: P03
    source_locus: content/chapters/03b-memory-readout.md:26 (sec:MEMORY-READOUT-SETUP)
    point: Short spike samples are approximated as noisy observations of current state in an informative weak-noise
      regime.
  - id: P04
    source_locus: content/chapters/03b-memory-readout.md:87 (sec:MEMORY-IDEAL)
    point: Ideal inference accounts for motion between later observations and estimates the state at the recall
      cue.
  - id: P05
    source_locus: content/chapters/03b-memory-readout.md:87 (sec:MEMORY-IDEAL)
    point: Ideal variance declines with observation duration toward a finite limit; characteristic time is at most
      tau under full-access model assumptions.
  - id: P06
    source_locus: content/chapters/03b-memory-readout.md:87 (sec:MEMORY-IDEAL)
    point: The characteristic time describes an approach to saturation, not an abrupt end to useful observation.
  - id: P07
    source_locus: content/chapters/03b-memory-readout.md:207 (sec:MEMORY-NAIVE)
    point: Equal-weight averaging reduces observation noise at first but eventually incorporates too much later
      state diffusion.
  - id: P08
    source_locus: content/chapters/03b-memory-readout.md:207 (sec:MEMORY-NAIVE)
    point: The naive observer has a finite optimal duration and its best variance exceeds the ideal asymptotic variance.
  - id: P09
    source_locus: content/chapters/03b-memory-readout.md:277 (sec:MEMORY-PARTIAL)
    point: A downstream observer with a fraction of information receives less data while the full network diffusion
      remains.
  - id: P10
    source_locus: content/chapters/03b-memory-readout.md:277 (sec:MEMORY-PARTIAL)
    point: Reducing accessible information increases characteristic time and limiting readout variance in the specified
      model.
  - id: P11
    source_locus: content/chapters/03b-memory-readout.md:312 (sec:MEMORY-FIG3-AND-CAUTION)
    point: Dimensionless ideal and equal-weight readout curves have distinct saturation versus rise at long observation.
  - id: P12
    source_locus: content/chapters/03b-memory-readout.md:350 (sec:MEMORY-MINIMUM-VARIANCE)
    point: The guide flags an apparent inconsistency in the printed total-error bound and distinguishes its check
      from author correction.
  - id: P13
    source_locus: content/chapters/03b-memory-readout.md:350 (sec:MEMORY-MINIMUM-VARIANCE)
    point: Diffusion reduces the accuracy of a continuously accumulated signal without by itself producing a restoring
      leak.
