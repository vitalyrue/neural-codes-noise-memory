  chapter_source_sha256: 534c3ed63a03bdda5421d92c854b8eb7d3d9482ef4ac4d107a4243e477c36cf0
  teaching_points:
    - {id: P01, source_locus: 'lines 1-35', point: 'A persistent attractor pattern can retain a continuous value but noise causes wandering; the information bound applies under specified model assumptions.'}
    - {id: P02, source_locus: 'lines 39-49', point: 'Ocular motoneurons activate opposing eye muscles; relative torque sets horizontal orientation.'}
    - {id: P03, source_locus: 'lines 51-53', point: 'A brief pulse moves the eye while sustained tonic drive maintains tension; individual spikes need not be periodic.'}
    - {id: P04, source_locus: 'lines 54-61', point: 'Elastic force tends to restore eye position; viscosity damps motion and inertia does not supply stationary holding torque.'}
    - {id: P05, source_locus: 'lines 63-73', point: 'In recurrent circuitry incoming activation controls later spikes, which renew decaying synaptic activation.'}
    - {id: P06, source_locus: 'lines 75-107', point: 'Each spike adds to a synaptic activation that decays with time constant tau, giving a trace distinct from the spike train.'}
    - {id: P07, source_locus: 'lines 109-132', point: 'Weights W_ij combine neuron j activations into the input of neuron i, including excitatory or inhibitory effects.'}
    - {id: P08, source_locus: 'lines 116-136', point: 'A transfer function converts input into nonnegative firing rate; firing rate does not prescribe exact spike times.'}
    - {id: P09, source_locus: 'lines 138-150', point: 'Tuning curves and the pattern across neuron identities encode a value; observed spikes can be decoded.'}
    - {id: P10, source_locus: 'lines 140-150', point: 'A tuning slope is local rate change per change in represented angle and linear tuning cannot give negative rates.'}
    - {id: P11, source_locus: 'lines 154-155', point: 'A hippocampal place cell can have multiple fields; rate maps estimate activity by dividing spike counts by occupancy.'}
    - {id: P12, source_locus: 'lines 158-163', point: 'CA3, CA1 and entorhinal grid cells have distinct connectivity and spatial patterns; place fields are not grid fields.'}
    - {id: P13, source_locus: 'lines 165-186', point: 'At a fixed rate Poisson spike counts vary across windows, with expected count and variance both lambda.'}
    - {id: P14, source_locus: 'lines 179-230', point: 'The Poisson count law follows from the limit of independent short time bins, including a nonzero probability of silence.'}
    - {id: P15, source_locus: 'lines 263-287', point: 'Independent population averaging reduces relative count variability while shared changes need not average away.'}
    - {id: P16, source_locus: 'lines 291-302', point: 'Poisson spike draws are conditionally independent at the current state; recurrent feedback can correlate complete spike trains, and CV and Fano factor are different measures.'}
    - {id: P17, source_locus: 'lines 304-322', point: 'A simulated ring of interacting neurons has a persistent activity bump whose location represents an angle and can wander due to spikes.'}
    - {id: P18, source_locus: 'lines 324-334', point: 'The simulation updates rates and draws conditional spikes, then adds spikes and decays activation using a small step.'}
    - {id: P19, source_locus: 'lines 336-348', point: 'Mean squared displacement compares simulated spreading with parameter-free theory in ring and two-unit models, not recorded animal error.'}
    - {id: P20, source_locus: 'lines 352-375', point: 'The 2022 eye study relates measured eye displacement to a prediction from one recorded neuron, with shared drive and private variability.'}
    - {id: P21, source_locus: 'lines 369-400', point: 'Covariance measures cofluctuation; private variance can lower correlation without weakening shared input, and gain changes measured covariance.'}
    - {id: P22, source_locus: 'lines 402-428', point: 'Mean squared displacement contains random variance plus squared mean displacement, separating wandering from directional bias.'}
    - {id: P23, source_locus: 'lines 428-442', point: 'Circuit noise, command gain, muscle filtering and measurement noise have different effects on eye-displacement statistics.'}
  planned_point_ids: [P01, P02, P03, P04, P05, P06, P07, P08, P09, P11, P12, P13, P15, P16, P17, P18, P19, P20, P21, P22, P23]
