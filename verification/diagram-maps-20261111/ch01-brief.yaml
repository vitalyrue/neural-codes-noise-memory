  composition: >-
    A motor scene and a recurrent neural loop are related by a labeled conceptual output, but do not imply that the 2012 paper simulates muscles. Separate scenes show neuron tuning and hippocampal maps, spike variability and averaging, simulation comparison, and a measured-versus-predicted eye signal with shared and private contributions. Connect only steps within an explicitly modeled mechanism.
  scenes:
    - source_item_ids: [P02, P03, P04]
      visible_objects: ['eye cross section', 'opposing muscle pulls', 'brief pulse and sustained step traces', 'spring and damper symbols']
      depicted_relationship_or_change: 'Sustained neural drive maintains muscle tension against restoring force; damping opposes motion.'
      teaching_contribution_beyond_labels: 'Different trace durations and arrows distinguish movement command, sustained drive, and counteracting muscle torque.'
    - source_item_ids: [P05, P06, P07, P08]
      visible_objects: ['three connected neurons', 'one event train', 'decaying activation trace', 'weighted connection arrows', 'input-to-rate curve']
      depicted_relationship_or_change: 'Spikes renew activation, weighted activations change input, transfer function changes subsequent rate, and spikes feed back.'
