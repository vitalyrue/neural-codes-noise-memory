    - source_item_ids: [P09, P10, P11, P12]
      visible_objects: ['two angle-dependent tuning curves', 'activity bars for two angles', 'separate spatial place-field map', 'grid-like map']
      depicted_relationship_or_change: 'Different angles correspond to distinct population-rate patterns; place and grid firing patterns are separate spatial examples.'
      teaching_contribution_beyond_labels: 'Changing bars encode a value; irregular place fields differ visually from regular grid fields.'
    - source_item_ids: [P13, P14, P15, P16]
      visible_objects: ['equal observation windows with different spike counts', 'one-cell and pooled-cell counts', 'independent and shared fluctuation marks']
      depicted_relationship_or_change: 'For fixed rate, spike counts vary; averaging independent counts reduces relative variation, while a shared fluctuation survives.'
      teaching_contribution_beyond_labels: 'Repeated windows and pooled counts make the noise comparison visible without implying complete recurrent spike-train independence.'
    - source_item_ids: [P01, P17, P18, P19]
      visible_objects: ['activity bump at two nearby angles', 'short-time rising MSD curve and theory line', 'separate miniature two-unit network', 'simulation output and theory markers']
      depicted_relationship_or_change: 'Noise shifts the represented value while the activity pattern persists; simulations in two network designs compare with model predictions.'
      teaching_contribution_beyond_labels: 'Motion of a bump differs from loss of activity, and plotted simulation points are compared with theory, not recorded animal data.'
    - source_item_ids: [P20, P21, P22, P23]
      visible_objects: ['shared input branching toward eye and neuron prediction', 'separate private-noise marks', 'eye displacement trace', 'random-spread and directed-bias displacement sketches']
      depicted_relationship_or_change: 'A shared command contributes to both observations; private noise reduces their correlation, and displacement contains both spread and mean motion.'
      teaching_contribution_beyond_labels: 'Shared and separate paths show correlation is a measurement relationship; distinct displacement sketches distinguish random motion from directional bias.'
