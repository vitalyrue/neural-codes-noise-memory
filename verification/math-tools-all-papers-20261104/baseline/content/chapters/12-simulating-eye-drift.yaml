section_list:
- id: sec:SIMULATING-EYE-DATA
  title: Recorded data constrain the question before the model generates a trajectory
  summary: The empirical analysis uses earlier recordings of 57 ocular motor neurons from two macaques,
    paired with eye-position measurements. These are separate single-cell recordings, not a simultaneous
    recording of all 57 neurons. The authors fit each cell's firing-rate relation to eye position, velocity,
    and acceleration. For firing-rate prediction, they fit all trials except one and predict the firing
    rate in the omitted trial, repeating this leave-one-out procedure across trials. The analysis also
    uses the fitted movement relation to reconstruct motion from that cell's spikes.[^simeye-data]
  level: 2
- id: sec:SIMULATING-EYE-PATH
  title: The generated command acts through spikes, muscle response, and delayed feedback
  summary: 'The model has four connected stages. Each stage changes a different physical or represented
    quantity:'
  level: 2
- id: sec:SIMULATING-EYE-CONTROLS
  title: Controls test which stage can explain the observed fluctuations
  summary: 'One matching trajectory is weak evidence because many mechanisms can look irregular. The paper
    compares outputs after changing sources of variability or feedback:'
  level: 2
- id: sec:SIMULATING-EYE-TOOLS
  title: Public MATLAB code and recordings support different reproduction tasks
  summary: The authors release MATLAB `.m` functions and `.mat` parameter files. `Run_model.m` starts
    trajectories and their mean-squared-displacement analysis. `Full_model_simulation.m` updates the integrator,
    motor neurons, and eye. `Fit_OI_circuit.m` fits a persistent mean-rate circuit, while the analysis
    routines compare generated trajectories with an already processed empirical MSD file.[^simeye-code]
  level: 2
