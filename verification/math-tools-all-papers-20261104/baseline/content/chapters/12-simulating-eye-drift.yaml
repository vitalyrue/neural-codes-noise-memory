chapter_id: ch:SIMULATING-EYE
part_id: part:SIMULATIONS
title: Eye simulations connect a noisy neural command to measured motion
purpose: A reproduction of Ben-Shushan et al. (2022) must distinguish the recording analysis from the
  simulated eye-control pathway. The circuit chapter explains why a noisy internal command is a possible
  source of drift. Here the added detail is how the published parameters, spike generator, update intervals,
  saved samples, and MATLAB files determine the numerical experiment, and which code or data gaps limit
  reproduction. The pathway below gives the mechanism needed to interpret those choices.
