section_list:
- id: sec:MATH-TOOLS-WEIGHTS
  title: Connection weights determine how neurons sustain activity
  summary: A single neural signal is brief, so retaining a value requires something to carry its effect forward.
    [A [**spike**]{.definition-term custom-style="Definition Term"} is a brief electrical event emitted by a neuron.]{.definition-explanation}
    [Its [**firing rate**]{.definition-term custom-style="Definition Term"} is the expected number of spikes per
    unit time.]{.definition-explanation} A rate gives an expectation; it does not specify an evenly spaced sequence
    of spikes.
  level: 2
- id: sec:MATH-TOOLS-FISHER
  title: Fisher information measures how clearly spikes distinguish nearby values
  summary: Suppose a circuit currently represents an angle near $30^\circ$. A receiving cell sees spikes rather
    than an angle label. If $30^\circ$ and $31^\circ$ produce almost identical probabilities of spike patterns,
    a short observation gives little evidence about which value is represented. If their spike probabilities differ
    strongly, the distinction is easier.
  level: 2
- id: sec:MATH-TOOLS-BOUND
  title: Information limits how slowly a neural memory can spread
  summary: The same uncertain spikes that tell a receiving cell about the value also renew activity inside the memory
    circuit. Synaptic effects fade, so the network must carry the value forward through those new events. This links
    the precision of the signals to the persistence of the memory.
  level: 2
