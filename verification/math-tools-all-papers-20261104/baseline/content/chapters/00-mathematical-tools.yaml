chapter_id: ch:MATHEMATICAL-TOOLS
part_id: part:MECHANISMS
title: Mathematical tools connect neural interactions to memory accuracy
purpose: Before Part I, explain how fixed neural connections sustain activity and how Fisher information in variable
  spikes constrains memory precision. Separate the roles of W, changing activation, represented value, information
  rate and diffusion.
