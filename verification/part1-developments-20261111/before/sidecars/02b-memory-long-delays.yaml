chapter_id: ch:MEMORY-LONG-DELAYS
part_id: part:MECHANISMS
title: Boundaries and drift change memory error over long delays
purpose: Follow the paper’s diffusion section through Figures 1 and 2, then use the supporting text to explain
  how boundaries, angular wraparound, state-dependent diffusion, and systematic drift affect longer delays.
