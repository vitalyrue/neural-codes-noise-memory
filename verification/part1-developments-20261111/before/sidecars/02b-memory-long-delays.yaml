section_list:
- id: sec:MEMORY-FIGURES
  title: Figures distinguish memory motion from readout error and test diffusion
  summary: '**Neural mechanism in the figures.** [Figure 1A, p. 2](../papers/burak-fiete-2012-persistent-activity.pdf#page=2&zoom=125,0,439)
    shows the definition of the memory coordinate. Start at a green point off the attractor and follow the noise
    free flow to the black point on it. This endpoint defines the instantaneous attractor state. After one noisy
    interval, repeat that flow. The difference between the two endpoints is the retained memory change. The relevant
    projection follows the flow, as in the [tilted two variable example](ch-memory-dynamics.html#sec-memory-linearization).'
  level: 2
- id: sec:MEMORY-LONG-TIME
  title: Long delay errors depend on boundaries and local diffusion
  summary: '**Neural mechanism.** Spike fluctuations keep shifting the stored value after the cue has ended. The
    local diffusion coefficient describes the variance of those shifts after stable disturbances have relaxed. It
    does not by itself say that variance grows at the same rate forever: boundaries and variation of $D$ can change
    the long time behavior. The derivation first permits $D$ to vary with the memory state; the line and circle
    examples then keep $D$ constant to compare different boundaries.'
  level: 2
- id: sec:MEMORY-DRIFT-SCOPE
  title: A diffusion calculation does not determine systematic drift
  summary: '**Neural mechanism.** Repeated trials can spread apart even if their average stays at the original value.
    That random spreading differs from a reproducible movement in one direction. Both can occur, and the derivation
    of $D$ alone does not settle the second question.'
  level: 2
blocks:
- id: fig:MEMORY-LINE-RING
  kind: figure
  placement: sec:MEMORY-LONG-TIME
  asset: assets/approved/visuals/memory-line-ring.png
  caption: "With the same constant D = 0.5 rad²/s, wrapped Gaussian error densities widen toward 1/(2π). The unbounded line has mean squared error 2Dt. Reporting angular error in $[-\\pi,\\pi)$ instead gives a mean squared error that approaches π²/3. The flattening comes from the bounded error convention while local diffusion stays constant. All curves are analytic teaching calculations, not paper simulation data."
  alt: Wrapped Gaussian densities at 0.2, 1 and 5 seconds broaden toward a dashed uniform density over angular errors
    from minus pi to pi. Below, line mean squared error rises linearly while wrapped angular mean squared error
    approaches a horizontal pi squared over three reference, with the same constant diffusion coefficient.
  width_inches: 7.29167
  html_fold: never
- id: fig:PAPER-MEMORY-1
  kind: figure
  placement: sec:MEMORY-FIGURES
  asset: assets/approved/visuals/paper-excerpts/memory-fig-1.png
  caption: "Noise-free return flow defines the memory coordinate. The second panel separates movement of that coordinate from uncertainty when reading it. Original Figure 1 from Burak and Fiete (2012), reproduced as an exact artwork excerpt. [PDF page 2](../papers/burak-fiete-2012-persistent-activity.pdf#page=2). [Open image at full size](../assets/fig-paper-memory-1.png)."
  alt: Panel A shows perturbed states returning along arrows to an attractor. Panel B shows a population activity
    bump, a changed angular position and the uncertainty in estimating its current position.
  width_inches: 3.6
  html_fold: never
- id: fig:PAPER-MEMORY-2
  kind: figure
  placement: sec:MEMORY-FIGURES
  asset: assets/approved/visuals/paper-excerpts/memory-fig-2.png
  caption: "The ring and mutual-inhibition simulations compare measured displacement statistics with the predicted diffusion. Original Figure 2 from Burak and Fiete (2012), reproduced as an exact artwork excerpt. [PDF page 3](../papers/burak-fiete-2012-persistent-activity.pdf#page=3). [Open image at full size](../assets/fig-paper-memory-2.png)."
  alt: Seven panels show a ring circuit, rate profiles and spikes, a wandering angle, displacement variance curves,
