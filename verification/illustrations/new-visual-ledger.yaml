  caption_and_alt: content/chapters/02-memory-dynamics.yaml
  teaching_introduction: The exact trajectory in this example shows why the lasting
    displacement follows the flow rather than a perpendicular projection.
  caption: Original guide construction of the tilted decay example, with dimensionless
    coordinates and $a/\lambda=1/2$. After an imposed jump from $(0,0)$ to $(0,2)$,
    the state relaxes toward $(1,0)$; successive time marks crowd toward that endpoint.
    This illustrates the left and right zero vector construction in Burak and Fiete
    (2012), Supporting Text, Section II, pp. 3–4, Eqs. S10–S16; it is not a paper
    network simulation.
  interpretation: As y decays, x changes by one; the left vector extracts that lasting
    shift.
  accessibility_description: A line of fixed points lies at y equals zero. An imposed
    vertical jump from zero zero to zero two is followed by a straight tilted flow
    toward one zero. Equal time marks crowd toward the endpoint. Perpendicular projection
    would return to zero zero and miss the lasting shift of one. The tangent is one
    zero; the left vector measures delta x plus one half delta y.
  toc_correspondence: sec:MEMORY-LINEARIZATION
  provenance: Guide-created from the cited explanation and analytic model.
