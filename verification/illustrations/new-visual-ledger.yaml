  caption: As the threshold rises on one constructed smooth map, components and holes
    change separately, giving Euler characteristics -1, 0, 4, and 3. The above-threshold
    regions shrink as the threshold rises, even though this signed count does not
    change in one direction. This guide example is not an observed place-field map
    or a Gaussian-process sample; it illustrates Mainali et al. (2025), Figure 3F–H
    and STAR Methods Equations 8–10.
  interpretation: A negative chi means that holes outnumber components in this 2D
    example. It does not mean a negative number of fields. When holes are absent,
    chi equals the component count.
  accessibility_description: Four thresholds of the same smooth two-dimensional map
    show one component with two holes and chi minus one; one component with one hole
    and chi zero; four components with no holes and chi four; and three components
    with no holes and chi three. Each active set is contained in the preceding one
    as q increases from 0.3 to 0.5, 0.8 and 1.0.
