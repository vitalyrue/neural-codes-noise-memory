chapter_id: ch:READING-GUIDE
part_id: part:MECHANISMS
title: Reading path and paper copies
purpose: Neural circuits must represent quantities such as location and eye position
  while individual spikes fluctuate. This guide develops the mathematics and experimental
  reasoning behind three papers on that problem. Its aim is to make the central calculations
  reconstructible, including the assumptions that make each step valid.
