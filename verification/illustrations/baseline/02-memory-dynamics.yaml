section_list:
- id: sec:MEMORY-SPIKES
  title: From individual spikes to a slowly changing network state
  summary: How can brief spikes maintain a state for much longer than the duration
    of a spike? In this model, each spike leaves a synaptic activation that decays
    gradually. Incoming activations determine new firing rates; the resulting spikes
    renew those activations. This feedback can support activity after the external
    stimulus has ended.
  level: 2
- id: sec:MEMORY-LINEARIZATION
  title: Which part of a perturbation survives?
  summary: 'A spike perturbs many aspects of a network''s state. Most of those changes
    decay as the state returns to the attractor. To calculate memory loss, we need
    the one change that survives: the displacement to a different fixed point.'
  level: 2
