section_list:
- id: sec:FOUNDATIONS-SPIKES
  title: Spikes, rates, and population patterns
  summary: A neuron communicates through brief electrical events called [**spike**]{.definition-term
    custom-style="Definition Term"}s. A [**firing rate**]{.definition-term custom-style="Definition
    Term"} is the expected number of spikes per unit time. A rate of 20 hertz means
    an average of 20 spikes per second under the specified conditions, rather than
    a promise of one spike every 50 milliseconds.
  level: 2
- id: sec:FOUNDATIONS-POISSON
  title: A variable spike count at a fixed rate
  summary: 'Even when the represented value stays fixed, the spikes need not repeat
    from trial to trial. The 2012 model starts with a tractable description of this
    variability: a [**Poisson process**]{.definition-term custom-style="Definition
