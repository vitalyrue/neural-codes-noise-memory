  level: 2
- id: sec:FOUNDATIONS-DIFFUSION-EXAMPLE
  title: 'Example: why the noise grows slower than a fixed bias'
  summary: Take an illustrative angular diffusion coefficient $D=0.02$ degrees squared
    per second. At 0.35 s its variance is $0.014$ degrees squared and its root mean
    squared displacement is 0.118 degrees, or about 7.10 arcminutes. At 1 s the root
    mean squared displacement is 0.20 degrees. These are teaching values, not a new
    estimate from either monkey.
  level: 3
- id: sec:FOUNDATIONS-RANDOMNESS
  title: Randomness across time and across space
  summary: The memory and eye papers study fluctuations that accumulate as time passes.
    The place-field paper instead starts with a random function of physical position.
    Once drawn for a cell and an environment, that function is fixed while the animal
    moves through the map. Revisiting a place evaluates the same expected-rate function,
    although the actual spikes can still vary from visit to visit.
  level: 2
