    $\Delta t$ obeys'
  level: 2
- id: sec:FOUNDATIONS-COUNT-EXAMPLE
  title: 'Example: an apparently silent cell and an informative population'
  summary: Suppose the expected rate is 20 spikes per second and an observation lasts
    50 ms. The expected count is $20\times0.05=1$. The probability of seeing no spike
    is $e^{-1}=0.368$. A silent interval is therefore common even though the expected
    rate is positive.
  level: 3
- id: sec:FOUNDATIONS-COVARIANCE
  title: Variance, covariance, and displacement
  summary: To identify where variability enters a pathway, the eye paper compares
    measurements that share some fluctuations and have other fluctuations of their
    own. The required probability identities are short, but their interpretation matters.
  level: 2
- id: sec:FOUNDATIONS-ATTRACTOR
  title: Stable activity with a vulnerable stored value
  summary: A circuit's current activities are its [**state**]{.definition-term custom-style="Definition
    Term"}. A dynamical equation specifies how that state changes. A [**fixed point**]{.definition-term
    custom-style="Definition Term"} is a state where the deterministic rate of change
    is zero. It is stable in a direction if a small disturbance in that direction
    decays.
  level: 2
