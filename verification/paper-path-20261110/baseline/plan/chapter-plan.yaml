  - part_id: part:SIMULATIONS
    title: Simulations connect model assumptions to measurable outcomes
    purpose: '[Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109) test memory diffusion
      in spiking networks. [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y) connect
      a simulated neural command to eye motion. [Mainali et al. (2025)](https://doi.org/10.1016/j.neuron.2025.01.017)
      generate spatial maps and compare their fields with recordings. This Part explains the methods,
      measurements, and software behind those studies, then gives a guide-derived route for checking a
      reproduction.'
    content:
    - type: paragraph
      text: A formula predicts behavior under stated assumptions. A simulation lets us generate the resulting
        neural activity, eye motion, or spatial map and measure it in the same way as a theoretical prediction
        or experiment. The useful question is what each computation adds to the evidence, and which physical
        assumptions determine its output.
    - type: paragraph
      text: The path starts with how recurrent spikes move a stored value. It then adds the motor pathway
        and measurement procedure needed to compare an internal command with behavior. The spatial-field
        study changes the independent variable from time to position. With those differences established,
        the final chapter explains how to choose software and check numerical resolution.
    - type: paragraph
      text: Numerical settings for each paper and implementation cautions are folded. The main text keeps
        the modeled objects, actions, measurements, and limits visible. Blue definitions introduce simulation
        terms. Basic expectation, variance, standard deviation, and probability density are assumed.
    - type: paragraph
      text: The contribution labels describe the role of each result here. **Central** is a main finding
        of the cited paper. **Supporting** establishes or qualifies that finding. **Background** supplies
        needed concepts. **Guide-derived** identifies an explanation, comparison, or proposed test developed
        in this guide.
    - type: paragraph
      text: "::: {.part-chapter-map}\n\n- **[Chapter 19: Network simulations test how random spikes move\
        \ a stored value](../chapters/ch-simulating-memory.html)**\n\n  **Supporting simulations of a\
        \ central theory:** [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109) compare\
        \ stochastic network trajectories with their analytical diffusion prediction. The 2017 correction\
        \ applies to Eq. 2. The simulations test the modeled dynamics, rather than measure memory errors\
        \ in animals.\n\n- **[Chapter 20: Eye simulations connect a noisy neural command to measured motion](../chapters/ch-simulating-eye.html)**\n\
        \n  **Model support for a central explanation:** [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y)\
        \ combine recorded-data analysis with a noisy integrator, motor neurons, muscles, and delayed\
        \ feedback. Aksay et al. (2007) supply supporting circuit architecture. The generated signals\
        \ test whether that mechanism can reproduce the measured statistics.\n\n- **[Chapter 21: Random\
        \ spatial maps test the statistics of place fields](../chapters/ch-simulating-place.html)**\n\n\
        \  **Central model comparisons:** [Mainali et al. (2025)](https://doi.org/10.1016/j.neuron.2025.01.017)\
        \ generate thresholded Gaussian spatial maps, fit selected summaries, and test additional field\
        \ properties. Original animal recordings supply the comparison data. These are static-map simulations\
        \ rather than recurrent memory dynamics.\n\n- **[Chapter 22: Reproduction depends on the model,\
        \ numerical method, and measurement](../chapters/ch-simulation-tools.html)**\n\n  **Guide-derived\
        \ methods and tool comparison:** The shared reproduction procedure is assembled here from the\
        \ three studies. Author code is distinguished from optional numerical tools. No new full-paper\
        \ reproduction is claimed.\n\n:::"
