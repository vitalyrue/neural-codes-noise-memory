  parts:
  - part_id: part:MECHANISMS
    title: Noise limits memory accuracy in continuous attractor models
    purpose: In a model neural circuit, a pattern of firing rates across many nerve cells can represent
      a remembered angle. Random spike timing can change that angle while activity persists. The central
      source, [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109), derives how quickly accuracy
      can be lost and how well the value can be read. Chapters 1 and 2 establish the background. Chapters
      3 and 5 develop the central diffusion and information results. Chapters 4 and 6 explain long-delay
      behavior and readout. Expanded examples and marked checks of printed formulas are guide-derived.
    chapters:
    - ch:FOUNDATIONS
    - ch:PERSISTENCE
    - ch:MEMORY-DYNAMICS
    - ch:MEMORY-LONG-DELAYS
    - ch:MEMORY-INFORMATION
    - ch:MEMORY-READOUT
    content:
    - type: paragraph
      text: In a model neural circuit, a pattern of firing rates across many nerve cells can represent
        a remembered angle. Random spike timing can change that angle while activity persists. The central
        source, [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109), derives how quickly
        accuracy can be lost and how well the value can be read. Chapters 1 and 2 establish the background.
        Chapters 3 and 5 develop the central diffusion and information results. Chapters 4 and 6 explain
        long-delay behavior and readout. Expanded examples and marked checks of printed formulas are guide-derived.
    - type: paragraph
      text: The contribution labels describe the role of each result here. **Central** is a main finding
        of the cited paper. **Supporting** establishes or qualifies that finding. **Background** supplies
        needed concepts. **Guide-derived** identifies an explanation, comparison, or proposed test developed
        in this guide.
    - type: paragraph
      text: "::: {.part-chapter-map}\n\n- **[Chapter 1: Patterns of variable spikes can represent a value](../chapters/ch-foundations.html)**\n\
        \n  **Background and model:** Spikes leave decaying synaptic activation; weighted activation sets\
        \ input, and input sets firing rate. Equations 7–9 of Burak and Fiete (2012) establish these dynamics\
        \ before the chapters on stability and diffusion. Neural coding and spike variability supply the\
        \ remaining quantities for the memory calculation. [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109)\
        \ supply the Poisson network model. The chapter also explains its **supporting simulation test**:\
        \ simulated recurrent networks reproduce the predicted memory spreading in the modeled circuits.\
        \ [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y) and [Mainali et al.\
        \ (2025)](https://doi.org/10.1016/j.neuron.2025.01.017) supply eye-control and spatial-coding\
        \ context. The elementary numerical examples are guide-derived.\n\n- **[Chapter 2: Stable representations\
        \ can accumulate error](../chapters/ch-persistence.html)**\n\n  **Background and mechanism:**\
        \ A stable pattern of neural activity can retain a value while noise moves that value along a\
        \ family of states. This is the continuous-memory setup of [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109).\
        \ The two-variable illustrations are guide-derived.\n\n- **[Chapter 3: Spiking noise produces\
        \ diffusion along the memory attractor](../chapters/ch-memory-dynamics.html)**\n\n  **Central\
        \ result:** [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109) derive memory diffusion\
        \ by projecting spike fluctuations through the network dynamics. The symmetric formula uses the\
        \ authors' [2017 correction](https://doi.org/10.1073/pnas.1706051114). Expanded projection examples\
        \ are guide-derived.\n\n- **[Chapter 4: Boundaries and drift change memory error over long delays](../chapters/ch-memory-long-delays.html)**\n\
        \n  **Supporting results:** [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109)\
        \ explain long-delay behavior, angular boundaries, and state-dependent diffusion. These qualify\
        \ how the central diffusion result can be used. The guide adds explicit boundary calculations\
        \ and distinguishes its checks of other printed equations from the official correction.\n\n- **[Chapter\
        \ 5: Spike information limits memory stability](../chapters/ch-memory-information.html)**\n\n\
        \  **Central result:** [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109) relate\
        \ the information in spikes to a lower bound on memory diffusion. The guide expands the proofs\
        \ and labels its counterexamples and comparisons of fixed quantities.\n\n- **[Chapter 6: Readout\
        \ accuracy depends on how a moving memory is observed](../chapters/ch-memory-readout.html)**\n\
        \n  **Central readout result and supporting extensions:** [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109)\
        \ derive limits on estimating a value that moves during observation. Partial access and alternative\
        \ time scales extend that result. The guide supplies intermediate calculations and identifies\
        \ source formulas needing qualification.\n\n:::"
  - part_id: part:OBSERVATIONS
    title: Eye motion and place fields constrain different parts of a neural code
    purpose: These studies connect neural activity to eye control in monkeys and location in rodents and
      bats. [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y) supply the central
      shared-drive inference and a possible integrator explanation in Chapters 7 to 9. [Mainali et al.
      (2025)](https://doi.org/10.1016/j.neuron.2025.01.017) supply the spatial model, field-size predictions,
      and supporting shape tests in Chapters 10 to 12. Chapter 13 is a guide-derived comparison of those
      results with Burak and Fiete (2012). The eye chapters begin with recordings and then test a possible
      neural source. The place chapters begin with a spatial input model and then test its field statistics.
    chapters:
    - ch:EYE-DRIFT
    - ch:EYE-TIMING
    - ch:EYE-CIRCUIT
    - ch:PLACE-FIELDS
    - ch:PLACE-SIZES
    - ch:PLACE-TESTS
    - ch:SYNTHESIS
    content:
    - type: paragraph
      text: These studies connect neural activity to eye control in monkeys and location in rodents and
        bats. [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y) supply the central
        shared-drive inference and a possible integrator explanation in Chapters 7 to 9. [Mainali et al.
        (2025)](https://doi.org/10.1016/j.neuron.2025.01.017) supply the spatial model, field-size predictions,
        and supporting shape tests in Chapters 10 to 12. Chapter 13 is a guide-derived comparison of those
        results with Burak and Fiete (2012). The eye chapters begin with recordings and then test a possible
        neural source. The place chapters begin with a spatial input model and then test its field statistics.
    - type: paragraph
      text: The contribution labels describe the role of each result here. **Central** is a main finding
        of the cited paper. **Supporting** establishes or qualifies that finding. **Background** supplies
        needed concepts. **Guide-derived** identifies an explanation, comparison, or proposed test developed
        in this guide.
    - type: paragraph
      text: "::: {.part-chapter-map}\n\n- **[Chapter 7: Eye drift points to a shared neural drive](../chapters/ch-eye-drift.html)**\n\
        \n  **Central empirical result:** [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y)\
        \ infer a substantial shared drive upstream of ocular motor neurons from recorded eye motion and\
        \ spikes. The filter and covariance calculations explain the assumptions behind that inference.\n\
        \n- **[Chapter 8: Drift growth distinguishes diffusion from filtered white noise](../chapters/ch-eye-timing.html)**\n\
        \n  **Supporting test:** [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y)\
        \ compare displacement statistics with the predictions of mechanical filtering and private motor\
        \ noise. The one-filter calculation is a guide-derived teaching model, distinct from the full\
        \ simulation.\n\n- **[Chapter 9: A noisy memory circuit can produce eye drift](../chapters/ch-eye-circuit.html)**\n\
        \n  **Central proposed explanation:** [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y)\
        \ show that a noisy integrator model can account for the motion after muscle filtering and delayed\
        \ feedback. [Aksay et al. (2007)](https://doi.org/10.1038/nn1877) supply supporting circuit architecture.\
        \ The match supports a possible source, rather than uniquely identifying it.\n\n- **[Chapter 10:\
        \ Field counts and gaps reveal threshold and scale](../chapters/ch-place-fields.html)**\n\n  **Central\
        \ spatial model:** [Mainali et al. (2025)](https://doi.org/10.1016/j.neuron.2025.01.017) describe\
        \ fields and gaps as regions of a smooth random input above or below threshold. Expanded crossing\
        \ and parameter-inference calculations are guide-derived.\n\n- **[Chapter 11: High peaks explain\
        \ size laws across dimensions](../chapters/ch-place-sizes.html)**\n\n  **Central size predictions:**\
        \ [Mainali et al. (2025)](https://doi.org/10.1016/j.neuron.2025.01.017) derive dimension-dependent\
        \ field-size statistics and compare them with recordings. The guide expands the local-peak derivation\
        \ and separates limiting laws from finite-threshold behavior.\n\n- **[Chapter 12: Holes and measurements\
        \ test the spatial explanation](../chapters/ch-place-tests.html)**\n\n  **Supporting tests and\
        \ circuit interpretation:** [Mainali et al. (2025)](https://doi.org/10.1016/j.neuron.2025.01.017)\
        \ examine shapes, slices, and connectedness beyond the fitted summaries. The underlying recordings\
        \ include [Eliav et al. (2021)](https://doi.org/10.1126/science.abg4020), [Harland et al. (2021)](https://doi.org/10.1016/j.cub.2021.03.003),\
        \ and [Yartsev and Ulanovsky (2013)](https://doi.org/10.1126/science.1235338). Gaussian maps constrain\
        \ possible inputs without uniquely identifying wiring.\n\n- **[Chapter 13: Spatial maps and memory\
        \ dynamics need separate tests](../chapters/ch-synthesis.html)**\n\n  **Guide-derived synthesis:**\
        \ The comparison joins the questions asked by [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109),\
        \ [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y), and [Mainali et al.\
        \ (2025)](https://doi.org/10.1016/j.neuron.2025.01.017). Its common-displacement calculation and\
        \ proposed joint experiment are developed here. The three papers did not jointly test that model.\n\
        \n:::"
  - part_id: part:HARDWARE
    title: Neural memory in electronic hardware
    purpose: "Electronic circuits store connection settings, changing states and values represented by networks. Von Neumann (1958) motivates the comparison. Chapter 14 identifies physical states and weights; Chapter 15 follows feedback through electronic architectures. Chapter 16 compares stability and noise with the neural model of Burak and Fiete (2012). Chapter 17 examines selected hardware results through October 30, 2026. Chapter 18 develops guide-derived experiments and readout tests connected to all three papers."
    content:
    - type: paragraph
      text: '<!-- vale ai-tells.SequencingMarkers = NO -->

        <!-- vale ai-tells.VerbTricolon = NO -->

        > “Lastly, I would like to mention that systems of nerve cells, which stimulate each other in
        various possible cyclical ways, also constitute memories.”

        <!-- vale ai-tells.VerbTricolon = YES -->

        <!-- vale ai-tells.SequencingMarkers = YES -->'
    - type: paragraph
      text: John von Neumann, *The Computer and the Brain* (1958), [printed page 66, PDF page 78](https://vpb.smallyu.net/%5BAuthor%5D%20John.Von.Neumann/The%20Computer%20and%20The%20Brain.pdf#page=78).
    - type: paragraph
      text: Von Neumann compares mutually stimulating nerve cells with electronic circuits that preserve
        a state through feedback. In the following pages he also questions whether active elements alone
        could provide the nervous system's main large-capacity store. His comparison invites us to distinguish
        a memory's physical mechanism from the information it keeps. It does not establish that every
        brain memory uses persistent activity, or that present hardware follows one historical line from
        his book.
    - type: paragraph
      text: The setting here is experimental and computational neuroscience joined with electronic engineering.
        We ask how a silicon circuit can retain a quantity such as an angle, and what physical processes
        limit its accuracy. [A durable connection weight, a lasting activity pattern, and an accurately
        remembered value are three different achievements.]{.key-statement}
    - type: paragraph
      text: "The path begins by identifying weights, changing states and the value represented by a circuit. We then follow feedback through flip-flops, multilevel circuits, recurrent rings and oscillators. The next chapter asks how a single disturbance and ongoing noise change those states, connecting stability to the neural dynamics in Part I. We compare physical and digital implementations, then end with repeated-trial measurements, readout and the lessons of Part II. The hardware research snapshot is current to **October 30, 2026**."
    - type: paragraph
      text: For a first pass, read the physical explanations, main results, and interpretations. Worked
        calculations and deeper derivations are folded. The comparison assumes the calculus, basic probability,
        and linear algebra used earlier. Electronics terms are introduced as they become necessary.
    - type: paragraph
      text: The contribution labels describe the role of each result here. **Central** is a main finding
        of the cited paper. **Supporting** establishes or qualifies that finding. **Background** supplies
        needed concepts. **Guide-derived** identifies an explanation, comparison, or proposed test developed
        in this guide.
    - type: paragraph
      text: "::: {.part-chapter-map}\n\n- **[Chapter 14: A stored weight and a remembered value are different states](../chapters/ch-hardware-memory.html)**\n\n  **Background and hardware mechanisms:** von Neumann (1958) motivates the comparison. [Pehle et al. (2022)](https://doi.org/10.3389/fnins.2022.795876), Intel Labs (2021), Scholze et al. (2026), and [Le Gallo et al. (2023)](https://doi.org/10.1038/s41928-023-01010-1) supply the architecture descriptions. The guide distinguishes connection settings, changing states and represented values.\n\n- **[Chapter 15: Electronic feedback circuits store and transform neural-like states](../chapters/ch-electronic-architectures.html)**\n\n  **Guide-derived architectural comparison:** [Hassabis et al. (2017)](https://doi.org/10.1016/j.neuron.2017.06.011) discuss exchanges between neuroscience and AI. [Alhawari and Perrott (2014)](https://doi.org/10.1109/ISCAS.2014.6865497), [Massoud and Horiuchi (2011)](https://doi.org/10.1109/TCSI.2010.2055310) and [Kreiser et al. (2018)](https://services.ini.uzh.ch/admin/extras/doc_get.php?id=71960) supply distinct circuit examples. The guide compares what their feedback and state represent; not every example is a neural network.\n\n- **[Chapter 16: Discrete restoration and continuous random wandering produce different memory errors](../chapters/ch-hardware-dynamics.html)**\n\n  **Central neural distinction with supporting hardware examples:** [Seung (1996)](https://doi.org/10.1073/pnas.93.23.13339) and [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109) explain graded persistence and noise. [Massoud and Horiuchi (2011)](https://doi.org/10.1109/TCSI.2010.2055310) and [Giulioni et al. (2012)](https://doi.org/10.3389/fnins.2011.00149) supply distinct silicon demonstrations. The reduced feedback and error comparisons are guide-derived.\n\n- **[Chapter 17: Neuromorphic chips choose where physics performs the calculation](../chapters/ch-neuromorphic-systems.html)**\n\n  **Central results of selected hardware studies:** [Kleyko et al. (2025)](https://doi.org/10.1038/s41467-025-55832-y) test temporal computation. [Aitsam et al. (2026)](https://doi.org/10.3389/fnins.2026.1910808) demonstrate persistent spatial activity. [Ortner et al. (2025)](https://doi.org/10.1038/s41467-025-56345-4) study adaptation with phase-change computing. [Wang et al. (2026)](https://doi.org/10.1038/s41563-025-02361-0) study material-state stability. [Sun et al. (2026)](https://doi.org/10.1038/s42256-026-01255-3) evaluate a proposed dual-memory design. These results concern different kinds of memory, as the chapter explains.\n\n- **[Chapter 18: Memory experiments must separate device error from network dynamics](../chapters/ch-hardware-tests.html)**\n\n  **Guide-derived experiments:** The proposed measurements combine the diffusion and readout questions of [Burak and Fiete (2012)](https://doi.org/10.1073/pnas.1117386109), the output-filtering lesson of [Ben-Shushan et al. (2022)](https://doi.org/10.1038/s41467-022-29201-y), and the spatial-versus-temporal distinction exposed by [Mainali et al. (2025)](https://doi.org/10.1016/j.neuron.2025.01.017). They are suggested tests, not a reported common hardware experiment.\n\n:::"
    chapters:
    - ch:HARDWARE-MEMORY
    - ch:ELECTRONIC-ARCHITECTURES
