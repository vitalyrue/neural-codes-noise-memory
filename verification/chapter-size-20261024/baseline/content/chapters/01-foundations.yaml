  caption: A common activity disturbance returns to the initial angle, while an along-line
    disturbance persists as a changed angle. The solid arrow is deterministic recovery;
    the dashed arrow is an imposed disturbance. This is the guide's two-activity construction,
    not experimental data.
  alt: Two activity axes in hertz, a diagonal fixed-point line, initial state at 50 and
