- id: fig:FOUNDATIONS-PAPER-MAP
  kind: figure
  placement: sec:FOUNDATIONS-RANDOMNESS
  asset: assets/approved/visuals/foundations-paper-map.png
  caption: Memory loss and eye drift concern changes over time; place-field statistics
    concern variation across a fixed spatial map. The eye pathway shows the proposed changing-command
    mechanism. Original guide schematic based on the three papers, with illustrative traces
    rather than recorded data.
  alt: Three separate rows compare a wandering stored value over time, a proposed changing
    command passing through muscles to eye position, and one fixed spatial rate curve
    evaluated twice at the same place. They link to the 2012 memory, 2022 eye-drift and
    2025 place-field papers respectively.
  width_inches: 7.29167
  html_fold: never
- id: fig:FOUNDATIONS-POISSON-POPULATION
  kind: figure
  placement: sec:FOUNDATIONS-POISSON
  asset: assets/approved/visuals/foundations-poisson-population.png
  caption: Analytic teaching construction for the chapter’s 20 Hz, 50 ms example. The
    count is Poisson with mean 1 for one cell and mean 20 for 20 conditionally independent
    cells. Both panels plot the rate per cell $K/(N\Delta t)$, so both estimates have
    mean 20 Hz; their standard deviations are 20 Hz and 4.47 Hz. Each stem is a probability
    at one possible estimate, rather than a continuous density. Only estimates through
    100 Hz are drawn. The independence condition concerns fixed modeled rates, not complete
    recurrent spike trains.
  alt: Two discrete Poisson distributions share a rate per cell axis. One cell has widely
    spaced possible estimates at zero, twenty, forty hertz and so on, with probability
    0.368 at zero. The twenty cell estimate has possible values one hertz apart and clusters
    around twenty hertz. Their means match, but the rate standard deviation falls from
    twenty to 4.47 hertz.
  width_inches: 7.29167
  html_fold: never
- id: fig:FOUNDATIONS-DIFFUSION-BIAS
  kind: figure
  placement: sec:FOUNDATIONS-DIFFUSION
  asset: assets/approved/visuals/foundations-diffusion-bias.png
  caption: Simulated Brownian teaching paths and analytic displacement scales for $D=0.02$
    degrees squared per second and $v=0.10$ degrees per second. The upper paths have zero
    drift and start at zero; the dashed envelope is the exact root mean squared displacement,
    not a boundary on individual paths. Below, $\sqrt{2Dt}$ and $vt$ are equal at 4 s,
    when each is 0.40 degrees. Their squares are the separate contributions to the biased
    model’s MSD. The coordinate is unbounded, and these chosen values are not estimates
    from animal recordings.
  alt: Seven Brownian sample paths move irregularly above and below zero. A dashed positive
    and negative root mean squared envelope grows with the square root of time; some paths
    cross it. A second plot compares the positive root mean squared displacement with
    a linearly growing bias displacement. Both equal 0.40 degrees at four seconds, after
    which the bias line is higher.
  width_inches: 7.29167
  html_fold: never
