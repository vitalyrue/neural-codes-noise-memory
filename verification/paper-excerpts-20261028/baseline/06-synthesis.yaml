- id: fig:SYNTHESIS-SHARED-POSITION
  kind: figure
  placement: sec:SYNTHESIS-COVARIANCE-EXAMPLE
  asset: assets/approved/visuals/synthesis-shared-position.png
  caption: A common displacement of $+0.1$ m increases rate 1 by $0.2$ Hz and decreases rate
    2 by $0.1$ Hz. The changes lie on one line. With displacement variance $0.01$ m², their
    covariance is $-0.02$ Hz² and their correlation is $-1$. The 10 Hz baseline is chosen
    only to display positive rates. These are exact lines from the guide’s local example,
    not recorded data.
  alt: The upper plot shows two fixed linear tuning curves with slopes plus two and minus
    one hertz per meter, crossing at ten hertz. Moving from zero to plus 0.1 meter raises
    the first rate by 0.2 hertz and lowers the second by 0.1 hertz. The lower plot puts the
    paired rate changes on a downward sloping line through zero, with that example marked.
  width_inches: 7.29167
