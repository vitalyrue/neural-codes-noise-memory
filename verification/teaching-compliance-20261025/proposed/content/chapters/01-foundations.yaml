- id: fig:FOUNDATIONS-POISSON-POPULATION
  kind: figure
  placement: sec:FOUNDATIONS-POISSON
  asset: assets/approved/visuals/foundations-poisson-population.png
  caption: Analytic teaching construction for the chapter’s 20 Hz, 50 ms example. The count
    is Poisson with mean 1 for one cell and mean 20 for 20 conditionally independent cells.
    Both panels plot the rate per cell $K/(N\Delta t)$, so both estimates have mean 20 Hz;
    their standard deviations are 20 Hz and 4.47 Hz. Each stem is a probability at one possible
    estimate, rather than a continuous density. Only estimates through 100 Hz are drawn. The
    independence condition concerns fixed modeled rates, not complete recurrent spike trains.
  alt: Two discrete Poisson distributions share a rate per cell axis. One cell has widely
    spaced possible estimates at zero, twenty, forty hertz and so on, with probability 0.368
    at zero. The twenty cell estimate has possible values one hertz apart and clusters around
    twenty hertz. Their means match, but the rate standard deviation falls from twenty to
    4.47 hertz.
