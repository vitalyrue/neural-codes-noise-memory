- id: sec:FOUNDATIONS-COVARIANCE
  title: Mean squared displacement combines random spread with mean motion
  summary: To identify where variability enters a pathway, the eye paper compares measurements
    that share some fluctuations and have other fluctuations of their own.
  level: 2
