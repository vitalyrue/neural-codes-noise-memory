schema_version: 3
book:
  title: 'Neural Codes, Noise, and Memory: A Guide to Three Papers'
  contributors: []
  front_matter:
  - ch:READING-GUIDE
  parts:
  - part_id: part:MECHANISMS
    title: Noise limits memory accuracy in continuous attractor models
    purpose: A stable population pattern can retain a continuous value while fluctuations
      move that value along its family of persistent states. These chapters establish the
      neural and probability background, derive the surviving motion, and connect it to limits
      on information and readout.
    chapters:
    - ch:FOUNDATIONS
    - ch:PERSISTENCE
    - ch:MEMORY-DYNAMICS
    - ch:MEMORY-LONG-DELAYS
    - ch:MEMORY-INFORMATION
    - ch:MEMORY-READOUT
  - part_id: part:OBSERVATIONS
    title: Eye motion and place fields constrain different parts of a neural code
    purpose: Neural fluctuations reach behavior through a motor pathway, while spatial tuning
      describes how a position is expressed across cells. The eye and place-field studies
      constrain these different relationships. The final chapter connects their results without
      treating a static map as a complete dynamical model.
    chapters:
    - ch:EYE-DRIFT
    - ch:EYE-TIMING
    - ch:EYE-CIRCUIT
    - ch:PLACE-FIELDS
    - ch:PLACE-SIZES
    - ch:PLACE-TESTS
    - ch:SYNTHESIS
  appendices:
  - ch:GLOSSARY
  - ch:REFERENCES
