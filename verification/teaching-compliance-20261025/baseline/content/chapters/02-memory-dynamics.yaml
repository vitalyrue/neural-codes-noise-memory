section_list:
- id: sec:MEMORY-SPIKES
  title: Recurrent spikes renew decaying synaptic activity
  summary: How can brief spikes maintain a state for much longer than the duration of a spike?
    In this model, each spike leaves a synaptic activation that decays gradually. Incoming
    activations determine new firing rates; the resulting spikes renew those activations.
    This feedback can support activity after the external stimulus has ended.
  level: 2
- id: sec:MEMORY-LINEARIZATION
  title: The network's return flow determines the lasting memory change
  summary: 'A spike perturbs many aspects of a network''s state. Most of those changes decay
    as the state returns to the attractor. To calculate memory loss, we need the one change
    that survives: the displacement to a different fixed point.'
  level: 2
- id: sec:MEMORY-DIFFUSION
  title: Projecting spike fluctuations gives the diffusion coefficient
  summary: We can now calculate how much random displacement remains after the stable components
    have relaxed. Multiply the linear stochastic equation by $\mathbf v^T$. Since $\mathbf
    v^TK=0$,
  level: 2
- id: sec:MEMORY-SYMMETRIC
  title: Symmetric weights express diffusion through tuning curves
  summary: The general formula requires the left vector of the network dynamics. When $W_{ij}=W_{ji}$,
    can we write it using tuning curves and the input to rate rule?
  level: 2
