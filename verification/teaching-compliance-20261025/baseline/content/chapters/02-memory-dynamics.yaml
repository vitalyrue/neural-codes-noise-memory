- id: fig:MEMORY-TILTED-DECAY
  kind: figure
  placement: sec:MEMORY-LINEARIZATION
  asset: assets/approved/visuals/memory-tilted-decay.png
  caption: Original guide construction of the tilted decay example, with dimensionless coordinates
    and $a/\lambda=1/2$. After an imposed jump from $(0,0)$ to $(0,2)$, the state relaxes
    toward $(1,0)$; successive time marks crowd toward that endpoint. This illustrates the
    left and right zero vector construction in Burak and Fiete (2012), Supporting Text, Section
    II, pp. 3–4, Eqs. S10–S16; it is not a paper network simulation.
  alt: A line of fixed points lies at y equals zero. An imposed vertical jump from zero zero
    to zero two is followed by a straight tilted flow toward one zero. Equal time marks crowd
    toward the endpoint. Perpendicular projection would return to zero zero and miss the lasting
    shift of one. The tangent is one zero; the left vector measures delta x plus one half
    delta y.
  width_inches: 7.29167
  html_fold: never
- id: fig:MEMORY-SPIKE-TRACE
  kind: figure
  placement: sec:MEMORY-SPIKES
  asset: assets/approved/visuals/memory-spike-trace.png
  caption: Each spike adds one activation unit, which then decays with a 50 ms time constant.
    Closely spaced spikes add to the activation left by earlier spikes. The five spike times
    are an illustrative input, and the activation is calculated exactly from the chapter equation.
  alt: Five spike marks share a time axis with an activation trace. Each mark aligns with
    a vertical rise of one activation unit. The activation decays smoothly between spikes,
    and nearby spikes build on the remaining activation.
  width_inches: 7.29167
  html_fold: never
- id: fig:MEMORY-INHIBITION-RATES
  kind: figure
  placement: sec:MEMORY-SYMMETRIC
  asset: assets/approved/visuals/memory-inhibition-rates.png
  caption: For the chapter’s two mutually inhibiting cells, b = 20 activation units and tau
    = 0.1 s give opposite changes in the two rates. Their sum remains 200 spikes/s, so local
    D remains 100 coordinate units squared/s. Open endpoints mark the excluded boundaries;
    the linear interior model does not determine boundary behavior. These curves are calculated
    examples, not simulation data.
  alt: As theta increases through the interior from minus 20 to 20 activation units, r1 increases
    toward 200 spikes per second and r2 decreases toward zero. Their dashed sum stays at 200.
    A lower aligned plot shows D constant at 100 coordinate units squared per second. Open
    endpoint circles exclude both boundaries.
  width_inches: 7.29167
