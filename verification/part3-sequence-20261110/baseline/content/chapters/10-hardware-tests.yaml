chapter_id: ch:HARDWARE-TESTS
part_id: part:HARDWARE
title: Memory experiments must separate device error from network dynamics
purpose: After a circuit receives an angle cue, its later estimate may be wrong because the state wandered,
  because unequal connections pull it toward another angle, or because the observer reads it poorly. One accuracy
  score combines these causes. The controlled tests below connect these errors to physical parameters. The
  protocol and reduced models below are proposed tools for reasoning about these experiments, not results already
  demonstrated on every platform in the previous chapter.
