section_list:
- id: sec:MEMORY-FI
  title: Rate slopes and spike variability determine local information
  summary: Suppose two nearby memory values produce almost identical rates. A short spike
    sample cannot reliably tell them apart. If a small change in memory instead produces a
    large rate change relative to spike variability, that sample is more useful. We need a
    quantity that measures this local distinction.
  level: 2
- id: sec:MEMORY-BOUND
  title: Spike information sets a lower bound on memory diffusion
  summary: The network has no access to its exact firing rates as noiseless numbers. Its recurrent
    input is built from the same random spikes that an external observer sees. The lower bound
    on diffusion follows directly by comparing the state sensitivity of the network with the
    spike information.
  level: 2
- id: sec:MEMORY-COMPARISONS
  title: Improving persistence depends on what a comparison holds fixed
  summary: The inequality compares diffusion and information for the same network. To compare
    different networks, we must say what stays fixed. Otherwise an apparent benefit of a parameter
    change may come from changing another property at the same time.
  level: 2
