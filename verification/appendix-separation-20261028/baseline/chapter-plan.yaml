schema_version: 3
book:
  title: 'Neural Codes, Noise, and Memory: A Guide to Three Papers'
  contributors: []
  front_matter:
  - ch:READING-GUIDE
  parts:
  - part_id: part:MECHANISMS
    title: Noise limits memory accuracy in continuous attractor models
    purpose: "In a model neural circuit, the pattern of firing rates across many nerve cells can represent a remembered angle. Random spike timing can change that angle even while the circuit sustains its activity. Chapters 1–2 explain neural signals and how activity stores a value. Chapters 3–4 derive how that value wanders over time. Chapters 5–6 connect its stability to how accurately it can be estimated from the cells’ spikes."
    chapters:
    - ch:FOUNDATIONS
    - ch:PERSISTENCE
    - ch:MEMORY-DYNAMICS
    - ch:MEMORY-LONG-DELAYS
    - ch:MEMORY-INFORMATION
    - ch:MEMORY-READOUT
  - part_id: part:OBSERVATIONS
    title: Eye motion and place fields constrain different parts of a neural code
    purpose: "The next studies connect neural activity to eye control in monkeys and to location in rodents and bats. Chapters 7–9 follow the path from a neural command through eye muscles to measured movement, and test a possible source of drift. Chapters 10–12 explain where hippocampal nerve cells fire as an animal moves and compare a spatial model with recordings. Chapter 13 asks what these findings establish together and which connections remain untested."
    chapters:
    - ch:EYE-DRIFT
    - ch:EYE-TIMING
    - ch:EYE-CIRCUIT
    - ch:PLACE-FIELDS
    - ch:PLACE-SIZES
    - ch:PLACE-TESTS
    - ch:SYNTHESIS
  appendices:
  - ch:GLOSSARY
  - ch:REFERENCES
