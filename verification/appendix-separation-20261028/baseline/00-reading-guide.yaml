chapter_id: ch:READING-GUIDE
part_id: part:MECHANISMS
title: What the three papers establish
purpose: These neuroscience papers study memory, eye control, and navigation. Their settings are mathematical
  models of stored values, eye-movement and neural recordings from macaque monkeys, and recordings of
  location-dependent neural activity in rodents and bats. This reading guide explains each study’s question,
  methods, findings, and limits.
