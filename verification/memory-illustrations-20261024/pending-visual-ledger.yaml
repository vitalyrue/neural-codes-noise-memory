- visual_id: fig:MEMORY-LINE-RING
  block_id: fig:MEMORY-LINE-RING
  asset: candidate-content/visuals/candidates/20261024/M03/figure.png
  status: candidate
  embedded: false
  generator: verification/memory-illustrations-20261024/draw_additions.py
  placement: sec:MEMORY-LONG-TIME
  caption: With the same constant D = 0.5 rad²/s, wrapped Gaussian error densities widen
    toward 1/(2π). The unbounded line has mean squared error 2Dt; reporting angular error
    in $[-\pi,\pi)$ instead gives a mean squared error that approaches π²/3. The flattening
    comes from the bounded error convention while local diffusion stays constant. All
    curves are analytic teaching calculations, not paper simulation data.
  accessibility_description: Wrapped Gaussian densities at 0.2, 1 and 5 seconds broaden
    toward a dashed uniform density over angular errors from minus pi to pi. Below, line
    mean squared error rises linearly while wrapped angular mean squared error approaches
    a horizontal pi squared over three reference, with the same constant diffusion coefficient.
  teaching_introduction: For $D=0.5\,\mathrm{rad}^2/\mathrm{s}$, the plots show how the
    density and squared error change with delay.
  interpretation: As the upper density approaches uniform, the wrapped error below approaches
    $\pi^2/3$; the line error keeps growing.
  content_brief: verification/memory-illustrations-20261024/M03-brief.yaml
  review_contract:
    schema_version: 1
    figure_role: quantitative-figure
    route: vector
    unit_scope: chapter
