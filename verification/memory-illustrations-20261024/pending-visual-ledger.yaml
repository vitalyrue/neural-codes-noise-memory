- visual_id: fig:MEMORY-INHIBITION-RATES
  block_id: fig:MEMORY-INHIBITION-RATES
  asset: candidate-content/visuals/candidates/20261024/M02/figure.png
  status: candidate
  embedded: false
  generator: verification/memory-illustrations-20261024/draw_additions.py
  placement: sec:MEMORY-SYMMETRIC
  caption: For the chapter’s two mutually inhibiting cells, b = 20 activation units and
    tau = 0.1 s give opposite changes in the two rates. Their sum remains 200 spikes/s,
    so local D remains 100 coordinate units squared/s. Open endpoints mark the excluded
    boundaries; the linear interior model does not determine boundary behavior. These
    curves are calculated examples, not simulation data.
  accessibility_description: As theta increases through the interior from minus 20 to
    20 activation units, r1 increases toward 200 spikes per second and r2 decreases toward
    zero. Their dashed sum stays at 200. A lower aligned plot shows D constant at 100
    coordinate units squared per second. Open endpoint circles exclude both boundaries.
  teaching_introduction: The plot uses $b=20$ activation units and $\tau=0.1\,\mathrm{s}$.
  interpretation: The dashed rate sum in the upper plot stays fixed, so the lower plot
    has the same $D$ at every interior value of $\theta$.
  content_brief: verification/memory-illustrations-20261024/M02-brief.yaml
