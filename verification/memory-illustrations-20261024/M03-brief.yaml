parameters:
  D_rad_squared_per_s: 0.5
  initial_angle_rad: 0
  density_times_s:
  - 0.2
  - 1
  - 5
  density_method: Gaussian image sum k=-12..12
  MSD_method: integral of x^2 times exact wrapped density; Fourier series for curve
  angular_error_interval: '[-pi,pi)'
  uniform_density: 1/(2*pi)
  limiting_angular_MSD: pi^2/3
required_items:
- Wrapped Gaussian densities widen toward the uniform density 1/(2pi).
- The line MSD is 2Dt.
- The reported angular MSD tends to pi^2/3 on [-pi,pi).
- Both use the same constant D=0.5 rad squared/s and start at zero.
language_contract:
  book_loci:
  - sec:MEMORY-LONG-TIME
  caption: With the same constant D = 0.5 rad²/s, wrapped Gaussian error densities widen
    toward 1/(2π). The unbounded line has mean squared error 2Dt; reporting angular error
    in $[-\pi,\pi)$ instead gives a mean squared error that approaches π²/3. The flattening
    comes from the bounded error convention while local diffusion stays constant. All
    curves are analytic teaching calculations, not paper simulation data.
  alt_text: Wrapped Gaussian densities at 0.2, 1 and 5 seconds broaden toward a dashed
    uniform density over angular errors from minus pi to pi. Below, line mean squared
    error rises linearly while wrapped angular mean squared error approaches a horizontal
    pi squared over three reference, with the same constant diffusion coefficient.
  teaching_introduction: For $D=0.5\,\mathrm{rad}^2/\mathrm{s}$, the plots show how the
    density and squared error change with delay.
  conclusion: As the upper density approaches uniform, the wrapped error below approaches
    $\pi^2/3$; the line error keeps growing.
