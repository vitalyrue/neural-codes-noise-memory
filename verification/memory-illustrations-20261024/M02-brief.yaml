parameters:
  b_activation_units: 20
  tau_s: 0.1
  domain: -20 < theta < 20
  r_sum_spikes_per_s: 200
  D_coordinate_squared_per_s: 100
required_items:
- Rates r1=(20+theta)/0.2 and r2=(20-theta)/0.2.
- Sum r1+r2=200 spikes/s.
- D=(r1+r2)/2=100 coordinate units squared/s.
- Only the interior of the linear positive-rate model is shown; endpoint markers are open.
language_contract:
  book_loci:
  - sec:MEMORY-SYMMETRIC
  caption: For the chapter’s two mutually inhibiting cells, b = 20 activation units and
    tau = 0.1 s give opposite changes in the two rates. Their sum remains 200 spikes/s,
    so local D remains 100 coordinate units squared/s. Open endpoints mark the excluded
    boundaries; the linear interior model does not determine boundary behavior. These
    curves are calculated examples, not simulation data.
  alt_text: As theta increases through the interior from minus 20 to 20 activation units,
    r1 increases toward 200 spikes per second and r2 decreases toward zero. Their dashed
    sum stays at 200. A lower aligned plot shows D constant at 100 coordinate units squared
    per second. Open endpoint circles exclude both boundaries.
  teaching_introduction: The plot uses $b=20$ activation units and $\tau=0.1\,\mathrm{s}$.
  conclusion: The dashed rate sum in the upper plot stays fixed, so the lower plot has
    the same $D$ at every interior value of $\theta$.
