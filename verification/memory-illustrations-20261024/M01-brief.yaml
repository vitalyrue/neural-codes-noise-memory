required_items:
- Discrete event marks at the five specified times.
- Activation is the sum of exponential contributions, with a unit jump at each event.
- Between events activation decays with time constant 50 ms.
language_contract:
  book_loci:
  - sec:MEMORY-SPIKES
  caption: Each spike adds one activation unit, which then decays with a 50 ms time constant.
    Closely spaced spikes add to the activation left by earlier spikes. The five spike
    times are an illustrative input, and the activation is calculated exactly from the
    chapter equation.
  alt_text: Five spike marks share a time axis with an activation trace. Each mark aligns
    with a vertical rise of one activation unit. The activation decays smoothly between
    spikes, and nearby spikes build on the remaining activation.
  teaching_introduction: For five illustrative spike times, the plot shows the events
    and the activation they leave behind.
  conclusion: The activation retains a decaying contribution from earlier spikes, so a
    spike train and its activation trace are different objects.
