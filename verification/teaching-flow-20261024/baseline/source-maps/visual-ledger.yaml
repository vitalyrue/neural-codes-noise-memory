  placement: sec:MEMORY-READOUT-SETUP
  caption_and_alt: content/chapters/03-memory-information.yaml
  teaching_introduction: A timeline separates the displacement accumulated before the
    cue from the error in estimating the cue state afterward.
  caption: Original guide construction of storage and cue state readout, based on Burak
    and Fiete (2012), Supporting Text, p. 12, Eq. S57. The illustrated path is one possible
    construction, and the orange estimate concerns the state at the cue rather than the
    state at the end of observation. With the conditions shown, storage and readout variances
    add because their cross covariance is zero.
  interpretation: Later spikes can improve the estimate of $x=\theta(T)$; they do not
    reveal the particular storage displacements that separated $x$ from $\Theta$.
  accessibility_description: The stored value starts at Theta at encoding time zero and
    wanders until the recall cue at T. Its cue value is x. Later spikes, collected through
    T plus L, give an estimate x hat of that cue state. Storage error is x minus Theta;
    readout error is x hat minus x. The estimate is drawn separately from the path endpoint.
    Under the listed independence, unbiasedness and translation assumptions, total variance
    is two D T plus readout variance.
  toc_correspondence: sec:MEMORY-READOUT-SETUP
  provenance: Guide-created from the cited explanation and analytic model.
