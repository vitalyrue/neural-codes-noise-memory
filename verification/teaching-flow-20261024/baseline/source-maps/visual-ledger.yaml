  caption_and_alt: content/chapters/03-memory-information.yaml
  caption: Analytic teaching calculation for the chapter’s mutual inhibition example,
    with $b=200$ activation units and $\tau=0.1$ s. The coordinate $\theta$ is an activation
    difference. For positive rates $r_{1,2}=(b\pm\theta)/(2\tau)$, $J=2000/(40000-\theta^2)$
    while $D=1000$ activation units squared per second. The lower bound $1/(2\tau^2J)$
    equals $D$ at $\theta=0$ and falls to 750 at $\theta=100$. Higher local information
    permits a lower diffusion bound but leaves the actual diffusion unchanged in this
    model. The plotted range stays inside the positive-rate domain $|\theta|<200$.
  accessibility_description: Across memory coordinates from minus one hundred sixty to
    one hundred sixty activation units, internal information has a minimum of 0.05 at
    zero and grows toward either side. Actual diffusion is a horizontal line at one thousand.
    The information lower bound meets it at zero and bends downward, reaching seven hundred
    fifty at coordinate one hundred. A marked gap separates actual diffusion from the
    bound there.
  teaching_introduction: The chapter’s two cell example makes the difference between a
    lower bound and the actual diffusion visible.
  interpretation: The gap at $\theta=100$ shows why a lower minimum allowed by the inequality
    is not a reduction in the network’s actual diffusion.
