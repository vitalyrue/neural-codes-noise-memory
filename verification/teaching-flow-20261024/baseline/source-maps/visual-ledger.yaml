- visual_id: fig:EYE-MSD-MEASUREMENT-OFFSET
  block_id: fig:EYE-MSD-MEASUREMENT-OFFSET
  asset: assets/approved/visuals/eye-msd-measurement-offset.png
  status: selected
  embedded: true
  sha256: 3b3d82f99e11d6bbc106e7d51e8a456778faf3fb3743e5e52e771229a1358328
  vector_source: assets/approved/visuals/eye-msd-measurement-offset.svg
  caption_and_alt: content/chapters/04-eye-drift.yaml
  caption: For positive lags, independent measurement error adds $2\sigma_m^2$ to the
    movement MSD, here $M(\ell)=2D\ell$. The isolated point at zero lag stays zero because
    each sample is subtracted from itself. At 20 ms, subtracting 0.0010 from 0.0014 deg²
    leaves 0.0004 deg²; the shown ±0.0001 deg² subtraction uncertainty is 25% of that
    remainder. Original analytic example, not experimental data, using Ben-Shushan et
    al. (2022), main p. 10, Eqs. 18–19.
  accessibility_description: Movement MSD rises linearly from zero. For all strictly positive
    lags, observed MSD is higher by 0.0010 degrees squared. The observed curve has an
    open endpoint at lag zero, above the actual zero-lag point at zero. At 20 milliseconds
    the observed and corrected values are 0.0014 and 0.0004 degrees squared, with a bracket
    showing the subtraction and an uncertainty bar on the corrected value.
  teaching_introduction: For a constructed Brownian movement with $D=0.010$ deg$^2$/s,
    adding independent position measurement errors with $2\sigma_m^2=0.0010$ deg$^2$ shifts
    every positive-lag MSD upward by the same amount.
  interpretation: The offset comes from two independent position errors, one at each endpoint.
    Its removal changes the average MSD; it does not recover each trajectory’s unknown
    error. The Brownian movement is chosen only to make the constant offset visible.
  source_status: Ben-Shushan et al. (2022), main p. 10 / PDF page 10, Removal of measurement
    noise, Eqs. 18–19; Chapter 4 EYE-MEASUREMENT-NOISE subtraction example. Brownian M=2Dℓ
    is the guide’s earlier diffusion model.
