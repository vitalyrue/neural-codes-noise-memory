- visual_id: fig:PLACE-SIZE-DENSITY-COLLAPSE
  block_id: fig:PLACE-SIZE-DENSITY-COLLAPSE
  asset: assets/approved/visuals/place-size-density-collapse.png
  status: selected
  embedded: true
  sha256: 58440786316e224e2d0d3005c2ac2b5c6d59dc702229e1872d23f38723bc480f
  vector_source: assets/approved/visuals/place-size-density-collapse.svg
  caption_and_alt: content/chapters/05-place-fields.yaml
  caption: 'The limiting size densities differ with spatial dimension: one dimensional
    length is Rayleigh, two dimensional area is exponential, and three dimensional volume
    has a density that rises without bound as size approaches zero, while its integral
    remains one. Their survival probabilities, the probabilities of exceeding a threshold,
    coincide after transformation to $U=\beta s^{2/d}$, where $\Pr(U>u)=e^{-u}$. These
    are exact calculations from the high-threshold limiting law, not finite-threshold
    simulations or measured histograms. Based on Mainali et al. (2025), main Eq. 1, p.
    1111, and Methods S3.'
  accessibility_description: Three density curves against dimensionless size w show the
    one dimensional curve starting at zero, the two dimensional curve starting at one,
    and the three dimensional curve rising without bound toward zero size. An arrow marks
    the unbounded end. In the second panel, three differently styled survival curves coincide
    on exp(-u) after U=w^(2/d).
  teaching_introduction: Writing dimensionless size as $w=\beta^{d/2}s$ removes the size
    scale. The dimensional size laws then differ in shape, while the transformed variable
    $U=\beta s^{2/d}=w^{2/d}$ has the same exponential law.
  interpretation: Removing units does not erase the difference between length, area, and
    volume distributions. The nonlinear transformation to U removes that shape difference;
    its shared exponential law is the assumption used in the change of variables.
  source_status: Mainali et al. (2025), main p. 1111 / PDF page 3, Eq. 1; supplement Methods
    S3, printed p. 12 / PDF page 13, high-threshold distributions and moment relation
    before S18. Chapter 5 PLACE-SIZE-LAW corrects the printed S18 mean-scale algebra.
