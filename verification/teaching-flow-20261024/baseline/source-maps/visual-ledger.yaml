    slopes plus two and minus one hertz per meter, crossing at ten hertz. Moving from
    zero to plus 0.1 meter raises the first rate by 0.2 hertz and lowers the second by
    0.1 hertz. The lower plot puts the paired rate changes on a downward sloping line
    through zero, with that example marked.
