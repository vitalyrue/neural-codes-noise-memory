schema_version: 3
book:
  title: 'Neural Codes, Noise, and Memory: A Guide to Three Papers'
  contributors: []
  front_matter:
  - ch:READING-GUIDE
  parts:
  - part_id: part:MECHANISMS
    title: Noise and persistent activity
    purpose: A stable population pattern can retain a continuous value while fluctuations
      move that value along its family of persistent states. These chapters establish
      the neural and probability background, derive the surviving motion, and connect
      it to limits on information and readout.
    chapters:
    - ch:FOUNDATIONS
    - ch:MEMORY-DYNAMICS
    - ch:MEMORY-INFORMATION
  - part_id: part:OBSERVATIONS
    title: Eye drift and spatial representations
    purpose: Neural fluctuations reach behavior through a motor pathway, while spatial
      tuning describes how a position is expressed across cells. The eye and place-field
      studies constrain these different relationships. The final chapter connects
      their results without treating a static map as a complete dynamical model.
    chapters:
    - ch:EYE-DRIFT
    - ch:PLACE-FIELDS
    - ch:SYNTHESIS
  appendices:
  - ch:GLOSSARY
  - ch:REFERENCES
