chapter_id: ch:MATHEMATICAL-TOOLS
part_id: part:MECHANISMS
title: Mathematical tools connect neural signals to the papers' predictions
purpose: 'Before Part I, explain the mathematical tools behind all three papers: feedback and Fisher information
  for memory; covariance and filtering for eye drift; Gaussian spatial maps, crossings and peak geometry for
  place fields. Keep physical meanings, assumptions and exact versus limiting results visible.'
role: frontmatter
page_break_before: true
pedagogical_prerequisites:
- ch:READING-GUIDE
explicit_render_dependencies: []
discovered_references: []
navigation_dependencies: []
section_list:
- id: sec:MATH-TOOLS-WEIGHTS
  title: Connection weights determine how neurons sustain activity
  summary: A single neural signal is brief, so retaining a value requires something to carry its effect forward.
    [A [**spike**]{.definition-term custom-style="Definition Term"} is a brief electrical event emitted by
    a neuron.]{.definition-explanation} [Its [**firing rate**]{.definition-term custom-style="Definition Term"}
    is the expected number of spikes per unit time.]{.definition-explanation} A rate gives an expectation;
    it does not specify an evenly spaced sequence of spikes.
  level: 2
- id: sec:MATH-TOOLS-FISHER
  title: Fisher information measures how clearly spikes distinguish nearby values
  summary: Suppose a circuit currently represents an angle near $30^\circ$. A receiving cell sees spikes rather
    than an angle label. If $30^\circ$ and $31^\circ$ produce almost identical probabilities of spike patterns,
    a short observation gives little evidence about which value is represented. If their spike probabilities
    differ strongly, the distinction is easier.
  level: 2
- id: sec:MATH-TOOLS-BOUND
  title: Information limits how slowly a neural memory can spread
  summary: The same uncertain spikes that tell a receiving cell about the value also renew activity inside
    the memory circuit. Synaptic effects fade, so the network must carry the value forward through those new
    events. This links the precision of the signals to the persistence of the memory.
  level: 2
- id: sec:MATH-TOOLS-SHARED
  title: Covariance tests which fluctuations are shared
  summary: If one neuron's spikes predict some eye movement, is the neuron passing on a common command or adding
    its own noise? Both can make its activity vary. Comparing the prediction with measured movement helps separate
    the part they share from fluctuations present in only one signal.
  level: 2
- id: sec:MATH-TOOLS-FILTERS
  title: Filtering changes how noise appears in eye motion
  summary: Muscles take time to respond to neural commands. Could their response turn rapidly changing noise
    into the smooth, continuing motion seen during fixation? The answer depends on whether the input merely
    fluctuates or accumulates changes.
  level: 2
- id: sec:MATH-TOOLS-RANDOM-FIELDS
  title: Random fields describe a fixed spatial map
  summary: Why does a cell stay active over a stretch of track, rather than change its response independently
    at every position? Mainali, Azeredo da Silveira, and Burak (2025) describe the cell's combined input as
    a spatial map $h(x)$. Nearby values depend on one another. A distribution of such maps can predict field
    sizes without predicting where a particular cell's fields will occur.[^tools-place-map]
  level: 2
- id: sec:MATH-TOOLS-CROSSINGS-PEAKS
  title: Crossings and peak geometry predict field counts and sizes
  summary: 'On a track, a field begins where the input crosses upward through threshold. [An [**upcrossing**]{.definition-term
    custom-style="Definition Term"} is a crossing of $z=q$ with positive spatial slope.]{.definition-explanation}
    The mean number per unit distance is the threshold density multiplied by the mean positive slope conditional
    on being at threshold:'
  level: 2
- id: sec:MATH-TOOLS-RESULTS
  title: Major results connect formulas to physical questions
  summary: A reference table links the major formulas from all three papers to their derivations, physical
    meanings and limits.
  level: 2
blocks:
- id: tbl:MATH-RESULTS
  kind: table
  placement: sec:MATH-TOOLS-RESULTS
  headers:
  - formula
  - derivation
  - decoding
  rows:
  - - '**2012 · Spike-driven feedback · model**<br>$ds_i=-s_i\,dt/\tau+dN_i$<br>$g_i=\sum_jW_{ij}s_j+b_i$<br>$r_i=\phi(g_i)$'
    - Each spike increases outgoing activation $s_i$ by one; the count process $N_i$ records these events.
      Between spikes, activation decays over time $\tau$. The fixed weight $W_{ij}$ sends cell $j$'s activation
      to receiver $i$; bias $b_i$ completes total input $g_i$. [Chapter 1; paper Eqs. 7–9](../chapters/ch-foundations.html#sec-memory-spikes).
    - The circuit stores a value through activity that renews itself. The weights determine who affects whom;
      they do not change during storage. The response $\phi$ converts input into firing rate, rather than directly
      into eye angle.
  - - '**2012 · Spike variability · model**<br>$K_i\mid\theta\sim\mathrm{Poisson}(\lambda_i)$<br>$\lambda_i=h\bar
      r_i(\theta)$<br>$\operatorname{Var}(K_i\mid\theta)=\lambda_i$'
    - Independent rare events in short subdivisions give the Poisson count law over a duration $h$. Its first
      two moments give equal count mean and variance. Here $\bar r_i$ is the steady tuning curve at value $\theta$.
      [Count derivation](../chapters/ch-foundations.html#sec-foundations-poisson).
    - Higher firing supplies more events and more absolute count noise. The elementary spike noise is independent
      across cells conditional on the current state; recurrent interactions can still correlate complete neural
      trajectories.
  - - '**2012 · Lasting displacement · central**<br>$K\mathbf u=0$<br>$\mathbf v^TK=0,\quad\mathbf v^T\mathbf
      u=1$<br>$2D(\theta)=\sum_i v_i^2\bar r_i$'
    - '$K$ is the matrix governing small activation disturbances, and $\mathbf u=\partial\bar{\mathbf s}/\partial\theta$
      follows the steady-state family. The left vector $\mathbf v$ removes the decaying part: a disturbance
      $\delta\mathbf s$ leaves shift $\mathbf v^T\delta\mathbf s$. Add independent projected spike variances.
      [Projection](../chapters/ch-memory-dynamics.html#sec-memory-linearization) and [diffusion; SI S14–S15](../chapters/ch-memory-dynamics.html#sec-memory-diffusion).'
    - $v_i$ measures the lasting change in the represented value caused by one activation change in cell $i$,
      after other disturbances relax. $D$ is half the local growth rate of displacement variance. This is a
      leading weak-noise result near a tuned continuous family with stable transverse directions.
  - - '**2012 · Symmetric connections · supporting**<br>$2D=\dfrac{\sum_i\bar r_i(g_i'')^2}{\tau^2(\sum_i\bar
      r_i'' g_i'')^2}$'
    - If $W_{ij}=W_{ji}$, differentiate the fixed-state equations to find $v_i\propto g_i'$, then normalize
      by $\mathbf v^T\mathbf u=1$. Primes mean derivatives with respect to memory value $\theta$. [Chapter
      3; corrected Eq. 2](../chapters/ch-memory-dynamics.html#sec-memory-symmetric).
    - For this special connectivity, tuning and input slopes determine diffusion without separately solving
      for $\mathbf v$. The numerator contains squared input slopes, as in the published correction. The general
      projection formula does not require symmetric weights.
  - - '**2012 · More than one stored coordinate · supporting**<br>$2D_{\alpha\beta}=\sum_i v_i^\alpha\bar r_i
      v_i^\beta$<br>$J_{\alpha\beta}=\sum_i(\partial_\alpha\bar r_i)(\partial_\beta\bar r_i)/\bar r_i$<br>$2D\succeq\tau^{-2}J^{-1}$'
    - Choose a tangent for each stored coordinate and left vectors satisfying $\sum_i v_i^\alpha u_i^\beta=\delta_{\alpha\beta}$.
      Project the same spike noise onto each pair of coordinates. [Diffusion tensor; SI S22–S24](../chapters/ch-memory-dynamics.html#sec-memory-diffusion).
      Applying the same normalization in matrix form gives the bound when the information matrix $J$ is invertible.
      [Matrix proof; SI S52–S56](../chapters/ch-memory-information.html#sec-memory-bound).
    - The diagonal entries give spreading in each coordinate. Off-diagonal entries give coupled changes in
      two stored coordinates, even when the elementary spike noises are independent. The weak-noise and local-state
      assumptions remain. The matrix inequality means every linear combination of coordinate changes obeys
      its variance bound, including coupled directions.
  - - '**2012 · Accumulated storage error · supporting**<br>$\partial_t p=\partial_\theta^2[D(\theta)p]$<br>$\operatorname{Var}[\theta(t)-\Theta]=2Dt$<br>$p(\theta,t)=\dfrac{e^{-(\theta-\Theta)^2/(4Dt)}}{\sqrt{4\pi
      Dt}}$'
    - Combine small Itô diffusion increments, with no systematic drift, into a probability evolution equation.
      The Gaussian and $2Dt$ formulas additionally require constant $D$, a point initial value $\Theta$ and
      an unbounded coordinate. [Chapter 4; SI Section III](../chapters/ch-memory-long-delays.html#sec-memory-long-time).
    - The remembered value spreads even while neural activity persists. With state-dependent $D$, variance
      instead grows at rate $2\mathbb E[D(\theta)]$. Boundaries, angular wrapping and systematic drift require
      their own treatment; a linear MSD need not continue forever. For constant angular diffusion on a circle,
      wrapped error eventually becomes uniform and its MSD tends to $\pi^2/3$ in radian-squared units; the
      plateau does not mean noise stopped.
  - - '**2012 · Spike precision · central**<br>$J(\theta)=\sum_i\dfrac{(\bar r_i'')^2}{\bar r_i}$<br>$I_h=hJ$<br>$\operatorname{Var}(\hat\theta)\ge1/(hJ)$'
    - Differentiate the log probability of independent Poisson counts with respect to $\theta$. The mean squared
      derivative is Fisher information $I_h$; independent terms add. Cauchy Schwarz applied to estimation error
      gives the variance bound for regular locally unbiased estimates. [Chapter 5; Eq. 3 and Cramér Rao derivation](../chapters/ch-memory-information.html#sec-memory-fi).
    - Steep tuning relative to spike noise makes nearby current values easier to distinguish. $J$ is information
      per second about the present state, not stored bits or certainty about the original cue. The state is
      effectively fixed during this short count calculation, and finite-sample attainment is not guaranteed.
  - - '**2012 · Information–diffusion bound · central**<br>$D\ge\dfrac{1}{2\tau^2J}$<br>$2DJ\tau^2\ge1$'
    - The normalization of the lasting-shift weights gives $\tau\sum_i v_i\bar r_i'=1$. Cauchy Schwarz bounds
      its square by $\tau^2(\sum_i v_i^2\bar r_i)(\sum_i(\bar r_i')^2/\bar r_i)$. [Chapter 5; Eq. 4 and SI
      Section V](../chapters/ch-memory-information.html#sec-memory-bound).
    - The same noisy spikes convey the value and renew the activity carrying it. At fixed $J$ and synaptic
      time $\tau$, tuning the network cannot reduce diffusion below this bound in the stated model. It assumes
      the tuned continuous family, weak independent conditional spike noise, a common decay time and no external
      anchoring signal.
  - - '**2012 · Attaining the bound · central**<br>$v_i=\bar r_i''/(\tau J\bar r_i)$<br>$\phi(g)=A e^{kg}\quad\text{is
      sufficient for }W=W^T$'
    - Equality in Cauchy Schwarz requires $v_i\sqrt{\bar r_i}$ to be proportional to $\bar r_i'/\sqrt{\bar
      r_i}$ for every contributing cell. In a symmetric network an exponential transfer rule supplies the required
      common ratio $\phi'/\phi$; $A>0$ and $k>0$ are constants. [Chapter 5, equality condition; SI S45–S51](../chapters/ch-memory-information.html#sec-memory-bound).
    - The retained effect of each cell's spike noise must match the information its spikes provide. Suitable
      symmetric exponential networks reach the lower bound under the same tuned-model assumptions. Exponential
      transfer is a sufficient class, not a general necessity; the guide gives a linear counterexample to the
      stronger source claim.
  - - '**2012 · Controlled changes of circuit parameters · supporting**<br>$J\propto N,\quad D\propto N^{-1}$<br>$J\mapsto
      cJ,\quad D\mapsto D/c$<br>$D\propto\tau^{-2}$'
    - Replicate a population of $N$ neurons with the same tuning distribution and weights scaled as $1/N$.
      Count the sums in the symmetric diffusion formula. A uniform rate multiplier $c>0$ also multiplies tuning
      slopes. For the time comparison, hold rate tuning and its input relation fixed. [Chapter 5, controlled
      comparisons](../chapters/ch-memory-information.html#sec-memory-comparisons).
    - More comparable neurons can reduce independent noise, and longer synaptic effects can reduce the lasting
      shift per spike. The stated rate-to-diffusion scaling needs an equality-achieving network or preserved
      tuning/input geometry. Changing rate or decay time without the corresponding circuit adjustment need
      not preserve the stored-state family.
  - - '**2012 · Tuning width depends on dimension · supporting**<br>$J_{\alpha\alpha}\propto\rho a w^{d-2}$<br>$D_{\alpha\alpha}\propto
      w^{2-d}\quad\text{at equality}$'
    - Use tuning $a f[(\boldsymbol\theta-\mathbf c)/w]$ with uniform preferred-value density $\rho$, fixed
      peak rate $a$, radial shape $f$ and width $w$. The information integral gains $w^d$ from recruited cells
      and $w^{-2}$ from squared slopes. [Chapter 5, width derivation](../chapters/ch-memory-information.html#sec-memory-comparisons).
    - Under these fixed resources, narrower tuning helps in one dimension and broader tuning helps in three;
      the leading width power vanishes in two. The diffusion statement additionally assumes an equality-achieving
      network. Holding total spike rate fixed would be a different comparison. This is the guide's reconstruction
      of the paper's width argument.
  - - '**2012 · Equal-weight readout · supporting**<br>$V_{\rm naive}(L)=\dfrac1{JL}+\dfrac{2DL}{3}$<br>$L_{\rm
      naive}^*=\sqrt{\dfrac3{2DJ}}$'
    - Average observations for duration $L$ after the readout cue. Count noise averages to $1/(JL)$; integrating
      Brownian covariance $2D\min(t,s)$ over the observation square gives $2DL/3$. Differentiate to find the
      optimum. [Chapter 6; SI S76–S81](../chapters/ch-memory-readout.html#sec-memory-naive).
    - Collecting more spikes first helps, then hurts because later spikes represent a state that has moved
      further from the cue state. $V$ is readout error variance under the local Gaussian observation model,
      with constant $D,J$ and separate state-motion and observation noise.
  - - '**2012 · Diffusion-aware readout · central**<br>$V_{\rm ideal}(L)=\sqrt{\dfrac{2D}{J}}\coth(\sqrt{2DJ}\,L)$<br>$V_{\rm
      ideal}(\infty)=\sqrt{2D/J}$<br>$L^*=1/\sqrt{2DJ}\le\tau$'
    - Combine observation precision backward in time while adding diffusion variance between observations.
      Precision $P$ obeys $dP/dL=J-2DP^2$, $P(0)=0$; solve and use $V=1/P$. [Chapter 6; SI S58–S75](../chapters/ch-memory-readout.html#sec-memory-ideal).
    - Accounting for motion makes more observation keep helping, toward a finite limit. $L^*$ is a characteristic
      saturation time, not a hard deadline. This is an ideal observer within the local Gaussian readout model;
      it does not show a biological decoder implementing the rule.
  - - '**2012 · Storage plus partial readout · supporting**<br>$V_{\rm recall}=2DT+V_{\rm readout}$<br>$J_{\rm
      obs}=\alpha J$<br>$L_{\rm obs}^*=L^*/\sqrt\alpha$<br>$V_{\rm ideal,obs}(\infty)=\sqrt{2D/(\alpha J)}$<br>$V_{\rm
      recall}(T,L)\ge2DT+\sqrt{2D/J}$'
    - Storage for delay $T$ adds independent error when readout is locally unbiased and future noise is independent
      of storage history. Independently retain each spike with probability $\alpha$; substitute the thinned
      rates into the FI formula. [Error addition](../chapters/ch-memory-readout.html#sec-memory-readout-setup)
      and [partial access; SI S82](../chapters/ch-memory-readout.html#sec-memory-partial).
    - Missing spikes reduces readout information while the full circuit keeps diffusing at the same $D$. Reading
      becomes slower and less precise. A selected fraction of neurons need not carry the same fraction of information;
      $\alpha J$ follows from random spike thinning or a verified information fraction. With full spike access,
      the ideal total-error limit is $2DT+\sqrt{2D/J}$; it equals $2D(T+\tau)$ only at equality in the information
      bound. [Why printed Eq. 6 needs this qualification](../chapters/ch-memory-readout.html#sec-memory-fig3-and-caution).
  - - '**2012 · A rate response time changes the bound · extension**<br>$\tau_m\dot r_i=-r_i+\phi(g_i)$<br>$D\ge\dfrac{1}{2(\tau+\tau_m)^2J}$'
    - Keep synaptic activation decay $\tau$ and add a firing-rate response time $\tau_m$. Linearize both sets
      of variables and normalize the left mode against their combined tangent. In the symmetric model the diffusion
      denominator gains $(\tau+\tau_m)^2$ in place of $\tau^2$. [Chapter 6; SI S84–S92](../chapters/ch-memory-readout.html#sec-memory-extensions).
    - Slower intrinsic rate response can also carry memory between spikes. The two times add for this specified
      two-stage model, with the same Poisson drive and stable transverse directions. Replacing $\tau$ by a
      sum of arbitrary biological response times is not justified.
  - - '**2012 · Noise law changes the equality condition · extension**<br>$J=\sum_i(\bar r_i'')^2/q_n$<br>$2D=q_n\sum_i
      v_i^2$<br>$2DJ\ge\tau^{-2}$'
    - Replace Poisson fluctuations by independent additive Gaussian noise with constant intensity $q_n>0$;
      a rate observation averaged for $h$ has noise variance $q_n/h$. Repeat the likelihood and projection
      calculations with this same noise law. [Chapter 6; SI S93–S95 with explicit normalization](../chapters/ch-memory-readout.html#sec-memory-extensions).
    - The information–diffusion relation survives this matched noise model, but equality now needs $v_i\propto\bar
      r_i'$. In the symmetric model a linear transfer rule is sufficient. An optimal transfer rule therefore
      depends on how neurons fluctuate. The noise intensity $q_n$ is unrelated to the place-field threshold
      $q$.
  - - '**2022 · From spikes to eye position · method**<br>$m\ddot x+r\dot x+kx=f$<br>$h_0(u)=\dfrac{\tau_+\tau_-}{m(\tau_+-\tau_-)}(e^{-u/\tau_+}-e^{-u/\tau_-}),\
      u>0$<br>$\widehat E(t)=E_T+\sum_j h(t-t_j)$'
    - Invert the fitted rate–movement equation for $x=E-E_T$. Factor $mp^2+rp+k=m(p+1/\tau_+)(p+1/\tau_-)$;
      each root supplies a decay. Set $h_0=0$ for $u<0$ and restore the fitted delay by $h(u)=h_0(u-\Delta
      t)$. [Chapter 7; Eqs. 2–7](../chapters/ch-eye-drift.html#sec-eye-inverse-filter).
    - Each recorded spike at $t_j$ contributes a calibrated position response in degrees. Coefficients $k,r,m$
      couple firing to position, velocity and acceleration; $r$ here is not a firing rate. The two distinct
      positive decay times describe the fitted response. This predicts movement from one cell, rather than
      claiming that one cell controls the eye by itself.
  - - '**2022 · Independent-noise limit · supporting**<br>$\sum_{i=1}^{N_m}R_i^2\le1$<br>$\langle R_i^2\rangle\le1/N_m$'
    - Standardize independent single-cell predictors and measured displacement. Subtract their best linear
      prediction; its residual variance $1-\sum_iR_i^2$ cannot be negative. Here $R_i$ is the displacement
      correlation and $N_m$ is motor population size. [Chapter 7; SI S1–S2](../chapters/ch-eye-drift.html#sec-eye-shared-variance).
    - If independent motor fluctuations alone supplied the movement, the average cell could explain only a
      small fraction of its variance. The measured mean correlation gives $\langle R^2\rangle\ge0.17^2\simeq0.029$,
      challenging that explanation for a population of thousands. Applying the bound to sampled cells requires
      a representative average.
  - - '**2022 · Shared movement fraction · central**<br>$X=C+\epsilon,\quad Y=C+\eta$<br>$\chi\simeq\dfrac{\operatorname{Cov}(X,Y)}{\operatorname{Var}(Y)}$<br>$\chi\simeq
      R\sqrt{\operatorname{Var}(X)/\operatorname{Var}(Y)}$'
    - '$X$ is spike-predicted displacement and $Y$ is measured displacement, both calibrated in degrees. Expand
      their covariance: it retains the shared component variance $\operatorname{Var}(C)$ when the other covariances
      are negligible. [Chapter 7; Eqs. 11–15](../chapters/ch-eye-drift.html#sec-eye-chi).'
    - Weak single-cell correlation can coexist with a large common contribution to movement. The paper reports
      $\widehat\chi=0.82\pm0.07$ at 350 ms. This requires transferable gain calibration and nearly uncorrelated
      private contributions; the recorded cell creates a neglected order-$1/N_m$ covariance. Locating the shared
      source upstream also uses the biological independence premise.
  - - '**2022 · Measurement offset · method**<br>$M_{\rm obs}(\ell)=M(\ell)+2\sigma_m^2,\quad\ell>0$'
    - For measured position $E_{\rm obs}=E+\nu$, expand its squared displacement. Independent errors at the
      two times each contribute variance $\sigma_m^2$; movement–error cross terms vanish. $M(\ell)=\mathbb
      E[(E(t+\ell)-E(t))^2]$. [Chapter 8; Eqs. 18–19](../chapters/ch-eye-timing.html#sec-eye-measurement-noise).
    - Independent position-reading error raises every positive-lag MSD by a constant, which can dominate the
      smallest movements. At zero lag it cancels exactly. Temporally correlated measurement error needs a lag-dependent
      correction instead.
  - - '**2022 · Filtered white noise · supporting**<br>$C_E(\ell)=A\int_0^\infty h(u)h(u+\ell)\,du$<br>$M(\ell)=2[C_E(0)-C_E(\ell)]$'
    - Convolve white input of intensity $A$ with a stable response $h$, then average the product at two times.
      For a centered stationary position, expand the squared displacement. [Chapter 8; Eqs. 20–22](../chapters/ch-eye-timing.html#sec-eye-filtered-msd).
    - If filter overlap decays to zero, MSD tends to the finite plateau $2C_E(0)$. Muscle filtering can smooth
      private motor noise, but cannot make this stationary position noise accumulate displacement variance
      indefinitely. Eye MSD instead keeps growing over the observed range.
  - - '**2022 · Filtered accumulating command · guide derivation**<br>$\tau_f\dot E+E=B,\quad dB=\sqrt{2D}\,dW$<br>$M(\ell)=2D[\ell-\tau_f(1-e^{-\ell/\tau_f})]$<br>$M\sim
      D\ell^2/\tau_f\ (\ell\ll\tau_f)$<br>$M\sim2D(\ell-\tau_f)\ (\ell\gg\tau_f)$'
    - A Brownian position command $B$ drives a one-time-constant eye response $\tau_f$. After velocity transients,
      $C_v(s)=(D/\tau_f)e^{-|s|/\tau_f}$. Integrate it as $M=2\int_0^\ell(\ell-s)C_v(s)\,ds$. [Chapter 8, teaching
      reconstruction](../chapters/ch-eye-timing.html#sec-eye-filtered-msd).
    - The eye can move smoothly while its internal position command diffuses. Increasing $\tau_f$ reduces short-lag
      motion; increasing $D$ raises the entire curve. The synaptic time $\tau$ from 2012 is a different parameter.
      This simplified calculation illustrates the 2022 interpretation; the paper uses two muscle times and
      feedback, and does not uniquely identify the circuit.
  - - '**2022 · Firing variability and sensitivity set a noise scale · supporting estimate**<br>$J\simeq Na^2/\lambda_0$<br>$D\propto\dfrac{\mathrm{CV}^2\lambda_0}{Na^2\tau_s^2}=\dfrac{\mathrm{CV}^2}{N\lambda_0
      b^2\tau_s^2}$'
    - In a comparable population of $N$ cells, write mean firing $\lambda_0$, absolute position slope $a=d\lambda/dE$
      and fractional slope $b=a/\lambda_0$. Long-window renewal count variance supplies the squared interval
      coefficient of variation, $\mathrm{CV}^2$; project that noise with fixed network geometry. [Chapter 9,
      scale estimate and Eq. 1 comparison](../chapters/ch-eye-circuit.html#sec-eye-scaling).
    - Within this estimate, more regular spikes, more comparable cells or longer synaptic decay $\tau_s$ reduce
      diffusion. Increasing rate helps at fixed fractional slope but raises the scale at fixed absolute slope.
      The paper's Eq. 1 leaves slope normalization unclear. This simpler Poisson-based scale comparison is
      not an exact formula for its full saturating, sub-Poisson network.
  - - '**2025 · Active spatial regions · model**<br>$z=(h-\mu)/\sigma_0$<br>$q=(h_{\rm th}-\mu)/\sigma_0$<br>$F=a[z-q]_+$<br>$\ell_c=\sqrt{-C(0)/C''''(0)}$'
    - Normalize a stationary Gaussian input map $h$ with mean $\mu$, standard deviation $\sigma_0$ and covariance
      $C$. Threshold at $q$; gain $a$ converts excess into firing. Differentiating covariance gives $\operatorname{Var}(z')=\ell_c^{-2}$.
      [Chapter 10; model and spatial scale](../chapters/ch-place-fields.html#sec-place-gp).
    - A field is one connected region where $z>q$. The sampled map stays fixed during traversal. Raising threshold
      removes active space; increasing $\ell_c$ stretches the local spatial scale. Here $\ell_c$ is the distance
      scale called $\sigma$ in later place chapters, not input standard deviation $\sigma_0$.
  - - '**2025 · Random inputs create spatial covariance · supporting**<br>$h(x)=\sum_i W_i u_i(x)$<br>$C(x,y)=v_W\sum_i
      u_i(x)u_i(y)$'
    - Use fixed input profiles $u_i(x)$ and independent random weights with mean zero and variance $v_W$. Average
      over weight choices; cross terms vanish. Many individually small contributions permit a Gaussian limit.
      [Chapter 12; Methods S2](../chapters/ch-place-tests.html#sec-place-wiring).
    - The same input cell contributes at nearby positions, creating spatial covariance. Broader input profiles
      can broaden fields; changing weight variance instead changes input amplitude and hence effective threshold
      if the absolute threshold stays fixed. Random weights alone do not guarantee smooth, stationary or isotropic
      maps.
  - - '**2025 · Crossing density and finite-track count · exact**<br>$\nu_+(q)=\dfrac{e^{-q^2/2}}{2\pi\ell_c}$<br>$\mathbb
      E[N_L]=L\nu_+(q)+Q(q)$'
    - Kac–Rice multiplies height density at $q$ by mean positive part of the spatial slope there. Stationary
      Gaussian height and slope are independent. Add $Q(q)=\Pr(Z>q)$, $Z\sim N(0,1)$, for a field already active
      at the left end of a track of length $L$. [Chapter 10; S9–S13 and main Eq. 8](../chapters/ch-place-fields.html#sec-place-kac-rice).
    - This counts active components intersecting the track, including clipped boundary fields. It is exact
      for a sufficiently smooth stationary nondegenerate Gaussian map at any threshold. Higher $q$ reduces
      counts when $q>0$; larger $\ell_c$ reduces crossings per unit length at fixed $q$.
  - - '**2025 · Means identify threshold and scale · exact**<br>$\mu_s=Q(q)/\nu_+$<br>$\mu_g=[1-Q(q)]/\nu_+$<br>$q=Q^{-1}\!\left(\dfrac{\mu_s}{\mu_s+\mu_g}\right)$<br>$\ell_c=\dfrac{\mu_s+\mu_g}{2\pi}e^{-q^2/2}$'
    - Divide active and inactive spatial fractions by the same upcrossing density to obtain mean field length
      $\mu_s$ and gap length $\mu_g$. The ratio $\mu_s/(\mu_s+\mu_g)$ gives active fraction; invert the Gaussian
      upper tail and crossing scale. [Chapter 10; Methods S3](../chapters/ch-place-fields.html#sec-place-inference).
    - Two measured means constrain two model parameters before testing the full length histograms. These are
      stationary complete-field and complete-gap means. Finite-track clipping or selection of only cells with
      fields must be handled before treating sample means as these quantities.
  - - '**2025 · Rare field locations and gaps · limiting approximation**<br>$N_L\approx\mathrm{Poisson}(\nu_+L)$<br>$\Pr(G>g)\simeq
      e^{-\nu_+g}$<br>$\mathbb E[N\mid N\ge1]=\lambda/(1-e^{-\lambda})$'
    - At high threshold, well-separated rare excursions can approach independent locations if spatial correlations
      decay sufficiently. Their spacing is then approximately exponential, and short field widths make gaps
      $G$ approach the same scale. Conditioning a Poisson count with mean $\lambda$ on at least one field gives
      the last expression. [Chapter 10, rare events and selection; main Eq. 5](../chapters/ch-place-fields.html#sec-place-inference).
    - The model predicts whole count and gap distributions beyond their means. Smoothness and stationarity
      alone do not imply independence. The bulk count omits finite-track boundary effects; excluding zero-field
      cells also raises the observed mean and must be accounted for in fitting.
  - - '**2025 · Universal size laws · central approximation**<br>$\Pr(s>S)\simeq e^{-\beta S^{2/d}}$<br>$\beta=\dfrac{q^2}{2\ell_c^2v_d^{2/d}}$<br>$(v_1,v_2,v_3)=(2,\pi,4\pi/3)$'
    - 'For a smooth stationary isotropic Gaussian map at large positive $q$, a typical counted field surrounds
      one nearly quadratic peak: radius $r_*\simeq\ell_c\sqrt{2\epsilon/q}$ for peak excess $\epsilon$. The
      scaled excess $q\epsilon$ tends to a unit-mean exponential law. Substitute size $s=v_dr_*^d$. [Chapter
      11; Eq. 1, Methods S4 and corrected constants](../chapters/ch-place-sizes.html#sec-place-size-law).'
    - The same input mechanism gives Rayleigh lengths in 1D, exponential areas in 2D and a Weibull volume law
      with exponent $2/3$ in 3D. Each field has equal sampling weight. These are high-threshold limits; multi-peak
      fields and finite thresholds can change the distribution.
  - - '**2025 · Peak firing and field size · supporting approximation**<br>$F_{\max}=a\epsilon$<br>$F_{\max}\simeq\dfrac{aq}{2\ell_c^2}(s/v_d)^{2/d}$'
    - 'Use the same high-peak parabola: $\epsilon\simeq q r_*^2/(2\ell_c^2)$ and $s=v_dr_*^d$. Firing above
      threshold is $a\epsilon$ at the peak. [Chapter 11; Methods S4, Figs. 3 and 5](../chapters/ch-place-sizes.html#sec-place-rare-peaks).'
    - Higher peaks create wider fields, with limiting exponent two against linear size $s^{1/d}$. The exponent
      against area or volume differs. Finite-threshold data and simulations have smaller fitted exponents,
      so the limiting square law is not an exact empirical relation.
  - - '**2025 · Size moments and shape · supporting approximation**<br>$\mathbb E[s^k]\simeq\Gamma(1+kd/2)\beta^{-kd/2}$<br>$\mu_s\simeq\Gamma(1+d/2)\beta^{-d/2}$'
    - Differentiate the size survival law to obtain its density; set $u=\beta s^{2/d}$ in the moment integral.
      Here $k\ge0$ and $\Gamma$ is the gamma function, defined by its integral in the linked derivation. [Chapter
      11, size-law moments](../chapters/ch-place-sizes.html#sec-place-size-law).
    - After the mean fixes size scale, higher moment ratios test the predicted shape. No extra shape fit is
      needed in the limiting law. These moments inherit its high-threshold assumption and describe complete
      fields rather than fields selected by occupied volume.
  - - '**2025 · Slices retain Gaussian structure · central test**<br>$h_{\rm line}(t)=h(x_0+t\mathbf e)$<br>$C_{\rm
      line}(t,t'')=C[(t-t'')\mathbf e]$'
    - Restrict a jointly Gaussian map to points on a line with unit direction $\mathbf e$, or to a plane. The
      retained joint distributions remain Gaussian with the restricted covariance. Under isotropy they retain
      the local scale $\ell_c$. [Chapter 11; Fig. 2 and Fig. S2](../chapters/ch-place-sizes.html#sec-place-slices).
    - At high threshold, line-slice lengths approach a Rayleigh law and plane-slice areas an exponential law,
      even within a 3D map. Slice components have different sampling weights from complete fields; larger objects
      are more likely to be intersected. A chosen central cut through each field is a different sampling rule.
  - - '**2025 · Boundary slopes · exact**<br>$p_{\uparrow}(v)=\ell_c^2v\,e^{-\ell_c^2v^2/2},\quad v>0$'
    - Select an upcrossing rather than a uniformly chosen position. Its slope density is proportional to $v
      p_{z'}(v)$; normalize over positive slopes. Here $v=z'$ is the normalized input slope at a boundary.
      [Chapter 11; boundary-slope derivation](../chapters/ch-place-sizes.html#sec-place-slopes).
    - Steep slopes are sampled more often at crossings. This Rayleigh law is independent of $q$ under the smooth
      stationary Gaussian model, without a high-threshold approximation. Firing-rate slope is $av$, so its
      scale also depends on the rate gain $a$.
  - - '**2025 · Components and holes · exact**<br>$\eta_1=\dfrac{e^{-q^2/2}}{2\pi\ell_c}$<br>$\eta_2=\dfrac{qe^{-q^2/2}}{(2\pi)^{3/2}\ell_c^2}$<br>$\eta_3=\dfrac{(q^2-1)e^{-q^2/2}}{(2\pi)^2\ell_c^3}$<br>$\mathbb
      E[\chi_d]=Q(q)+\sum_{j=1}^d\binom dj L^j\eta_j$'
    - 'Count spatial critical points with signs: maxima create components, while other critical points join
      regions or alter holes. The signed Kac–Rice calculation gives $\eta_j$; faces and edges supply the coefficients
      for a closed box of side $L$, in $d=1,2,3$. [Chapter 12; Eqs. 8–10](../chapters/ch-place-tests.html#sec-place-topology).'
    - Here $\chi_d$ is Euler characteristic, unrelated to the eye variance fraction $\chi$. It counts components
      minus holes in 2D, and components minus tunnels plus cavities in 3D. These formulas retain boundary contributions
      for a smooth stationary isotropic nondegenerate Gaussian map; they are not periodic-box formulas or general
      field counts.
  - - '**2025 · Rare-field count in higher dimensions · supporting approximation**<br>$\mathbb E[N]\simeq\dfrac{Vq^{d-1}e^{-q^2/2}}{(2\pi)^{(d+1)/2}\ell_c^d}$'
    - At high $q$, isolated components usually have one peak and no holes, so their count approaches Euler
      characteristic. Retain the leading volume term and leading power of $q$ in the preceding formula; $V$
      is environment length, area or volume. [Chapter 12, high-threshold count](../chapters/ch-place-tests.html#sec-place-topology).
    - This predicts how field count changes with threshold, spatial scale and dimension in a large region at
      high threshold. It drops boundary terms and holes; the exact Euler-characteristic formula must not be
      used as an exact component count at ordinary thresholds.
