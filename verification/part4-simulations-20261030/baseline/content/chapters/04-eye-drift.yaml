chapter_id: ch:EYE-DRIFT
part_id: part:OBSERVATIONS
title: Eye drift points to a shared neural drive
purpose: Even when a monkey looks at a stationary spot, its eyes drift slightly. This chapter explains how paired
  measurements of eye angle and the firing of neurons that command eye muscles support a shared neural source of
  that drift, before considering a particular circuit mechanism.
role: chapter
page_break_before: true
pedagogical_prerequisites:
- ch:PERSISTENCE
- ch:MEMORY-DYNAMICS
