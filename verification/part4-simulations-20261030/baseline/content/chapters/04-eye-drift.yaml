section_list:
- id: sec:EYE-PATHWAY
  title: From stored eye position to muscle action
  summary: 'The eye needs an ongoing command to maintain a position. A brief command to move is therefore insufficient:
    after the movement, a circuit must maintain activity representing the new position. The [**oculomotor integrator**]{.definition-term
    custom-style="Definition Term"} is the neural circuit that performs this storage. “Integrator” refers to turning
    a movement command into a lasting position signal. In the proposed mechanism, the continuous attractor described
    in the [foundations](ch-persistence.html#sec-foundations-attractor) and [network model](ch-memory-dynamics.html#sec-memory-spikes)
    stores horizontal eye position. Noise moves the stored value along that attractor.[^p2-pathway]'
  level: 2
- id: sec:EYE-RECORDINGS
  title: The recordings pair one motor neuron with movement at a time
  summary: "The authors reanalyzed earlier experiments in two male rhesus macaques. With their heads held still, the monkeys first looked at a stationary spot of light on a monitor and then followed the moving spot. A wire search coil on one eye measured the eye's angle while an electrode recorded one neuron's spikes. There were 57 identified OMNs. Each recording paired one OMN with eye movement. There were no simultaneous recordings of multiple OMNs. Thus the analysis cannot directly measure the covariance between two recorded motor neurons.[^p2-recordings][^p2-single]"
  level: 2
- id: sec:EYE-FORWARD-FIT
  title: A fitted model links movement to firing rate
  summary: Position alone does not predict a motor neuron's activity during a movement. At the same position, firing
    can differ when the eye is moving or accelerating. The paper therefore fits
  level: 2
- id: sec:EYE-INVERSE-FILTER
  title: A calibrated filter predicts eye position from one cell's spikes
  summary: 'To ask how much eye movement is shared with a neuron, it helps to express both signals in degrees. The
    paper reverses the fitted relationship: a cell''s spike train becomes the input, and its prediction of eye position
    becomes the output. This operation is an inverse of the movement-to-rate fit, rather than a new fit to small
    drift residuals.'
  level: 2
- id: sec:EYE-SHARED-VARIANCE
  title: The measured correlation challenges independent motor noise alone
  summary: 'A correlation of 0.17 does not immediately tell us how much motion comes from the common command. First
    we can ask a more limited question: could all the motion come from independent motor neuron fluctuations?'
  level: 2
- id: sec:EYE-CHI
  title: Calibrated covariance estimates the common share of movement variance
  summary: "The variance bound establishes that a shared signal exists, but leaves its size open. The next calculation uses the inverse filter’s calibrated gain in degrees. For one 350 ms interval, write the measured displacement and the single cell prediction as"
  level: 2
