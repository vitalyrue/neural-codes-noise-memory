- id: fig:EYE-PHYSICAL-AND-RECORDED
  kind: figure
  placement: sec:EYE-RECORDINGS
  asset: assets/approved/visuals/eye-physical-and-recorded.png
  caption: The recordings pair one motor neuron with eye movement. Private spike variability acts at individual
    cells, downstream physical variability acts on movement, and measurement noise enters the eye-position record.
    The attractor storage source is proposed; the dashed analysis path is a calculation from one cell through its
    calibrated filter. Original guide schematic based on Ben-Shushan et al. (2022), Figs. 1–2 and 4–5. Signal symbols
    are illustrative, not experimental traces.
  alt: A proposed attractor storage circuit sends shared drive to a motor neuron population, then through muscles
    and eye mechanics to physical eye position. Private variability enters one neuron; downstream physical variability
    enters the muscles. Only the highlighted neuron is recorded, paired with eye position. Measurement noise enters
    that recorded position, not the physical eye. A separate dashed calculation transforms the single-cell spikes
    through a calibrated filter into predicted eye position.
  width_inches: 7.29167
  html_fold: never
- id: fig:EYE-SHARED-PRIVATE-VARIANCE
  kind: figure
  placement: sec:EYE-CHI
  asset: assets/approved/visuals/eye-shared-private-variance.png
  caption: The same common variance enters movement and the single cell predictor, but the predictor has much more
    private noise. Increasing only private predictor variance lowers correlation R while the common movement fraction
    χ stays at 0.82. The marked point uses the chapter’s constructed example. Calculations assume unit common gain
    and mutually uncorrelated contributions; they are not recorded cell data. Based on Ben-Shushan et al. (2022),
    main p. 10, Eqs. 11–15.
  alt: 'Horizontal stacked bars use one variance axis in degrees squared: movement has common variance 0.00820 and
    other variance 0.00180; the single cell prediction has the same common variance and private variance 0.22446.
    A curve shows R falling as private predictor variance increases, reaching 0.170 at the constructed point, while
    χ remains 0.820.'
  width_inches: 7.29167
  html_fold: never
