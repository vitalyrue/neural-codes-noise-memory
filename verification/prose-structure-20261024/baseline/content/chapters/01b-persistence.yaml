section_list:
- id: sec:FOUNDATIONS-ATTRACTOR
  title: Stable activity with a vulnerable stored value
  summary: A circuit's current activities are its [**state**]{.definition-term custom-style="Definition
    Term"}. A dynamical equation specifies how that state changes. A [**fixed point**]{.definition-term
    custom-style="Definition Term"} is a state where the deterministic rate of change is zero.
    It is stable in a direction if a small disturbance in that direction decays.
  level: 2
- id: sec:FOUNDATIONS-DIFFUSION
  title: Independent steps with equal duration and variance give linear variance growth
  summary: If persistent angular changes arrive repeatedly, their errors accumulate. Divide
    time into intervals of length $\Delta t$. Let $\xi_j$ be the change in the represented
    coordinate during interval $j$. Assume independent increments with mean zero and variance
    $2D\Delta t$, where $D$ has units coordinate squared per time. After $n$ intervals,
  level: 2
- id: sec:FOUNDATIONS-RANDOMNESS
  title: A fixed spatial map differs from a value that wanders over time
  summary: The memory and eye papers study fluctuations that accumulate as time passes. The
    place-field paper instead starts with a random function of physical position. Once drawn
    for a cell and an environment, that function is fixed while the animal moves through the
    map. Revisiting a place evaluates the same expected-rate function, although the actual
    spikes can still vary from visit to visit.
  level: 2
