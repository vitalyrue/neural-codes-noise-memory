section_list:
- id: sec:MEMORY-READOUT-SETUP
  title: Storage loss and readout error add under specific assumptions
  summary: '**Neural question and model.** At time $T$, a recall cue arrives. The observer now wants the
    original value $\Theta$, but only has access to future spikes. The network has already diffused during
    storage. Even perfect knowledge of the state $\theta(T)$ cannot recover its particular earlier random
    displacements.'
  level: 2
- id: sec:MEMORY-NAIVE
  title: Equal weighting becomes harmful when observation lasts too long
  summary: '**Neural question and model.** A decoder designed for a stationary state averages its observations
    with equal weight. That reduces independent observation noise, but late observations reflect a state
    that has moved further from $x$.'
  level: 2
- id: sec:MEMORY-IDEAL
  title: Accounting for diffusion makes readout improve toward a limit
  summary: '**Neural question and model.** An observer that accounts for diffusion can use later observations
    without confusing them with direct measurements of $x$. Their value is limited by the motion separating
    them from $x$. This is an ideal inference rule for an observer; the readout calculation does not demonstrate
    a neural circuit implementing it. Its error can be derived by combining information backward from
    the end of the observation interval.'
  level: 2
- id: sec:MEMORY-PARTIAL
  title: Limited access can make observation slower
  summary: '**Neural mechanism.** A downstream area may receive only some of the memory network''s spikes.
    That reduces its information without reducing the fluctuations that already move the full memory network.'
  level: 2
- id: sec:MEMORY-EXTENSIONS
  title: Time scales and noise laws change the bound and its equality condition
  summary: '**Neural mechanism.** The time constant in the inequality comes from the dynamics that carry
    an activation fluctuation into a lasting memory change. If both synaptic activation and firing rate
    adjust gradually, which time constant matters?'
  level: 2
- id: sec:MEMORY-FIG3-AND-CAUTION
  title: Readout saturates, and one printed error bound needs qualification
  summary: 'Figure 3 isolates readout uncertainty, rescaling variance by $\sqrt{2D/J}$ and duration by
    $L^*$. In these axes the ideal curve is $\coth z$ and the naive curve is $z/3+1/z$. Both diverge like
    $1/z$ at short durations because too few spikes are available. The plotted features are:'
  level: 2
