- id: fig:MEMORY-READOUT-TIMELINE
  kind: figure
  placement: sec:MEMORY-READOUT-SETUP
  asset: assets/approved/visuals/memory-readout-timeline.png
  caption: Original guide construction of storage and cue state readout, based on Burak and Fiete (2012),
    Supporting Text, p. 12, Eq. S57. The illustrated path is one possible construction, and the orange
    estimate concerns the state at the cue rather than the state at the end of observation. With the conditions
    shown, storage and readout variances add because their cross covariance is zero.
  alt: The stored value starts at Theta at encoding time zero and wanders until the recall cue at T. Its
    cue value is x. Later spikes, collected through T plus L, give an estimate x hat of that cue state.
    Storage error is x minus Theta; readout error is x hat minus x. The estimate is drawn separately from
    the path endpoint. Under the listed independence, unbiasedness and translation assumptions, total
    variance is two D T plus readout variance.
  width_inches: 7.29167
  html_fold: never
- id: fig:MEMORY-READOUT-CURVES
  kind: figure
  placement: sec:MEMORY-FIG3-AND-CAUTION
  asset: assets/approved/visuals/memory-readout-curves.png
  caption: Original guide construction from the analytic readout formulas in Burak and Fiete (2012), Fig.
    3 and Supporting Text, Eqs. S75 and S79–S81, rather than digitized data. Ideal readout approaches
    a normalized variance of one; simple averaging reaches $2/\sqrt3$ at $z=\sqrt3$ and then worsens.
    These curves contain no storage variance $2DT$.
  alt: Readout variance divided by square root of two D over J is plotted against z equals L times square
    root of two D J. Both curves diverge as z approaches zero. Ideal readout coth z falls toward one.
    Simple averaging z over three plus one over z reaches its minimum at square root of three, two over
    square root of three, and then rises. The storage variance is absent.
  width_inches: 7.29167
