chapter_id: ch:EYE-CIRCUIT
part_id: part:OBSERVATIONS
title: A noisy memory circuit can produce eye drift
purpose: A circuit that stores the intended eye angle is one possible source of fixational drift. This chapter follows
  the proposed model from interacting neurons through motor neurons and muscles to eye motion, and explains how
  delayed visual feedback can limit that motion.
role: chapter
page_break_before: true
