chapter_id: ch:PLACE-FIELDS
part_id: part:OBSERVATIONS
title: Field counts and gaps reveal threshold and scale
purpose: Hippocampal place cells fire more at particular locations as an animal moves. This chapter introduces the
  rodent and bat recordings, then shows how a smooth random input that exceeds a firing threshold can produce several
  separate active regions for one cell.
role: chapter
