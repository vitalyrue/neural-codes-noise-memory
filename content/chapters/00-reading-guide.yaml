- id: tbl:READING-EVIDENCE
  kind: table
  placement: sec:READING-SCOPE
  headers:
  - Step in the evidence
  - Burak and Fiete (2012)
  - Ben-Shushan et al. (2022)
  - Mainali et al. (2025)
  rows:
  - - Physical system and question
    - A proposed neural circuit maintaining a continuous value after a cue ends. How quickly does its accuracy deteriorate?
    - Motor-neuron activity and eye motion during macaque fixation. Where does the shared motion originate?
    - Place-cell responses in rodent and bat environments. Why do field sizes and shapes vary?
  - - Actors, variables, and interactions
    - Fixed neural connections turn outgoing spike effects into new firing rates. Spikes renew activation and disturb
      the represented value. [Connection-matrix explanation](ch-mathematical-tools.html#sec-math-tools-weights).
    - Two neural populations produce command $E_{\mathrm{OI}}$. Motor spikes, muscles, and delayed feedback connect
      it to actual eye angle $E$. The two angles are different signals.
    - Cell $i$ receives smooth Gaussian input $h_i(\mathbf x)$ at position $\mathbf x$. Activity occurs above a
      threshold; the spatial map is fixed during analysis.
  - - Derived prediction
    - Spike fluctuations produce memory diffusion. An information bound limits stability under the model assumptions.
    - Shared and private fluctuations imply displacement-covariance relations. Filtering a diffusing command predicts
      the time dependence of eye motion.
    - Covariance, threshold, and dimension determine field statistics, with exact results and high-threshold approximations
      kept separate.
  - - Simulation comparison
    - Stochastic ring and two-population networks test theoretical memory diffusion. These are model tests, not
      animal-data validation.
    - A noisy integrator and motor pathway test whether the proposed mechanism can produce the observed motion and
      analysis results.
    - Generated spatial maps test analytical approximations and provide finite-threshold comparisons with recorded
      field statistics.
  - - Empirical comparison
    - This study does not directly test the bound against animal recordings.
    - Paired single-neuron and eye recordings support a substantial shared source upstream of the final motor neurons,
      under the inference assumptions.
    - Existing rodent and bat recordings test field sizes, arrangements, shapes, and connectedness. Parameters fitted
      to summaries remain distinct from additional comparisons.
  - - What remains unknown
    - Whether a biological memory circuit meets the assumptions or approaches the bound.
    - Whether the shared source is specifically the modeled integrator. A successful model does not uniquely locate
      it.
    - Which connections, learning rules, and dynamics generate the spatial inputs. A statistical fit does not establish
      a memory circuit.
  caption: Guide-derived map of the three source papers' evidence. Each column follows a separate study; the table
    does not claim a jointly tested circuit.
  first_column_role: row-labels
  html_fold: never
