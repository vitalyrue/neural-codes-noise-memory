chapter_id: ch:MATHEMATICAL-TOOLS
part_id: part:MECHANISMS
title: Mathematical tools connect neural signals to the papers' predictions
purpose: 'Before Part I, explain the mathematical tools behind all three papers: feedback and Fisher information
  for memory; covariance and filtering for eye drift; Gaussian spatial maps, crossings and peak geometry for
  place fields. Keep physical meanings, assumptions and exact versus limiting results visible.'
