section_list:
- id: sec:MEMORY-WEAK-NOISE
  title: Many weak inputs allow a continuous approximation to spike noise
  summary: Starting from the model taught in Chapter 1, conditional Poisson counts yield a mean input
    and a fluctuation. Small input fluctuations permit a continuous Gaussian approximation and define
    the deterministic steady states.
  level: 2
- id: sec:MEMORY-LINEARIZATION
  title: The network's return flow determines the lasting memory change
  summary: '**Neural mechanism.** A spike perturbs many aspects of a network''s state. Most of those changes
    decay as the state returns to the attractor. To calculate memory loss, we need the lasting change:
    the displacement to a different fixed point. We assume a smooth continuous family with one neutral
    memory direction, while all other local modes decay. The disturbance must be small enough that the
    first order response describes the return flow.'
  level: 2
- id: sec:MEMORY-DIFFUSION
  title: Projecting spike fluctuations gives the diffusion coefficient
  summary: '**Neural mechanism.** We can now calculate how much random displacement remains after the
    stable components have relaxed. Each cell''s random spikes disturb its outgoing synaptic activation.
    The circuit''s return flow determines the lasting shift in memory. This calculation uses the weak
    noise and conditional independence assumptions, with rates and return flow evaluated near one fixed
    point.'
  level: 2
- id: sec:MEMORY-SYMMETRIC
  title: Symmetric weights express diffusion through tuning curves
  summary: The connection matrix W contains the weights from neuron j to neuron i. Equal weights in opposite
    directions allow the projection vector to be expressed through tuning curves under the stated assumptions.
  level: 2
