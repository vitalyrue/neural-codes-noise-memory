chapter_id: ch:MEMORY-DYNAMICS
part_id: part:MECHANISMS
title: Spiking noise produces diffusion along the memory attractor
purpose: Starting from the neural model in Chapter 1, derive the weak-fluctuation approximation and follow
  small disturbances through the circuit to calculate diffusion of a stored value.
