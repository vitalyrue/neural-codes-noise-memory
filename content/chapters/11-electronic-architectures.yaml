chapter_id: ch:ELECTRONIC-ARCHITECTURES
part_id: part:HARDWARE
title: Electronic feedback circuits store and transform neural-like states
purpose: Compare electronic circuits and neuromorphic networks with neural models of persistent activity, eye
  control, and spatial representation. Identify what each architecture stores, how its components interact,
  how noise and readout affect its state, and what each cited result establishes.
role: chapter
page_break_before: true
pedagogical_prerequisites:
- ch:HARDWARE-MEMORY
- ch:MEMORY-DYNAMICS
explicit_render_dependencies: []
discovered_references: []
navigation_dependencies:
- part:HARDWARE
section_list:
- id: sec:ELECTRONIC-OVERVIEW
  title: Electronic architectures can share neural organization while storing different things
  summary: Compare components, connections, states, dynamics, and evidence before equating a circuit with a
    neural mechanism.
  level: 2
- id: sec:ELECTRONIC-FLIPFLOP
  title: A flip-flop maintains one of two states through feedback
  summary: Cross-coupled electronic elements support discrete persistence and restore small disturbances.
  level: 2
- id: sec:ELECTRONIC-MULTILEVEL
  title: Multilevel circuits hold several preferred states
  summary: Feedback can maintain more than two discrete states, with different error behavior from a continuous
    attractor.
  level: 2
- id: sec:ELECTRONIC-RING
  title: Ring networks store a value in the position of an activity bump
  summary: Recurrent excitation and inhibition can support a localized population pattern whose position represents
    a direction.
  level: 2
- id: sec:ELECTRONIC-OSCILLATOR
  title: Oscillator phase can wander while oscillation persists
  summary: Noise can accumulate in the timing of a maintained oscillation; phase and stationary memory coordinates
    have related but distinct dynamics.
  level: 2
- id: sec:ELECTRONIC-SPIKES
  title: Pulse trains and analog states implement different neural variables
  summary: Separate pulses, average rate, filtered state, programmable connection weights, and population representations.
  level: 2
- id: sec:ELECTRONIC-READOUT
  title: Drift and Fisher information measure different limits on memory
  summary: Repeated trials and signal readout ask how memory moves and how precisely a state can be estimated.
  level: 2
