- id: fig:FOUNDATIONS-DIFFUSION-BIAS
  kind: figure
  placement: sec:FOUNDATIONS-DIFFUSION
  asset: assets/approved/visuals/foundations-diffusion-bias.png
  caption: Simulated Brownian teaching paths and analytic displacement scales for $D=0.02$ degrees squared
    per second and $v=0.10$ degrees per second. The upper paths have zero drift and start at zero. The
    dashed envelope is the exact root mean squared displacement, not a boundary on individual paths. Below,
    $\sqrt{2Dt}$ and $vt$ are equal at 4 s, when each is 0.40 degrees. Their squares are the separate
    contributions to the biased model’s MSD. The coordinate is unbounded, and these chosen values are
    not estimates from animal recordings.
  alt: Seven Brownian sample paths move irregularly above and below zero. A dashed positive and negative
    root mean squared envelope grows with the square root of time. Some paths cross it. A second plot
    compares the positive root mean squared displacement with a linearly growing bias displacement. Both
    equal 0.40 degrees at four seconds, after which the bias line is higher.
  width_inches: 7.29167
  html_fold: never
