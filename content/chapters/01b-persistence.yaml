chapter_id: ch:PERSISTENCE
part_id: part:MECHANISMS
title: Stable representations can accumulate error
purpose: Explain the continuous family of states in the 2012 Results, then provide eye mechanics and
  the random-spreading background needed to understand how persistent activity can accumulate error.
