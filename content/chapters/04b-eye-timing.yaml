chapter_id: ch:EYE-TIMING
part_id: part:OBSERVATIONS
title: Drift growth distinguishes diffusion from filtered white noise
purpose: Eye movements recorded during steady gaze in monkeys look different over short and long time intervals.
  This chapter uses their timing to distinguish fluctuations around a fixed command from accumulated changes in
  the command, while accounting for eye-position measurement error.
role: chapter
page_break_before: true
