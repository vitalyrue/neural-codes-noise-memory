chapter_id: ch:MEMORY-READOUT
part_id: part:MECHANISMS
title: Readout accuracy depends on how a moving memory is observed
purpose: Reading spikes from a memory circuit takes time, during which its stored value can keep changing. This
  chapter calculates how much longer observation can help recover the value present at a recall cue, and explains
  why it cannot recover every earlier random displacement.
role: chapter
page_break_before: true
