  caption: "The ideal readout error approaches a limit, while the error of equal weighting rises after its minimum. Original Figure 3 from Burak and Fiete (2012), reproduced as an exact artwork excerpt. [PDF page 4](../papers/burak-fiete-2012-persistent-activity.pdf#page=4). [Open image at full size](../assets/fig-paper-memory-3.png)."
  alt: "Rescaled variance versus observation duration. A solid curve falls toward one. A dashed curve falls then rises. A vertical dotted line marks the dashed curve minimum."
