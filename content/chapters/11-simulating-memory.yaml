chapter_id: ch:SIMULATING-MEMORY
part_id: part:SIMULATIONS
title: Network simulations test how random spikes move a stored value
purpose: To compare a simulated memory trace with Burak and Fiete's (2012) theory, the numerical update
  and the measurement of the stored value must match the model. The foundation chapter explains the spike-update
  cycle, and the long-delay chapter interprets its diffusion tests. Here the additional task is to recover
  the published network settings, distinguish a numerical position measurement from the theoretical coordinate,
  and identify choices left open for an independent reproduction.
