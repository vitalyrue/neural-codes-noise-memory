chapter_id: ch:PLACE-TESTS
part_id: part:OBSERVATIONS
title: Holes and measurements test the spatial explanation
purpose: Recordings show where a hippocampal cell is active as an animal moves through an environment. This chapter
  tests the spatial model against the shapes and arrangement of those regions, then asks what agreement can reveal
  about the inputs and connections that produce them.
role: chapter
page_break_before: true
pedagogical_prerequisites:
- ch:PLACE-FIELDS
- ch:PLACE-SIZES
explicit_render_dependencies: []
discovered_references: []
navigation_dependencies:
- part:OBSERVATIONS
section_list:
- id: sec:PLACE-TOPOLOGY
  title: Holes distinguish maps with the same field count
  summary: Two maps can have the same field count and total active area but different holes. As the activity threshold
    rises, active regions shrink and can split or disappear. The numbers of components and holes can change.
  level: 2
- id: sec:PLACE-DATA
  title: What was fitted and what was tested
  summary: The experiments supply estimated firing rate maps, not the hidden Gaussian input. To assess a prediction,
    we must therefore track both which summaries set its parameters and which processing decisions change the map's
    geometry.
  level: 2
- id: sec:PLACE-WIRING
  title: Random input weights can generate Gaussian maps
  summary: The statistical model becomes biologically useful if it suggests how a circuit could make the maps. A
    random weighted sum of many inputs is one possible mechanism, and the supplement makes its assumptions explicit.
  level: 2
