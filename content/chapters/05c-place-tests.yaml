- id: fig:PLACE-TOPOLOGY
  kind: figure
  placement: sec:PLACE-TOPOLOGY
  asset: assets/approved/visuals/place-topology.png
  caption: "As the threshold rises on one constructed smooth map, components and holes change separately, giving Euler characteristics -1, 0, 4, and 3. The above-threshold regions shrink as the threshold rises, while the Euler characteristic can rise or fall. This illustrative example is not an observed place-field map or a Gaussian-process sample. It illustrates Mainali et al. (2025), Figure 3F–H and STAR Methods Equations 8–10."
  alt: "At q=0.3, the smooth two-dimensional map has one component with two holes and chi minus one. At q=0.5, it has one component with one hole and chi zero. At q=0.8, it has four components with no holes and chi four. At q=1.0, it has three components with no holes and chi three. Each active set is contained in the preceding one as q increases."
  width_inches: 7.29167
  html_fold: never
