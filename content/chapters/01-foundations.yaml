- id: fig:MEMORY-SPIKE-TRACE
  kind: figure
  placement: sec:MEMORY-SPIKES
  asset: assets/approved/visuals/memory-spike-trace.png
  caption: Each spike adds one activation unit, which then decays with a 50 ms time constant. Closely
    spaced spikes add to the activation left by earlier spikes. The five spike times are an illustrative
    input, and the activation is calculated exactly from Burak and Fiete (2012), Eq. 7.
  alt: Five spike marks share a time axis with an activation trace. Each mark aligns with a vertical rise
    of one activation unit. The activation decays smoothly between spikes, and nearby spikes build on
    the remaining activation.
  width_inches: 7.29167
  html_fold: never
- id: fig:FOUNDATIONS-POISSON-POPULATION
  kind: figure
  placement: sec:FOUNDATIONS-POISSON
  asset: assets/approved/visuals/foundations-poisson-population.png
  caption: Analytic teaching construction for the chapter’s 20 Hz, 50 ms example. The count is Poisson
    with mean 1 for one cell and mean 20 for 20 conditionally independent cells. Both panels plot the
    rate per cell $K/(N\Delta t)$, so both estimates have mean 20 Hz. Their standard deviations are 20
    Hz and 4.47 Hz. Each stem is a probability at one possible estimate, rather than a continuous density.
    Only estimates through 100 Hz are drawn. The independence condition concerns fixed modeled rates,
    not complete recurrent spike trains.
  alt: Two discrete Poisson distributions share a rate per cell axis. One cell has widely spaced possible
    estimates at zero, twenty, forty hertz and so on, with probability 0.368 at zero. The twenty cell
    estimate has possible values one hertz apart and clusters around twenty hertz. Their means match,
    but the rate standard deviation falls from twenty to 4.47 hertz.
  width_inches: 7.29167
  html_fold: never
