chapter_id: ch:FOUNDATIONS
part_id: part:MECHANISMS
title: Patterns of variable spikes can represent a value
purpose: Introduce the question and steady-state equation in the 2012 paper, then explain eye mechanics,
  the neural model brought forward from Methods, spike statistics, and a preview of its simulations.
role: chapter
