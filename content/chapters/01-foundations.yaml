section_list:
- id: sec:FOUNDATIONS-EYE-ACTION
  title: Repeated spikes maintain eye muscle tension
  summary: Brief spikes activate the eye muscles. Repeated firing maintains tension, while elasticity,
    viscosity and inertia have different mechanical roles. This physical pathway precedes the eye-angle
    coding example.
  level: 2
- id: sec:MEMORY-SPIKES
  title: Recurrent spikes renew decaying synaptic activity
  summary: Burak and Fiete (2012), Eqs. 7–9, define how spikes renew a decaying activation, weighted activations
    set neural input, and input sets the rate of new spikes. This model precedes coding, noise and stability
    calculations.
  level: 2
- id: sec:FOUNDATIONS-SPIKES
  title: Patterns of firing rates represent a value
  summary: Tuning curves relate expected firing rates to an eye angle or location. A population code represents
    the value across neurons; the rate baseline is distinguished from the model input bias.
  level: 2
- id: sec:FOUNDATIONS-POISSON
  title: A variable spike count at a fixed rate
  summary: A tuning curve describes expected activity, but a brief spike observation can differ each time
    the same value is represented. The 2012 model describes this variability with a [**Poisson process**]{.definition-term
    custom-style="Definition Term"}. At constant rate $r$, the number $K$ of spikes in an interval of
    length $\Delta t$ obeys
  level: 2
- id: sec:FOUNDATIONS-SIMULATION
  title: Network simulations test whether spike noise moves a stored value
  summary: Burak and Fiete (2012) simulate synaptic activations and random spikes in recurrent networks
    with fixed parameters. The ring and mutual-inhibition examples test the predicted memory spreading
    against simulated trajectories; biological recordings are a separate comparison.
  level: 2
- id: sec:FOUNDATIONS-COVARIANCE
  title: Shared neural signals and a biased command leave different signs in eye motion
  summary: Shared neural commands, private spike variability, directional bias and muscle response affect
    different features of eye displacement. Covariance and mean squared displacement help distinguish
    these effects under explicit assumptions.
  level: 2
