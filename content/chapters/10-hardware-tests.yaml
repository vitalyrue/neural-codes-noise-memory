section_list:
- id: sec:HARDWARE-TESTS-PROTOCOL
  title: Repeated cue-and-delay trials separate drift from random spreading
  summary: Begin with a circuit whose joint activity represents an angle. Choose a decoder on separate calibration
    data, then keep it fixed while testing retention. A [[**decoder**]{.definition-term custom-style="Definition
    Term"} is a specified rule for estimating the represented quantity from observable circuit signals.]{.definition-explanation}
    A decoder given every internal state has a different task from a downstream neuron receiving only spikes.
  level: 2
- id: sec:HARDWARE-TESTS-PARAMETERS
  title: Physical parameters act through decay, bias, and noise projection
  summary: A changed component affects memory through the circuit's equations. Increasing a leak current can
    shorten a component time constant. Changing a recurrent weight can alter restoration or introduce a preferred
    angle. A fluctuating current can perturb many neurons, yet only part of the resulting activity change remains
    as a change of the remembered angle.
  level: 2
- id: sec:HARDWARE-TESTS-COMPARISON
  title: Matching time and readout is necessary to compare memory accuracy
  summary: The source papers supply different constraints on this hardware experiment.
  level: 2
