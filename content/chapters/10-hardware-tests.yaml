chapter_id: ch:HARDWARE-TESTS
part_id: part:HARDWARE
title: Memory experiments must separate device error from network dynamics
purpose: The earlier stability comparison followed the response to one disturbance. A memory experiment instead
  repeats a cue and observes what happens as disturbances continue over time. After an angle cue, the estimate
  may be wrong because the state wandered, because unequal connections pull it toward another angle, or because
  the observer reads it poorly. This chapter separates mean motion from trial-to-trial spread, relates spread
  to circuit noise and asks what the output reveals about the state. Its tests and reduced models are proposed
  tools, not results demonstrated on every platform in the preceding chapter.
