chapter_id: ch:NEUROMORPHIC-SYSTEMS
part_id: part:HARDWARE
title: Neuromorphic chips choose where physics performs the calculation
purpose: Suppose we want to study how a noisy network retains an angle. One machine can calculate every state
  update as arithmetic. Another can let capacitor voltages perform part of the dynamics. A third can use material
  conductances to multiply inputs by stored weights. The scientific choice is which physical effects we want
  to control, measure, or exploit. This chapter compares these implementations and then examines recent demonstrations
  of memory and learning.
