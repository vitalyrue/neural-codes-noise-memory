section_list:
- id: sec:NEUROMORPHIC-SYSTEMS-ARCHITECTURES
  title: Digital and analog implementations expose different parts of the neural model
  summary: A useful platform must make the variables of interest accessible. If the question concerns a specific
    noise law, a digital update may allow precise control of the injected noise. If the question concerns physical
    circuit variability, analog dynamics expose that variability directly. Interpreting either choice as a
    biological result requires a matched model and experiment. [[**Hardware calibration**]{.definition-term
    custom-style="Definition Term"} adjusts circuit settings to make measured device responses match requested
    responses more closely.]{.definition-explanation}
  level: 2
- id: sec:NEUROMORPHIC-SYSTEMS-ADVANCES
  title: Recent results improve temporal computation, adaptation, and device stability
  summary: The following studies make progress on different parts of the memory problem. For each, ask what
    information persists and which physical component is responsible.
  level: 2
- id: sec:NEUROMORPHIC-SYSTEMS-LIMITS
  title: Explicit slow memory is a current design choice, with distinct costs
  summary: Fast spiking units can lose earlier inputs before a later decision needs them. One solution is to
    add a slower state that summarizes recent activity and sends input back to the fast units. Sun and colleagues'
    2026 dual-memory-pathway design takes this route. Its proposed digital hardware holds successive slow states
    in [[**registers**]{.definition-term custom-style="Definition Term"}, small, fast digital storage locations]{.definition-explanation},
    and other variables in SRAM. The hardware results came from post-layout simulations, which model a circuit
    after its physical layout has been designed. They were not measurements of a fabricated chip. The weights
    were trained before the evaluated tasks.[^systems-sun]
  level: 2
