chapter_id: ch:SIMULATING-PLACE
part_id: part:SIMULATIONS
title: Random spatial maps test the statistics of place fields
purpose: To reproduce Mainali et al.'s (2025) place-field comparisons, we need the rules for generating
  and fitting model maps, and for measuring both model and recorded maps. The spatial-model chapter explains
  the statistical assumptions, and the tests chapter interprets the evidence. Here the additional detail
  is the Python map-generation procedure, filter and boundary conventions, fitted summaries, field detectors,
  and access to code and recordings. Position is the independent variable; each generated map is fixed
  during analysis, so these computations do not simulate a remembered position changing over time.
