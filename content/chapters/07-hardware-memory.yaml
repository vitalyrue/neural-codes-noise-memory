section_list:
- id: sec:HARDWARE-MEMORY-ROLES
  title: A connection setting shapes activity. The activity can represent a cue
  summary: 'Imagine giving a circuit a brief cue for an angle of $30^\circ$. After the cue ends, a connected
    group of artificial neurons remains active. We estimate the remembered angle from which neurons are active
    and how strongly. The experiment involves:'
  level: 2
- id: sec:HARDWARE-MEMORY-STORAGE
  title: Bits, capacitor voltages, and material conductances store different physical states
  summary: The neural model still needs a physical implementation. If the model has a variable called membrane
    voltage, a chip may store it as a binary number or as an actual circuit voltage. Those choices expose the
    computation to different errors. [[**Current**]{.definition-term custom-style="Definition Term"} is electric
    charge flowing per unit time, measured in amperes (coulombs per second).]{.definition-explanation} [[**Voltage**]{.definition-term
    custom-style="Definition Term"} is an electrical energy difference per unit charge, measured in volts (joules
    per coulomb).]{.definition-explanation}
  level: 2
- id: sec:HARDWARE-MEMORY-UPDATES
  title: The stored state matters through the update it produces
  summary: To understand a machine's memory, follow one input through it. On a digital spiking processor, an
    arriving event identifies connections, their weights contribute to inputs, and a program updates stored
    neuron variables. Those variables determine whether to send further events. Loihi 2 provides local digital
    state and weight memory with programmable neuron and learning rules. SpiNNaker2 uses many processor cores
    whose software updates neural states stored with weights in local SRAM. Their event communication does
    not make every model variable evolve continuously in physical time.[^hardware-intel][^hardware-spinnaker]
  level: 2
