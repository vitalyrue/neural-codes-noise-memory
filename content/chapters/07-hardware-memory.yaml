chapter_id: ch:HARDWARE-MEMORY
part_id: part:HARDWARE
title: A stored weight and a remembered value are different states
purpose: A silicon circuit can keep a connection strength unchanged while losing the angle it was asked to
  remember. It can also keep that angle while its individual electrical signals change. To compare electronic
  memory with the neural memory in Part I, we first need to identify what information each physical quantity
  represents. This chapter separates the connection settings, the changing state of each artificial neuron,
  and the value represented by their joint activity. That separation will let us ask what feedback actually
  preserves.
