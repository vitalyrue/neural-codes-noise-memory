section_list:
- id: sec:SIMULATION-TOOLS-ROUTES
  title: The original code and a teaching reconstruction serve different purposes
  summary: The starting point depends on the intended result. Running the authors' program tests whether its implementation
    produces the reported output. Rebuilding the equations in another program tests whether an independent implementation
    agrees. A smaller teaching model can isolate a mechanism, but its numerical output belongs to that smaller
    model.
  level: 2
- id: sec:SIMULATION-TOOLS-SOFTWARE
  title: Tools should match the operation being tested
  summary: The authors' implementation is the first choice when the goal is to reproduce their figures. Other
    libraries are useful when the goal is to isolate a mechanism or change a model. The following tools have distinct
    roles. The optional tools are suggestions for a new implementation, not claims about what all three papers
    used.
  level: 2
- id: sec:SIMULATION-TOOLS-RESOLUTION
  title: Time and space resolution must preserve the modeled physics
  summary: A simulated trajectory is recorded at finitely many times, and a generated field is sampled at finitely
    many positions. [[**Discretization**]{.definition-term custom-style="Definition Term"} replaces a continuous
    variable such as time or position by a finite set of sample points.]{.definition-explanation} The resulting
    numerical approximation can introduce its own drift, missed spikes, or merged fields.
  level: 2
- id: sec:SIMULATION-TOOLS-RECORD
  title: A useful reproduction saves the choices that determine the conclusion
  summary: 'To reproduce one panel, identify its target quantity before running the model. Figure 2 of Burak and
    Fiete (2012) tests memory diffusion, whereas a field-size histogram in Mainali et al. (2025) tests a spatial
    distribution. The following record connects a computation to the claim it can support:'
  level: 2
